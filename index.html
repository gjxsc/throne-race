<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>4位玩家，1位赢家，0个朋友 · 王座墙棋</title>
<style>
  :root{ --bg:#070b14; --text:#dfe7f5; --dim:#8fa0bd; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #101a30 0%, var(--bg) 60%);
    color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    overflow-x:hidden;
  }
  header{ text-align:center; padding:16px 12px 4px; }
  header h1{
    font-size:clamp(20px,3.4vw,30px); letter-spacing:1px; font-weight:800;
    background:linear-gradient(90deg,#5db9ff,#ff5d8f,#2ee38a,#ffb62e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .tag{ color:var(--dim); font-size:12px; margin-top:4px; letter-spacing:2px;}
  #wrap{ display:flex; gap:18px; align-items:flex-start; justify-content:center; padding:10px 14px 26px; flex:1; width:100%; max-width:1100px;}
  #boardBox{ position:relative; }
  #disasterBar{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px 6px; margin-bottom:8px; padding:6px 10px; border:1px solid #1b2438; border-radius:10px; background:rgba(13,19,34,.82); font-size:12.5px; color:var(--dim); }
  #disasterBar b{ color:var(--text); }
  #disasterBar.soon{ border-color:#8a6d1f; box-shadow:0 0 12px rgba(230,200,90,.28); animation:dbarPulse 1s infinite alternate; }
  @keyframes dbarPulse{ from{ background:rgba(13,19,34,.82); } to{ background:rgba(96,76,22,.38); } }
  canvas{ display:block; border-radius:14px; }
  #side{ width:300px; flex:0 0 300px; display:flex; flex-direction:column; gap:10px;}
  #leftbar{ width:170px; flex:0 0 170px; display:flex; flex-direction:column; gap:10px; align-self:stretch;}
  .logcard{ flex:0 0 auto; height:240px; display:flex; flex-direction:column; overflow:hidden;}
  #logBody{ flex:1 1 auto; min-height:0; overflow-y:auto; font-size:11px; line-height:1.8; color:var(--dim); scrollbar-width:thin;}
  #logBody::-webkit-scrollbar{ width:4px;}
  #logBody::-webkit-scrollbar-thumb{ background:#263252; border-radius:2px;}
  #logBody .lg{ display:flex; gap:5px; align-items:baseline;}
  #logBody .tno{ flex:0 0 auto; font-size:9.5px; color:#4d5a78;}
  #logBody b{ font-weight:700;}
  .lsk{ border:1px solid #263252; border-radius:12px; padding:10px; cursor:pointer; transition:.2s; background:rgba(22,32,58,.45);}
  .lsk .ico{ font-size:26px; line-height:1;}
  .lsk .nm{ font-size:13px; font-weight:700; margin:7px 0 4px; color:var(--text);}
  .lsk .ds{ font-size:11px; color:var(--dim); line-height:1.55;}
  .lsk:hover{ background:#1c2949; border-color:#33447a;}
  .lsk.dis{ opacity:.42; cursor:default; filter:grayscale(.75);}
  .lsk.dis:hover{ background:rgba(22,32,58,.45); border-color:#263252;}
  .lsk.arm{ border-color:#4a5f97; box-shadow:0 0 10px rgba(80,120,220,.45);}
  .lsk.armed{ border-color:#c9a227; box-shadow:0 0 10px rgba(230,200,90,.4); background:rgba(96,76,22,.28); cursor:pointer;}
  .lsk.armed:hover{ border-color:#e6c94f;}
  .lskbtns{ display:flex; gap:6px; margin-top:9px;}
  .lskbtns button{ flex:1; padding:5px 4px; font-size:12px; border-radius:8px;}
  .lslotwrap{ display:flex; gap:8px;}
  .lslot{ flex:1; min-height:48px; border:1.5px dashed #2c3a63; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; transition:.2s;}
  .lslot.mine{ border-style:solid; cursor:pointer;}
  .lslot.mine:hover{ background:#1c2949;}
  .lslot.on{ background:#263250; border-color:#4a5f97; box-shadow:0 0 6px rgba(80,120,220,.5);}
  .card{ background:rgba(13,19,34,.82); border:1px solid #1b2438; border-radius:14px; padding:12px;}
  .card h3{ font-size:12px; color:var(--dim); letter-spacing:2px; margin-bottom:8px; font-weight:600;}
  .prow{ display:flex; align-items:center; gap:8px 5px; padding:6px 8px; border-radius:10px; margin-bottom:6px; transition:.25s; border:1px solid transparent;}
  .prow.active{ background:rgba(255,255,255,.055); border-color:#263250;}
  .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 14px; box-shadow:0 0 8px 1px currentColor; background:currentColor;}
  .pname{ font-size:13px; font-weight:600; flex:1; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .tagyou{ font-size:10px; color:#0a0f1a; background:#cfe0ff; border-radius:6px; padding:1px 5px; font-weight:700; margin-right:3px;}
  .wnum{ font-size:11px; font-weight:700; color:currentColor; white-space:nowrap;}
  .itm{ font-size:13px; }
  .islot{ display:inline-block; min-width:20px; text-align:center; border-radius:6px; padding:1px 2px; margin-left:2px; border:1px solid transparent;}
  .islot.mine{ cursor:pointer; border-color:#2c3a63;}
  .islot.mine:hover{ background:#1c2949;}
  .islot.on{ background:#263250; border-color:#4a5f97; box-shadow:0 0 6px rgba(80,120,220,.5);}
  .islot.empty{ border:1px dashed #2c3a63; color:var(--dim); opacity:.55;}
  .skl{ font-size:13px; }
  .steps{ font-size:11px; color:var(--dim); flex:0 0 auto; text-align:right; white-space:nowrap;}
  button{
    background:#16203a; color:var(--text); border:1px solid #263252; border-radius:10px;
    padding:9px 10px; font-size:13px; cursor:pointer; font-family:inherit; transition:.15s;
  }
  button:hover{ background:#1c2949; border-color:#33447a;}
  button.primary{ background:linear-gradient(135deg,#1a56c9,#3f8cff); border-color:#4f8dff; font-weight:700;}
  button.primary:hover{ filter:brightness(1.12);}
  .btnrow{ display:flex; gap:8px; }
  .btnrow button{ flex:1; }
  select{
    width:100%; background:#16203a; color:var(--text); border:1px solid #263252;
    border-radius:10px; padding:9px 8px; font-size:13px; font-family:inherit; outline:none;
  }
  select:disabled, button:disabled{ opacity:.45; cursor:not-allowed; }
  input{
    width:100%; background:#16203a; color:var(--text); border:1px solid #263252;
    border-radius:10px; padding:9px 10px; font-size:14px; font-family:inherit; outline:none;
  }
  input:focus, select:focus{ border-color:#3f6fd8; }
  .netcode{ font-size:24px; text-align:center; letter-spacing:8px; font-weight:800; color:#fdca00; margin:2px 0 8px;}
  .nrow{ display:flex; align-items:center; gap:8px; padding:3px 6px; font-size:13px;}
  .ndim{ color:var(--dim); font-size:12px; line-height:1.6;}
  #hint{ font-size:12px; color:var(--dim); line-height:1.75;}
  #hint b{ color:var(--text);}
  #overlay{
    position:fixed; inset:0; background:rgba(4,7,14,.72); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #overlay.show{ display:flex;}
  .panel{
    background:linear-gradient(160deg,#121a2e,#0c1220); border:1px solid #27345a;
    border-radius:20px; padding:26px 32px; text-align:center; max-width:430px; width:92%;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .panel h2{ font-size:26px; margin-bottom:6px;}
  .panel .sub{ color:var(--dim); font-size:13px; margin-bottom:16px;}
  #rules{ text-align:left; font-size:13px; line-height:1.9; color:#c6d3ea; margin:4px 0 16px;}
  #rules b{ color:var(--gold, #fdca00);}
  .legend{ display:flex; gap:14px; justify-content:center; margin:8px 0 16px; font-size:12px; color:var(--dim); flex-wrap:wrap;}
  .legend span{ display:flex; align-items:center; gap:5px;}
  .legend i{ width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}
  #draft{
    position:fixed; inset:0; background:rgba(4,7,14,.82); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:60;
  }
  #draft.show{ display:flex;}
  .skrow{ display:flex; gap:12px; margin-top:14px; }
  .skcard{
    flex:1; min-width:110px; background:#0e1628; border:1px solid #27345a; border-radius:14px;
    padding:18px 10px; cursor:pointer; transition:.15s;
  }
  .skcard:hover{ border-color:#fdca00; transform:translateY(-4px); background:#14203a; }
  .skcard .ico{ font-size:30px; }
  .skcard .nm{ font-size:14px; font-weight:700; margin:8px 0 6px; color:#eaf0fb; }
  .skcard .ds{ font-size:11px; color:var(--dim); line-height:1.6; }
  @media (max-width:820px){
    #wrap{ flex-direction:column; align-items:center;}
    #boardBox{ order:-1;}
    #side{ width:100%; max-width:520px; flex:none; flex-direction:row; flex-wrap:wrap;}
    #side .card{ flex:1 1 45%;}
    #leftbar{ width:100%; max-width:520px; flex:none; flex-direction:row; flex-wrap:wrap; align-self:auto;}
    #leftbar .card{ flex:1 1 45%;}
    #leftbar .logcard{ flex:1 1 100%; height:150px;}
    .lskbtns button{ padding:11px 6px; font-size:13px; min-height:44px;}
    .lslot{ min-height:52px;}
    .islot{ min-width:40px; min-height:40px; display:inline-flex; align-items:center; justify-content:center; font-size:17px; padding:2px 5px; margin-left:4px;}
    select{ padding:12px 8px;}
    #side button{ min-height:44px;}
  }
  @media (max-width:480px){
    #side .card, #leftbar .card{ flex:1 1 100%;}
  }
  @media (max-width:520px){
    .panel{ padding:18px 16px; max-height:88vh; overflow-y:auto;}
    #disasterBar{ font-size:11px; padding:4px 8px; margin-bottom:6px; gap:1px 4px;}
    .panel h2{ font-size:20px;}
    .skrow{ flex-direction:column; gap:10px; margin-top:12px;}
    .skcard{ min-width:0; padding:12px 14px; display:grid; grid-template-columns:36px 1fr; column-gap:12px; align-items:center; text-align:left;}
    .skcard .ico{ font-size:26px; grid-row:1 / span 2;}
    .skcard .nm{ margin:0 0 3px;}
    .skcard .ds{ line-height:1.5;}
    .skcard:hover{ transform:none;}
  }
</style>
</head>
<body>
<header>
  <h1>4位玩家，1位赢家，0个朋友</h1>
  <div class="tag">四 人 抢 座 · 墙 棋 大 逃 杀</div>
</header>

<div id="wrap">
  <div id="leftbar">
    <div class="card"><h3>技能</h3><div id="skBarBody"></div></div>
    <div class="card"><h3>道具箱</h3><div id="invBarBody"></div></div>
    <div class="card logcard"><h3>动态</h3><div id="logBody"></div></div>
  </div>
  <div id="boardBox"><div id="disasterBar"></div><canvas id="cv"></canvas></div>
  <div id="side">
    <div class="card">
      <h3>玩家</h3>
      <div id="plist"></div>
    </div>
    <div class="card" id="netCard" style="display:none"></div>
    <div class="card">
      <h3>模式</h3>
      <select id="modeSel">
        <option value="pve">经典 · 我打 3 个 AI</option>
        <option value="hotseat">经典 · 4 人同屏热座</option>
        <option value="sync">同步 · 实时乱斗（我 + 3 AI）</option>
        <option value="syncspec">同步 · 4 AI 实时互坑（观战）</option>
        <option value="spectate">观战 · 4 个 AI 互坑</option>
        <option value="online">🌐 在线 · 好友联机</option>
      </select>
      <div style="height:8px"></div>
      <select id="campSel">
        <option value="free" selected>🗺️ 自由探索 · 关卡任选</option>
        <option value="camp">🏁 闯关模式 · 逐关解锁</option>
      </select>
      <div style="height:8px"></div>
      <select id="levelSel"></select>
      <div style="height:8px"></div>
      <select id="sizeSel">
        <option value="9">地图 9×9 · 紧凑</option>
        <option value="11" selected>地图 11×11 · 标准</option>
        <option value="13">地图 13×13 · 大</option>
        <option value="15">地图 15×15 · 超大</option>
      </select>
      <div style="height:8px"></div>
      <select id="wallSel">
        <option value="5">每人 5 堵墙</option>
        <option value="8" selected>每人 8 堵墙</option>
        <option value="12">每人 12 堵墙</option>
        <option value="16">每人 16 堵墙</option>
        <option value="20">每人 20 堵墙</option>
      </select>
      <div style="height:8px"></div>
      <select id="itemSel">
        <option value="0" selected>道具：关闭</option>
        <option value="3">道具：每 3 秒刷新</option>
        <option value="5">道具：每 5 秒刷新</option>
        <option value="7">道具：每 7 秒刷新</option>
        <option value="10">道具：每 10 秒刷新</option>
      </select>
      <div style="height:8px"></div>
      <select id="disasterSel">
        <option value="3" selected>天灾：每 3 回合降临</option>
        <option value="10">天灾：每 10 回合降临</option>
        <option value="20">天灾：每 20 回合降临</option>
        <option value="0">天灾：关闭</option>
      </select>
      <div style="height:8px"></div>
      <select id="skillSel">
        <option value="1" selected>技能：开局 3 选 1 · 可用 1 次 · 释放后需自己行动 5 次</option>
        <option value="3">技能：开局 3 选 1 · 可用 3 次 · 释放后需自己行动 5 次</option>
        <option value="5">技能：开局 3 选 1 · 可用 5 次 · 释放后需自己行动 5 次</option>
        <option value="10">技能：开局 3 选 1 · 可用 10 次 · 释放后需自己行动 5 次</option>
        <option value="0">技能：关闭</option>
      </select>
      <div style="height:10px"></div>
      <div class="btnrow">
        <button class="primary" id="btnNew">开新一局</button>
        <button id="btnRules">规则</button>
      </div>
      <div style="height:8px"></div>
      <div class="btnrow">
        <button id="btnMute">🔊 音效</button>
        <button id="btnSpeed" title="AI 行棋速度">⚡ 正常</button>
      </div>
    </div>
    <div class="card" id="hint">
      <b>每回合二选一</b><br>
      ① 点击相邻格子 = 走一步（可跳过贴脸的棋子）<br>
      ② 点击格线缝隙 = 放一堵墙（占2格，永久，自己颜色）<br>
      <b>获胜</b>：第一个踏上中央 👑 王座。<br>
      墙不能穿过、不能重叠，也不许把任何人<b>彻底堵死</b>。
    </div>
  </div>
</div>

<div id="overlay"><div class="panel" id="ovPanel"></div></div>
<div id="draft"><div class="panel" id="dPanel"></div></div>

<script>
"use strict";
/* ================= 常量 ================= */
let N = 11;
const THRONE = {x:5, y:5};
const COLORS = {
  blue:  {main:'#0f9ceb', name:'蓝方', rgb:[15,156,235]},
  green: {main:'#17d76c', name:'绿方', rgb:[23,215,108]},
  red:   {main:'#e02955', name:'红方', rgb:[224,41,85]},
  orange:{main:'#f5a307', name:'橙方', rgb:[245,163,7]},
};
const SPAWN = {blue:{x:5,y:0}, green:{x:0,y:5}, red:{x:10,y:5}, orange:{x:5,y:10}};
function setBoardSize(n){          // 四家出生点到王座始终等距
  N = n; const c = (N-1)/2;
  THRONE.x = THRONE.y = c;
  SPAWN.blue = {x:c,y:0}; SPAWN.green = {x:0,y:c}; SPAWN.red = {x:N-1,y:c}; SPAWN.orange = {x:c,y:N-1};
  _bfsRebuild();
}
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
/* ---- BFS/Dijkstra 预分配缓冲（融合自 upstream）：AI 一回合要跑几十上百次 BFS，每次现分配 TypedArray+元组队列+现拼墙键会产生大量 GC，改为模块级复用，每局只随棋盘尺寸重建 ---- */
let _reach, _dist, _q, _keys, _fieldCost, _fieldDone;
function _bfsRebuild(){
  const n2 = N*N, w = N+2;
  _reach = new Uint8Array(n2); _dist = new Int16Array(n2); _q = new Int32Array(n2);
  _fieldCost = new Float32Array(n2); _fieldDone = new Uint8Array(n2);
  _keys = new Array(w*w);                          // 墙键表外扩 1 圈：x-1/y-1 越界键自然不存在，BFS 热路径免边界判断
  for(let y=-1;y<=N;y++) for(let x=-1;x<=N;x++) _keys[(y+1)*w+x+1] = x+','+y;
}
_bfsRebuild();
const kk = (x,y)=>_keys[(y+1)*(N+2)+x+1];          // K(x,y) 的查表版：热路径零字符串拼接
/* ---- 技能池（开局每人随机抽 3 选 1，整局限用 skillMax 次） ---- */
const SKILLS = [
  {id:'breakwall', icon:'💥', name:'墙面爆破', target:'wall', desc:'击碎棋盘上任意一堵墙'},
  {id:'phase',     icon:'👻', name:'穿墙',     target:'wall', desc:'穿过身边一堵墙，落到墙另一侧的空格'},
  {id:'steal',     icon:'🪓', name:'盗取道具', target:'pawn', desc:'夺取一名对手道具箱里的 1 个道具'},
  {id:'swap',      icon:'🔄', name:'换位',     target:'pawn', desc:'与指定角色互换位置'},
  {id:'swapcolor', icon:'🎨', name:'换色',     target:'pawn', desc:'与指定角色互换颜色（棋子与墙）'},
  {id:'freeze',    icon:'❄️', name:'定身术',   target:'pawn', desc:'指定角色 1 回合不可操作（同步模式冻结 3 秒）'},
  {id:'jump',      icon:'🎲', name:'随机跳跃', target:null,   desc:'随机传送到任意空格（不会落到王座附近）'},
  {id:'thronemove',icon:'👑', name:'王座随机换位', target:null, desc:'王座随机迁移到棋盘上另一处'},
  {id:'shuffle',   icon:'🌀', name:'指定角色随机换位', target:'pawn', desc:'把指定角色随机传送到任意空格'},
  {id:'sprint',    icon:'🏃', name:'疾跑',     target:null,   desc:'本回合可行动 2 次（同步模式 +2 操作点）'},
];
const INV_CAP = 2;   // 道具箱容量
/* ---- 关卡配置：特殊格数量为 11×11 基准值，实际按棋盘面积缩放（lvlCount） ---- */
const LEVELS = [
  {id:'grass', icon:'🟩', name:'草原竞技场', diff:1, desc:'经典规则，纯抢座对决'},
  {id:'desert',icon:'🏜️', name:'沙漠遗迹',  diff:2, desc:'踩中暴风被卷到随机风暴旁，捉住骆驼骑 5 回合（每回合多走一步）',
   sandstorm:6, camel:2},
  {id:'ice',   icon:'❄️', name:'冰雪峡谷',  diff:3, desc:'冰面被踩两次即碎裂坠回出生点，暴风雪四处游走，同格被弹飞',
   iceFrac:8, blizzard:6},
  {id:'lava',  icon:'🌋', name:'熔岩天城',  diff:4, desc:'沙漠虫定期砸落弹飞棋子，火山王座喷洒岩浆（踩中眩晕），火龙盘旋喷火',
   worm:4, dragonEvery:50},
];
function lvlCount(base){   // 关卡特殊格数量：以 11×11（121 格）为基准随面积缩放，至少 1 个
  return Math.max(1, Math.round(base * N * N / 121));
}
/* ---- 道具表（宝箱随机开出；stun 开箱即触发不进箱） ---- */
const ITEMS = {
  wall:     {icon:'🧱', name:'城墙',       desc:'点击立即 +1 堵墙'},
  hammer:   {icon:'🔨', name:'碎墙锤',     desc:'点击后选一堵墙击碎'},
  restore:  {icon:'🔋', name:'技能恢复卡', desc:'点击恢复技能使用次数 1 次'},
  trap:     {icon:'🪤', name:'陷阱卡',     desc:'点击空格埋入陷阱（仅自己可见），踩中者掉回出生点'},
  confusion:{icon:'🌀', name:'混乱卡',     desc:'点击一名对手：其下一步方向上下左右颠倒'},
  stun:     {icon:'💫', name:'眩晕',       desc:'开箱即触发：拾取者暂停 1 回合'},

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, gain, slide){
  if (muted) return; const c = ac(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), c.currentTime+dur);
    g.gain.setValueAtTime(gain||.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+.03);
  }catch(e){}
}

/* ================= 规则核心 ================= */
const K=(x,y)=>x+','+y;
const inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;

function blocked(x1,y1,x2,y2){
  if (x2===x1+1) return wallsV.has(K(x2,y1)) || wallsV.has(K(x2,y1-1));
  if (x2===x1-1) return wallsV.has(K(x1,y1)) || wallsV.has(K(x1,y1-1));
  if (y2===y1+1) return wallsH.has(K(x1,y2)) || wallsH.has(K(x1-1,y2));
  if (y2===y1-1) return wallsH.has(K(x1,y1)) || wallsH.has(K(x1-1,y1));
  return true;
}
function pawnAt(x,y){ return players.find(p=>!p.left && p.cell.x===x && p.cell.y===y); }
function cur(){ return players[turnIdx]; }

function bfsFromThrone(wH, wV, avoidLava){   // 复用预分配缓冲：两次调用之间持有旧 reach/dist 会被覆盖（调用方均已审计为用完即弃）
  _reach.fill(0); _dist.fill(-1);
  let head=0, tail=0;
  const si=THRONE.y*N+THRONE.x;
  _reach[si]=1; _dist[si]=0; _q[tail++]=si;
  while(head<tail){
    const c=_q[head++], x=c%N, y=(c/N)|0, d=_dist[c];
    for(const[dx,dy]of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inB(nx,ny) || isCollapsed(nx,ny)) continue;             // 🕳️ 塌陷格视为不可通行（连通性/合法墙位一并感知）
      if (avoidLava && isLava(nx,ny)) continue;                   // 🌋 避岩浆场：岩浆不入图（踩中眩晕亏 1 回合；连通性场仍可踩，防放墙被误拒）
      if (dx===1)  { if (wV.has(kk(nx,y))||wV.has(kk(nx,y-1))) continue; }
      else if(dx===-1){ if (wV.has(kk(x,y))||wV.has(kk(x,y-1))) continue; }
      else if(dy===1) { if (wH.has(kk(x,ny))||wH.has(kk(x-1,ny))) continue; }
      else            { if (wH.has(kk(x,y))||wH.has(kk(x-1,y))) continue; }
      const i=ny*N+nx;
      if(!_reach[i]){ _reach[i]=1; _dist[i]=d+1; _q[tail++]=i; }
    }
  }
  return {reach:_reach, dist:_dist};
}
function everyoneHasPath(wH, wV){
  const {reach} = bfsFromThrone(wH, wV);
  return players.every(p=>p.left || reach[p.cell.y*N+p.cell.x]);
}
function allDists(wH, wV){
  const d1 = bfsFromThrone(wH||wallsH, wV||wallsV, true).dist;   // 🌋 首选避熔岩场：AI 行军/面板距离按"不踩熔岩"计
  const m={}; let stuck=false;
  for(const p of players) if(!p.left){ const d=d1[p.cell.y*N+p.cell.x]; if(d>=0) m[p.color]=d; else stuck=true; }
  if (stuck){                                                    // 无绕路者回退物理场（熔岩当普通格）：烫回也比卡死强
    const d2 = bfsFromThrone(wH||wallsH, wV||wallsV).dist;
    for(const p of players) if(!p.left && m[p.color]===undefined) m[p.color]=d2[p.cell.y*N+p.cell.x];
  }
  return m;
}

function legalMoves(p){
  const res=[]; const {x,y}=p.cell;
  for(const[dx,dy]of DIRS){
    const nx=x+dx, ny=y+dy;
    if(!inB(nx,ny)||blocked(x,y,nx,ny)||isCollapsed(nx,ny)) continue;
    const occ = pawnAt(nx,ny);
    if(!occ){
      res.push({x:nx,y:ny});
    }
    else{
      const jx=nx+dx, jy=ny+dy;   // 直线跳过贴脸棋子
      if(inB(jx,jy)&&!blocked(nx,ny,jx,jy)&&!pawnAt(jx,jy)&&!isCollapsed(jx,jy)) res.push({x:jx,y:jy});
    }
  }
  return res;
}

function wallBoundsOK(kind,x,y){
  return kind==='h' ? (x>=0&&x<=N-2&&y>=1&&y<=N-1)
                    : (x>=1&&x<=N-1&&y>=0&&y<=N-2);
}
function wallClash(kind,x,y){
  if(kind==='h'){
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y&&Math.abs(a-x)<2) return true; }
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x+1&&b===y-1) return true; }
  }else{
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x&&Math.abs(b-y)<2) return true; }
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y+1&&a===x-1) return true; }
  }
  return false;
}
function wallOK(kind,x,y){
  if(!wallBoundsOK(kind,x,y)) return false;
  if(wallClash(kind,x,y)) return false;
  const sH = kind==='h' ? new Set(wallsH) : wallsH;
  const sV = kind==='v' ? new Set(wallsV) : wallsV;
  if(kind==='h') sH.add(K(x,y)); else sV.add(K(x,y));
  return everyoneHasPath(sH, sV);
}
function allWallSpots(){
  const out=[];
  for(let y=1;y<N;y++) for(let x=0;x<N-1;x++) if(wallOK('h',x,y)) out.push(['h',x,y]);
  for(let y=0;y<N-1;y++) for(let x=1;x<N;x++) if(wallOK('v',x,y)) out.push(['v',x,y]);
  return out;
}
function hasAnyAction(p){
  if (legalMoves(p).length) return true;
  return p.walls>0 && allWallSpots().length>0;
}

/* ---- 关卡地形生成：数量按 N 缩放（lvlCount），避开王座/出生点及其邻格，互不重叠 ---- */
function lvlTake(taken){          // 随机取一个可用格：不占王座、不在任何出生点或其上下左右邻格
  for(let t=0;t<400;t++){
    const x=Math.floor(rnd()*N), y=Math.floor(rnd()*N);
    if (x===THRONE.x && y===THRONE.y) continue;
    if (taken.has(x+','+y)) continue;
    let near=false;
    for(const c in SPAWN){ const s=SPAWN[c]; if ((s.x===x&&s.y===y) || Math.abs(s.x-x)+Math.abs(s.y-y)===1){ near=true; break; } }
    if (near) continue;
    taken.add(x+','+y); return {x,y};
  }
  return null;
}
function generateLevel(){
  sandstorms=[]; camels=[]; iceCells=[]; blizzards=[];
  lavaCells=[]; worms=[]; wormRounds=0; dragon=null; volcanoNext=0;
  const L = LEVELS[levelId];
  if (!L || levelId===0) return;   // 第 1 关：无特殊地形
  const taken = new Set();
  // 各关特殊格生成（暴风/岩浆等均可通行，无需连通性复验）
  if (levelId===1){                     // 🏜️ 沙漠遗迹：6 个暴风散布（每 10 回合换位）+ 骆驼随机出生
    for(let i=0;i<lvlCount(L.sandstorm);i++){ const c=lvlTake(taken); if (c) sandstorms.push({x:c.x, y:c.y}); }
    for(let i=0;i<L.camel;i++){ const c=lvlTake(taken); if (c) camels.push({x:c.x, y:c.y}); }
  }
  if (levelId===2){                     // ❄️ 冰雪峡谷：1/8 格冰面随机散落（全员累计可踩 2 次）+ 暴风雪游走（固定 6 个，不随棋盘缩放）
    const want = Math.max(1, Math.floor(N*N/(L.iceFrac||8)));
    for(let i=0;i<want;i++){ const c=lvlTake(taken); if (c) iceCells.push({x:c.x, y:c.y, hp:2}); }
    for(let i=0;i<L.blizzard;i++){ const c=lvlTake(taken); if (c) blizzards.push({x:c.x, y:c.y}); }
  }
  if (levelId===3){                     // 🌋 熔岩天城：4 条沙漠虫分守四边外围 + 火龙起飞 + 火山王座首次下喷倒计时
    for(let i=0;i<4;i++) worms.push({side:i, pos:Math.floor(rnd()*N)});   // side：0上 1右 2下 3左
    dragon = {p: Math.floor(rnd()*4*N), flown:0};   // 外围顺时针序号（edgeAt 换算渲染坐标）
    volcanoNext = 3+Math.floor(rnd()*3);        // 首次喷发：3-5 回合后
  }
}

  else if (!isSyncMode()){ autoPassIfNeeded(); scheduleAI(); }
}

/* ---- 开局选技（每人从 10 个技能随机抽 3 选 1；AI 自动；全选完才开局） ---- */
function startDraft(){
  draft = {offers:{}, picked:{}, queue:[]};
  for(const p of players){
    const pool=[...SKILLS];
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    p.skill=null; p.skillUsed=0; p.skillCd=0;
    p.skillOffer = pool.slice(0,3).map(s=>s.id);
    draft.offers[p.color]=[...p.skillOffer];
    if (p.ai) pickSkill(p, aiPickSkill(p.skillOffer), true);   // AI 按强度选
  }
  draft.queue = players.filter(p=>!p.ai).map(p=>p.color);
  if (!draft.queue.length){ draftDone(); return; }
  showDraft();
}
function pickSkill(p, id, silent){
  if (!p || p.skill || !p.skillOffer.includes(id)) return;
  p.skill=id; p.skillOffer=[];
  if (draft) draft.picked[p.color]=id;
  const s0=SKILLS.find(x=>x.id===id);
  if (s0) logPush('选定技能 '+s0.icon+' '+s0.name, p.color);
  renderPanel();
  if (!silent) sPick();
}
function showDraft(color){
  const c = color || draft.queue[0];             // 本地热座按队列；联机直接指定颜色
  const p = players.find(q=>q.color===c); if (!p){ draftDone(); return; }
  const d=document.getElementById('dPanel');
  d.innerHTML = `<h2><span style="color:${COLORS[p.color].main}">●</span> ${COLORS[p.color].name}：选择本局技能</h2>
    <div class="sub">免费即时 · 整局限用 ${skillMax} 次 · 释放后需自己行动 ${SKILL_CD} 次才可再用 · 全员选完自动开局${draft.deadline?` · <b id="draftCd" style="color:#ff9aa8"></b>`:''}</div>
    <div class="skrow">`+
    draft.offers[p.color].map(id=>{
      const s=SKILLS.find(x=>x.id===id);
      return `<div class="skcard" data-id="${id}"><div class="ico">${s.icon}</div><div class="nm">${s.name}</div><div class="ds">${s.desc}</div></div>`;
    }).join('')+`</div>`;
  document.getElementById('draft').classList.add('show');
  for(const el of d.querySelectorAll('.skcard'))
    el.onclick=()=>onDraftPick(c, el.dataset.id);
  if (draft.deadline) startDraftCd();
}
function startDraftCd(){                     // 选技 30s 倒计时：房主权威计时，客户端随快照里的 deadline 同步显示
  clearInterval(draftCdTimer);
  const upd = ()=>{
    const el = document.getElementById('draftCd');
    if (!draft || !el){ clearInterval(draftCdTimer); return; }
    const left = Math.max(0, Math.ceil((draft.deadline - Date.now())/1000));
    el.textContent = '⏳ '+left+' 秒未选由 AI 代选';
    if (left<=0) clearInterval(draftCdTimer);
  };
  upd();
  draftCdTimer = setInterval(upd, 500);
}
function draftNext(){
  draft.queue = draft.queue.filter(c=>!draft.picked[c]);
  if (draft.queue.length){ showDraft(); return; }
  document.getElementById('draft').classList.remove('show');
  draftDone();
}
function draftDone(){
  clearInterval(draftCdTimer);
  draft = null;
  if (!isSyncMode()){ autoPassIfNeeded(); scheduleAI(); }
}
/* ---- 联机选技：房主权威，各端并行选，30 秒未选按 AI 强度代选 ---- */
function startDraftOnline(){
  clearTimeout(draftTimer);
  draft = {offers:{}, picked:{}, queue:[]};
  for(const p of players){
    const pool=[...SKILLS];
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    p.skill=null; p.skillUsed=0; p.skillCd=0;
    p.skillOffer = pool.slice(0,3).map(s=>s.id);
    draft.offers[p.color]=[...p.skillOffer];
    if (p.ai) pickSkill(p, aiPickSkill(p.skillOffer), true);
  }
  netSkillPicked=false;
  draft.deadline = Date.now()+30000;
  const me = players.find(p=>p.color===myColor && !p.ai && !p.left);
  if (me && !draft.picked[me.color]) showDraft(me.color);   // 房主真人：弹自己的 3 选 1
  else checkNetDraftDone();
  draftTimer = setTimeout(draftTimeout, 30000);
}
function onDraftPick(color, id){
  const p = players.find(q=>q.color===color); if (!p || !draft) return;
  if (!isOnline()){ pickSkill(p, id); draftNext(); return; }   // 本地热座：按队列逐个选
  document.getElementById('draft').classList.remove('show');
  if (net.isHost){ pickSkill(p, id); netEv({type:'skill'}); netFlush(); checkNetDraftDone(); }
  else { netSend({t:'act', a:{type:'skillpick', id}}); netSkillPicked=true; }   // 远端：提交房主，等快照
}
function checkNetDraftDone(){
  if (!draft) return;
  if (players.some(p=>!p.ai && !p.left && !draft.picked[p.color])) return;
  clearTimeout(draftTimer);
  document.getElementById('draft').classList.remove('show');
  draftDone();
  netFlush();                                    // 广播 draft:null，全员开局
}
function draftTimeout(){
  if (!draft) return;
  for(const p of players){
    if (!p.ai && !p.left && !draft.picked[p.color])
      pickSkill(p, aiPickSkill(draft.offers[p.color]||[]), true);
  }
  netEv({type:'skill'}); netFlush();
  checkNetDraftDone();
}
function refreshNetDraft(){                      // 远端收到快照：同步选技遮罩
  const ov=document.getElementById('draft'); if (!ov) return;
  if (!isOnline() || net.isHost || netWatch || !myColor) return;   // 本地/房主：遮罩自己管
  const me = players.find(p=>p.color===myColor && !p.ai && !p.left);
  if (draft && me && !draft.picked[myColor] && !netSkillPicked && draft.offers[myColor])
    showDraft(myColor);
  else
    ov.classList.remove('show');
}

/* ================= 行动执行 ================= */
function spendAP(p){ p.ap = Math.max(0, p.ap-1); p.lastAct = performance.now(); }
function doMove(p, cell){
  if (p.confused){                        // 🌀 混乱：目标格以棋子为中心镜像（上下左右颠倒）
    p.confused = false;
    const mx = 2*p.cell.x - cell.x, my = 2*p.cell.y - cell.y;
    if (legalMoves(p).some(c=>c.x===mx&&c.y===my)){
      cell = {x:mx, y:my};
      logPush('🌀 混乱生效：方向被颠倒！', p.color);
    }                                     // 镜像格不可走：仍按原方向走（混乱落空），避免卡死
  }
  const jump = Math.abs(p.cell.x-cell.x)+Math.abs(p.cell.y-cell.y) > 1;
  p.tween = {fx:p.cell.x, fy:p.cell.y, t0:performance.now()};
  p.cell = {x:cell.x, y:cell.y};
  passStreak = 0; turnCount++;
  if (p.skillCd>0) p.skillCd--;                 // ⏳ 技能冷却：自己每完成一次行动 -1（走子）
  stHit(p, 'steps');                          // 👟 一轮闯关统计：移动步数
  netEv({type:'move', color:p.color, jump});
  logPush(jump?'跳过一个棋子 →('+cell.x+','+cell.y+')':'走一步 →('+cell.x+','+cell.y+')', p.color);
  jump ? sJump() : sMove();
  if (cell.x===THRONE.x && cell.y===THRONE.y){ endGame(p); return; }
  afterStep(p, cell);                    // 落格结算：陷阱 → 宝箱（传送类技能不经过这里，天然不触发）
  if (isSyncMode()){
    if (p.rainBoost){ p.rainBoost=false; toast('🌧️ 暴雨冲刺：本次行动不耗操作点'); }
    else if (p.camel>0){ p.camel--; if (p.camel===0) dropCamel(p); toast('🐪 骆驼疾行：本次行动不耗操作点（剩 '+p.camel+' 回合）'); }
    else spendAP(p);
    tickAll();
    renderPanel();
    return;
  }
  if (p.extraActs>0){ p.extraActs--; toast('💨 疾跑：可再行动一次'); renderPanel(); scheduleAI(); return; }
  nextTurn();
}
function execSmashWall(p, kind, x, y){   // 免费即时：击碎一堵墙（🔨 道具与 💥 墙面爆破共用）
  (kind==='h'?wallsH:wallsV).delete(K(x,y));
  delete wallOwner[kind+' '+K(x,y)];
  sSmash();
  netEv({type:'smash', color:p.color, kind, x, y});
  fx.push({type:'smash', kind, x, y, t0:performance.now()});
  renderPanel();
}
function useHammer(p, kind, x, y){       // 消耗道具箱里的 🔨 并击碎一堵墙
  const i = p.inv.indexOf('hammer');
  if (i<0) return false;
  p.inv.splice(i,1);
  stHit(p, 'items');                          // 🎒 一轮闯关统计：道具使用
  logPush('用 🔨 砸碎一堵墙', p.color);
  execSmashWall(p, kind, x, y);
  return true;
}

/* ---- 技能执行（免费即时：不耗回合/操作点、不结束回合；整局每人限 skillMax 次） ---- */
const paintOf = c => { const q=players.find(x=>x.color===c); return (q && q.paint) || c; };
const cheb = (x,y,c) => Math.max(Math.abs(x-c.x), Math.abs(y-c.y));

function randCell(filter){                     // 随机空格（不在王座上，可附加过滤条件）
  const cands=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if (!pawnAt(x,y) && !isCollapsed(x,y) && !(x===THRONE.x&&y===THRONE.y) && (!filter||filter(x,y))) cands.push({x,y});
  return cands.length? cands[Math.floor(rnd()*cands.length)] : null;
}
function throneMovable(x,y){                   // 王座迁到 (x,y) 是否人人仍有路（临时换座验证）
  const ox=THRONE.x, oy=THRONE.y;
  THRONE.x=x; THRONE.y=y;
  const ok = everyoneHasPath(wallsH, wallsV);
  THRONE.x=ox; THRONE.y=oy;
  return ok;
}
function teleport(pawn, cell, dur){            // 传送并带动滑动动画（默认 90ms；dur 指定长程缓滑，如泥石流卷落随滚石同速）
  pawn.tween = {fx:pawn.cell.x, fy:pawn.cell.y, t0:performance.now(), dur: dur||90};
  pawn.cell = {x:cell.x, y:cell.y};
}
function shieldBlockSkill(p, v, sk){       // 🛡️ 护盾挡下指向性技能：技能照常消耗、效果免疫（特效全员可见）
  v.shield = false;
  p.skillUsed = (p.skillUsed||0)+1;
  p.skillCd = SKILL_CD;                            // 被护盾挡下也照常进入冷却
  stHit(p, 'sabotage');                     // 🗡️ 一轮闯关统计：坑害出手（被护盾挡下也算）
  fx.push({type:'shieldpop', x:v.cell.x, y:v.cell.y, t0:performance.now()});
  netEv({type:'shieldfx', color:v.color});
  netEv({type:'skill', fx:'pick'});
  sPick();
  toast('🛡️ '+COLORS[v.color].name+' 的护盾挡下了 '+sk.icon+' '+sk.name+'！');
  logPush('释放 '+sk.icon+' '+sk.name+'，被 🛡️ 护盾挡下', p.color);
  renderPanel();
  return true;
}

function execSkill(p, id, t){                  // t：{kind,x,y}=墙 / {dx,dy}=穿墙方向 / {color}=角色 / null
  const sk = SKILLS.find(s=>s.id===id);
  if (!sk || p.skill!==id || (p.skillUsed||0)>=skillMax || (p.skillCd||0)>0) return false;
  let done = false;
  switch(id){
    case 'breakwall': {                        // 💥 击碎任意一堵墙（复用锤子逻辑）
      const set = t.kind==='h'?wallsH:wallsV;
      if (!set.has(K(t.x,t.y))) return false;
      execSmashWall(p, t.kind, t.x, t.y);
      done = true; break; }
    case 'phase': {                            // 👻 穿过身边一堵墙，落到另一侧空格
      const nx=p.cell.x+t.dx, ny=p.cell.y+t.dy;
      if (!inB(nx,ny) || isCollapsed(nx,ny) || pawnAt(nx,ny) || !blocked(p.cell.x,p.cell.y,nx,ny)) return false;
      teleport(p, {x:nx,y:ny}); sJump();
      netEv({type:'skill', fx:'jump'}); done = true;
      if (p.cell.x===THRONE.x && p.cell.y===THRONE.y){   // 穿墙直达王座：直接获胜
        p.skillUsed = (p.skillUsed||0)+1; p.skillCd = SKILL_CD; renderPanel(); endGame(p); return true;
      }
      break; }
    case 'steal': {                            // 🪓 夺取目标道具箱里 1 个道具
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p || !v.inv.length) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      p.inv.push(v.inv.pop());
      sPick(); netEv({type:'skill', fx:'pick'});
      toast(COLORS[p.color].name+' 🪓 夺走了 '+COLORS[v.color].name+' 的道具');
      stHit(p, 'sabotage');                   // 🗡️ 一轮闯关统计：坑害对手
      done = true; break; }
    case 'swap': {                             // 🔄 与目标互换位置
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      const a={...p.cell}, b={...v.cell};
      teleport(p, b); teleport(v, a);
      sJump(); netEv({type:'skill', fx:'jump'}); stHit(p, 'sabotage'); done = true; break; }
    case 'swapcolor': {                        // 🎨 与目标互换显示色（棋子与墙）
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      const da=p.paint||p.color, db=v.paint||v.color;
      p.paint=db; v.paint=da;
      sPick(); netEv({type:'skill', fx:'pick'}); stHit(p, 'sabotage'); done = true; break; }
    case 'freeze': {                           // ❄️ 定身：经典=下回合跳过 / 同步=3 秒不能动
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      if (isSyncMode()) v.frozenUntil = performance.now()+3000;
      else v.frozenTurns = 1;
      fx.push({type:'freeze', x:v.cell.x, y:v.cell.y, t0:performance.now()});
      sPick(); netEv({type:'skill', fx:'pick'}); stHit(p, 'sabotage'); done = true; break; }
    case 'jump': {                             // 🎲 随机跳跃（落点距王座 ≥4 格）
      const c = randCell((x,y)=>cheb(x,y,THRONE)>=4);
      if (!c) return false;
      teleport(p, c); sJump(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'thronemove': {                       // 👑 王座随机迁移（离所有棋子 ≥2 格且人人可达）
      const c = randCell((x,y)=>players.every(q=>q.left||cheb(x,y,q.cell)>=2) && throneMovable(x,y));
      if (!c) return false;
      THRONE.x=c.x; THRONE.y=c.y;
      fx.push({type:'throne', x:c.x, y:c.y, t0:performance.now()});
      sWall(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'shuffle': {                          // 🌀 把目标随机传送到任意空格
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      const c = randCell();
      if (!c) return false;
      teleport(v, c); sJump(); netEv({type:'skill', fx:'jump'}); stHit(p, 'sabotage'); done = true; break; }
    case 'sprint': {                           // 🏃 疾跑：经典=本回合多 1 次行动 / 同步=+2 操作点
      if (isSyncMode()) p.ap = Math.min(SYNC_APMAX, p.ap+2);
      else p.extraActs += 1;
      sPick(); netEv({type:'skill', fx:'pick'}); done = true; break; }
  }
  if (!done) return false;
  p.skillUsed = (p.skillUsed||0)+1;
  p.skillCd = SKILL_CD;
  logPush('释放技能 '+sk.icon+' '+sk.name+'（剩 '+Math.max(0,skillMax-p.skillUsed)+'/'+skillMax+' 次，⏳ 自己再行动 '+SKILL_CD+' 次后可再用）', p.color);
  renderPanel();
  return true;
}
function doWall(p, kind, x, y){
  (kind==='h'?wallsH:wallsV).add(K(x,y));
  wallOwner[kind+' '+K(x,y)] = p.color;
  p.walls--;
  passStreak = 0; turnCount++;
  if (p.skillCd>0) p.skillCd--;                 // ⏳ 技能冷却：自己每完成一次行动 -1（放墙）
  sWall();
  netEv({type:'wall', color:p.color, kind, x, y});
  logPush('放了一堵墙', p.color);
  fx.push({type:'wallpop', kind, x, y, t0:performance.now()});
  if (isSyncMode()){
    if (p.rainBoost){ p.rainBoost=false; toast('🌧️ 暴雨冲刺：本次行动不耗操作点'); }
    else spendAP(p);
    tickAll();
    renderPanel();
    return;
  }
  if (p.extraActs>0){ p.extraActs--; toast('💨 疾跑：可再行动一次'); renderPanel(); scheduleAI(); return; }
  nextTurn();
}

const DISASTER_W = {                              // ☄️ 各关天灾权重（💥 大爆炸已道具化移出；🪤 天降陷阱统一降权）

function disasterInfo(kind){ return (DISASTER_SKINS[levelId]||{})[kind] || DISASTERS[kind]; }
function isCollapsed(x,y){ return collapsed.some(c=>c.x===x&&c.y===y); }
function isSandstorm(x,y){ return sandstorms.some(c=>c.x===x&&c.y===y); }   // 🌪️ 沙漠暴风：可通行，踩入被卷到随机暴风旁 1 格
function isLava(x,y){ return lavaCells.some(c=>c.x===x&&c.y===y); }  // 🌋 岩浆：可通行，踩中眩晕 1 回合（火山王座/火龙喷出，存 2 回合）
function isBlizzard(x,y){ return blizzards.some(c=>c.x===x&&c.y===y); } // 🌨️ 暴风雪：可通行，每回合先于玩家移动，同格玩家被弹飞
function shuffleArr(a){                     // 天灾专用洗牌（走 rnd() 种子随机）
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function removeWall(kind,x,y){              // 天灾拆墙：清墙身 + 归属 + 火墙档案（防陈旧档案日后误删同坐标新墙）
  (kind==='h'?wallsH:wallsV).delete(K(x,y));
  delete wallOwner[kind+' '+K(x,y)];
  const fi = fireWalls.findIndex(f=>f.kind===kind&&f.x===x&&f.y===y);
  if (fi>=0) fireWalls.splice(fi,1);
}
function expireDisasters(){                 // 天灾到期结算（仅主机/单机）：火墙烧尽 / 塌陷格恢复
  if (!hostSim() || winner) return;
  const fOut = fireWalls.filter(f=>f.end<=roundNum);
  if (fOut.length){
    for (const f of fOut) removeWall(f.kind, f.x, f.y);
    logPush('☀️ '+fOut.length+' 面火墙烧尽熄灭', null);
  }
  const cOut = collapsed.filter(c=>c.end<=roundNum);
  if (cOut.length){
    collapsed = collapsed.filter(c=>c.end>roundNum);
    for (const c of cOut) fx.push({type:'sinkhole', x:c.x, y:c.y, up:true, t0:performance.now()});
    logPush('🕳️ '+cOut.length+' 个塌陷格恢复如初', null);
  }
}
function giveCamel(p, cm){                   // 🐪 骑上骆驼：5 回合内每回合 +1 行动（轮到自己时兑现）
  const i = camels.indexOf(cm);
  if (i>=0) camels.splice(i,1);
  p.camel = 5;
  netEv({type:'camel', color:p.color, on:1, x:p.cell.x, y:p.cell.y});
  logPush('🐪 '+COLORS[p.color].name+' 骑上了骆驼！5 回合内每回合多走一步', p.color);
}
function dropCamel(p){                       // 🐪 骑乘用尽：骆驼跑向远离使用者的随机格等待下一位骑手
  let best = randCell(), bd = best? Math.abs(best.x-p.cell.x)+Math.abs(best.y-p.cell.y) : 0;
  for(let t=0;t<20;t++){
    const c = randCell();
    if (!c) break;
    const d = Math.abs(c.x-p.cell.x)+Math.abs(c.y-p.cell.y);
    if (d>bd){ bd=d; best=c; }
  }
  if (best) camels.push(best);
  netEv({type:'camel', color:p.color, on:0});
  logPush('🐪 骆驼跑向远方，等待下一位骑手', null);
}
function blizzardTick(){                     // 🌨️ 暴风雪：每回合先于玩家移动——各自随机走 1 步（风穿墙），同格玩家被弹飞到棋盘任意位置
  if (!hostSim() || winner || levelId!==2) return;

}
function desertTick(){                       // 🏜️ 沙漠周期结算：暴风每 10 回合换位 + 骆驼每回合随机走 1 步（走到玩家格=被拾取）
  if (!hostSim() || winner || levelId!==1) return;

      if (!inB(nx,ny) || blocked(cm.x,cm.y,nx,ny)) continue;   // 撞边界/墙：这回合不走

function edgeAt(p){                         // 🌋 外围顺时针序 0..4N-1：上(左→右)→右(上→下)→下(右→左)→左(下→上)，火龙/沙漠虫外围坐标换算
  const P = 4*N;
  p = ((p % P) + P) % P;
  const side = Math.floor(p/N), i = p % N;
  return side===0 ? {side, x:i,     y:0}
       : side===1 ? {side, x:N-1,   y:i}
       : side===2 ? {side, x:N-1-i, y:N-1}
       :           {side, x:0,     y:N-1-i};
}
function sprayLava(n){                      // 🌋 向随机空格喷 n 格岩浆（火山王座/火龙共用），存续 2 回合
  const put = [];
  for(let i=0; i<n*6 && put.length<n; i++){
    const c = randCell((x,y)=>!isLava(x,y) && !(x===THRONE.x && y===THRONE.y));
    if (!c) break;
    lavaCells.push({x:c.x, y:c.y, end: roundNum + 2});
    put.push({x:c.x, y:c.y});
  }
  return put;
}
function wormTick(){                        // 🪱 沙漠虫：每 5 回合（同步 ×4）各自砸入棋盘 1/3 深度，砸中者弹至所在列顶部/底部；砸完换随机外围位
  if (!hostSim() || winner || levelId!==3 || !worms.length) return;
  wormRounds++;
  if (wormRounds < 5) return;
  wormRounds = 0;
  const len = Math.floor(N/3);
  for (const w of worms){
    const cells = [];
    for(let i=0;i<len;i++){
      cells.push(w.side===0 ? {x:w.pos, y:i}        // 上边虫：向下砸
              : w.side===1 ? {x:N-1-i, y:w.pos}     // 右边虫：向左砸
              : w.side===2 ? {x:w.pos, y:N-1-i}     // 下边虫：向上砸
              :             {x:i,     y:w.pos});    // 左边虫：向右砸
    }
    for (const c of cells){
      const q = pawnAt(c.x, c.y);
      if (!q) continue;
      const toTop = w.side===2 || (w.side!==0 && rnd()<0.5);   // 下边虫向上顶弹，上边虫向下底弹，左右虫随机
      let ty = toTop ? 0 : N-1;
      while (ty!==c.y && pawnAt(c.x, ty)) ty += toTop ? 1 : -1;   // 边缘被占则向内退一格
      if (ty===c.y) continue;                                     // 一路占满：无处可弹，原地不动
      fx.push({type:'stun', icon:'🪱', x:c.x, y:c.y, t0:performance.now()});
      teleport(q, {x:c.x, y:ty});
      stHit(q, 'disaster');
      logPush('🪱 '+COLORS[q.color].name+' 被沙漠虫砸中，弹飞至棋盘'+(toTop?'顶部':'底部'), q.color);
    }
    fx.push({type:'wormhit', side:w.side, pos:w.pos, t0:performance.now()});
    netEv({type:'wormhit', side:w.side, pos:w.pos});
    w.pos = Math.floor(rnd()*N);          // 砸完立即起身，换随机外围位待下一次下砸
  }
  sSmash();
}
function volcanoTick(){                     // 🌋 火山王座：岩浆到期熄灭；每 3-5 回合（同步 ×4）喷 4-10 格岩浆，喷在玩家脚下直接眩晕 1 回合
  if (!hostSim() || winner || levelId!==3) return;

function dragonTick(){                      // 🐉 火龙：外围顺时针每回合飞 1 步；飞满 dragonEvery 回合冲顶，中间 3 列放射喷火，碰者回出生点；同场撒 10 宝箱 + 10 岩浆

function rollDisaster(){                     // 按权重随机决定天灾种类（权重随关卡皮肤侧重；无主陷阱>1 时屏蔽天降陷阱）
  const DW = { ...(DISASTER_W[levelId] || DISASTER_W[0]) };
  if (DW.trapfall && traps.filter(t=>!t.o).length > 1) DW.trapfall = 0;   // 无主陷阱>1：本次不降天降陷阱
  let r = rnd()*Object.values(DW).reduce((a,b)=>a+b,0), kind='acid';
  for (const k in DW){ r -= DW[k]; if (r<0){ kind=k; break; } }
  return kind;
}
function maybeDisaster(){                    // 天灾调度：每 N 回合降下一次（roundNum 计）
  if (!disastersOn || winner || !hostSim()) return;

function disasterAcid(){                     // ☔ 酸雨：恰好腐蚀 5 堵墙（不足则全腐蚀），每人 +2 次放墙

function disasterThunder(){                  // ⚡ 暴雷：劈中约 1/10 的随机散布格子，格上棋子眩晕 2 回合
  const cands=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) cands.push({x,y});
  const cells = shuffleArr(cands).slice(0, Math.floor(N*N/10)).map(c=>[c.x,c.y]);
  const dmarked = players.find(q=>q.doomBy && !q.left);        // 🎯 天灾指定：被标者所在格必被劈中
  if (dmarked && !cells.some(([x,y])=>dmarked.cell.x===x&&dmarked.cell.y===y)) cells[0] = [dmarked.cell.x, dmarked.cell.y];
  const hits = players.filter(p=>!p.left && cells.some(([x,y])=>p.cell.x===x&&p.cell.y===y));
  for (const q of hits) if (q.doomBy) q.doomBy = null;         // 命中即消耗标记
  for (const p of hits){ applyStun(p, 2); stHit(p, 'disaster'); }   // 🌪️ 一轮闯关统计：被天灾打中
  logPush(hits.length
    ? '⚡ 暴雷劈中 '+hits.map(p=>COLORS[p.color].name).join('、')+'，眩晕 2 回合'
    : '⚡ 暴雷劈下，无人被击中', null);

function spawnDrop(p){                       // 掉回出生点（出生点被占则滑落到最近空格）
  const s = SPAWN[p.color];
  if (!pawnAt(s.x,s.y) && !isCollapsed(s.x,s.y)){ teleport(p, s); return; }
  let best=null, bd=1e9;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if (pawnAt(x,y) || isCollapsed(x,y) || (x===THRONE.x&&y===THRONE.y)) continue;
    const d = Math.abs(x-s.x)+Math.abs(y-s.y);
    if (d<bd){ bd=d; best={x,y}; }
  }
  if (best) teleport(p, best);
}
function disasterSink(){                     // 🕳️ 地陷：固定 10 格塌陷 3 回合；塌陷格不可移入，塌上者掉回出生点
  const cands=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if (x===THRONE.x&&y===THRONE.y) continue;                                  // 王座不塌
    if (isCollapsed(x,y) || boxes.some(b=>b.x===x&&b.y===y) || traps.some(t=>t.x===x&&t.y===y)) continue;
    if (Object.values(SPAWN).some(s=>s.x===x&&s.y===y)) continue;              // 出生点不塌：保证掉落落点安全
    cands.push({x,y});
  }
  if (!cands.length) return {};
  const picked = shuffleArr(cands).slice(0, Math.min(10, cands.length));
  for (const c of picked){
    collapsed.push({x:c.x, y:c.y, end:roundNum+3});
    fx.push({type:'sinkhole', x:c.x, y:c.y, t0:performance.now()});
  }
  sSmash();
  logPush('🕳️ '+picked.length+' 个格子塌陷（3 回合后恢复）', null);
  for (const p of players){
    if (p.left || !picked.some(c=>c.x===p.cell.x&&c.y===p.cell.y)) continue;
    spawnDrop(p);
    stHit(p, 'disaster');                     // 🌪️ 一轮闯关统计：被天灾打中
    logPush('🕳️ '+COLORS[p.color].name+' 随地面塌陷掉回出生点', p.color);
  }
  return {cells: picked.map(c=>[c.x,c.y])};
}
function disasterRain(){                     // 🌧️ 暴雨：冲走所有玩家道具，每人下回合可多行动一次
  for (const p of players){

function disasterSun(){                      // ☀️ 烈阳：随机点燃 10 面火墙（无主），5 回合后烧尽
  let placed=0;
  for (const s of shuffleArr(allWallSpots().slice())){

    (kind==='h'?wallsH:wallsV).add(K(x,y));

  else logPush('☀️ 烈阳当空，但无处可以起火', null);

function bangReshuffle(actor){                // 💥 大爆炸（传说道具）：王座/玩家/墙面全部随机换位，发动者也被换位
  const owners=[];                           // 先收割真实墙归属（火墙无主，直接炸灭不重放）
  for (const k in wallOwner){
    if (!wallOwner[k]) continue;
    const [x,y]=k.slice(2).split(',').map(Number);
    owners.push([k[0], x, y, wallOwner[k]]);
  }
  wallsH.clear(); wallsV.clear(); wallOwner={}; fireWalls=[]; collapsed=[];
  const pool=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if (!Object.values(SPAWN).some(s=>s.x===x&&s.y===y)) pool.push({x,y});
  shuffleArr(pool);
  const t = pool.pop();                      // 新王座：任意非出生点格
  THRONE.x=t.x; THRONE.y=t.y;
  fx.push({type:'throne', x:t.x, y:t.y, t0:performance.now()});
  const taken = new Set([t.y*N+t.x]);
  for (const p of players){                  // 玩家随机落位：互不重叠、不占王座
    if (p.left) continue;
    const c = pool.find(c=>!taken.has(c.y*N+c.x));
    if (!c) break;
    taken.add(c.y*N+c.x);
    teleport(p, c);
    stHit(p, p===actor ? 'items' : 'disaster');   // 发动者记道具，其余记天灾
  }
  let walls=0;
  for (const s of shuffleArr(allWallSpots().slice())){   // 幸存墙换到全新随机位置（owner 保留）
    if (walls>=owners.length) break;
    const [kind,x,y]=s;
    if (!wallOK(kind,x,y)) continue;
    (kind==='h'?wallsH:wallsV).add(K(x,y));
    wallOwner[kind+' '+K(x,y)] = owners[walls][3];
    walls++;
  }
  sSmash(); sWall();
  logPush('💥 '+(actor ? COLORS[actor.color].name+' 引爆' : '')+'大爆炸！棋盘格局重组（'+walls+'/'+owners.length+' 堵墙幸存）', actor ? actor.color : null);
  return {tx:THRONE.x, ty:THRONE.y};
}
function useBangItem(p){                   // 💥 大爆炸道具：消耗并引爆（免费即时动作，不占回合）
  const i = p.inv.indexOf('bang');
  if (i<0) return false;
  p.inv.splice(i,1);
  bangReshuffle(p);
  sPick(); renderPanel();
  return true;
}
function useDoomItem(p, v){                 // 🎯 天灾指定：标记对手，下次暴雷/泥石流必命中
  const i = p.inv.indexOf('doom');

function useMegaphoneItem(p){               // 📢 大喇叭：4 格震动波，墙全碎 + 敌方棋子射线弹飞到棋盘边缘
  const i = p.inv.indexOf('megaphone');
  if (i<0) return false;
  p.inv.splice(i,1);
  stHit(p, 'items');
  const cx=p.cell.x, cy=p.cell.y;
  const d2 = (x,y)=>Math.abs(x-cx)+Math.abs(y-cy);
  let smashed=0;
  for (const key of [...wallsH]){                    // 横墙 (x,y) 覆盖 (x,y)/(x+1,y)，取较近者计距
    const [x,y]=key.split(',').map(Number);
    if (Math.min(d2(x,y), d2(x+1,y))<=4){ fx.push({type:'smash', kind:'h', x, y, t0:performance.now()}); removeWall('h', x, y); smashed++; }
  }
  for (const key of [...wallsV]){
    const [x,y]=key.split(',').map(Number);
    if (Math.min(d2(x,y), d2(x,y+1))<=4){ fx.push({type:'smash', kind:'v', x, y, t0:performance.now()}); removeWall('v', x, y); smashed++; }
  }
  let blown=0;
  for (const q of players){                          // 敌方棋子：沿 使用者→该棋子 射线推到边缘；落点被占/王座则回收
    if (q===p || q.left || d2(q.cell.x,q.cell.y)>4) continue;
    const dx=Math.sign(q.cell.x-cx), dy=Math.sign(q.cell.y-cy);
    let lx=q.cell.x, ly=q.cell.y;
    while (lx+dx>=0 && lx+dx<N && ly+dy>=0 && ly+dy<N){ lx+=dx; ly+=dy; }
    while ((lx!==q.cell.x||ly!==q.cell.y) && (pawnAt(lx,ly) || (lx===THRONE.x&&ly===THRONE.y))){ lx-=dx; ly-=dy; }
    if (lx!==q.cell.x || ly!==q.cell.y){ teleport(q, {x:lx, y:ly}); blown++; }
    stHit(q, 'disaster');
  }
  fx.push({type:'quake', x:cx, y:cy, t0:performance.now()});
  sSmash();
  logPush('📢 大喇叭震动波：'+smashed+' 堵墙震碎'+(blown?'，'+blown+' 名棋子被震飞到棋盘边缘':''), p.color);
  sPick(); renderPanel();
  return true;
}

    if (p.cell.x!==nx || p.cell.y!==ny) break;   // 陷阱/暴风改写了落点：终止
  }

function useMushroomItem(p){                // 🍄 蘑菇：向王座方向 BFS 贪心连冲 2 格（途中照常结算）
  const i = p.inv.indexOf('mushroom');

  const dist = bfsFromThrone(wallsH,wallsV).dist;
  let steps=0;
  while (!winner && steps<2){
    const {x,y} = p.cell;
    let best=null, bd=dist[y*N+x];
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if (!inB(nx,ny) || blocked(x,y,nx,ny) || isCollapsed(nx,ny) || pawnAt(nx,ny)) continue;
      if (dist[ny*N+nx] < bd){ bd=dist[ny*N+nx]; best={x:nx,y:ny}; }
    }
    if (!best) break;
    doMove(p, best);
    steps++;
    if (p.cell.x!==best.x || p.cell.y!==best.y) break;   // 陷阱/暴风改写落点
  }

function disasterTrapfall(){                // 🪤 天降陷阱：随机埋 5 个无主隐形陷阱（触发前全员不可见，邻近 ⚠️ 预警）

    if (trapAt(x,y) || boxAt(x,y) || pawnAt(x,y)) continue;

    cands.push({x,y});
  }
  const picked = shuffleArr(cands).slice(0, Math.min(5, cands.length));
  for (const c of picked) traps.push({x:c.x, y:c.y, o:null});       // o:null 无主：canSeeTrap 对全员隐藏
  logPush(picked.length

    : '🪤 天降陷阱落下，但棋盘上已无处可埋', null);

let gameSeq = 0;                             // 对局代际：泥石流滚石等延迟结算跨局作废（重开/换局后旧定时器不再落子）
function disasterMudflow(){                 // 🪨 泥石流：随机 1/5 列滚石自顶轰到底；滚石压到哪行才碎哪行的墙、卷走哪行的棋子——被卷者随滚石同速坠至该列底部；每破一墙全员 +1 堵墙
  const seq = gameSeq;
  const picked = shuffleArr(Array.from({length:N},(_,x)=>x)).slice(0, Math.max(1, Math.floor(N/5)));
  const dmq = players.find(q=>q.doomBy && !q.left);            // 🎯 天灾指定：被标者所在列必被选中
  if (dmq){ if (!picked.includes(dmq.cell.x)) picked[0] = dmq.cell.x; dmq.doomBy = null; }   // 列入即消耗
  let broken=0; const carried=new Set();
  for(let y=1;y<N;y++){                     // 逐行延迟：滚石（二次缓动 Y=CELL/2+mt²·板高，全程 1600ms）中心压过第 y 行的时机
    setTimeout(()=>{
      if (seq!==gameSeq || winner) return;
      let hit=false;
      for (const x of picked){
        for (const wx of [x, x-1]){         // 横墙 (wx,y) 覆盖列 wx~wx+1，挡住 x 列即被撞碎
          if (wx>=0 && wallsH.has(K(wx,y))){
            fx.push({type:'smash', kind:'h', x:wx, y, t0:performance.now()});
            removeWall('h', wx, y);
            netEv({type:'smash', kind:'h', x:wx, y});   // 远端补播碎墙特效（状态随快照走）
            broken++; hit=true;
          }
        }
        const q = pawnAt(x,y);              // 滚石压到才卷走：撞点特效 + 与滚石余程同速滑落该列底部
        if (q && !carried.has(q)){
          carried.add(q);
          fx.push({type:'stun', icon:'🪨', x, y, t0:performance.now()});
          let ly=N-1;
          while (ly>y && pawnAt(x,ly)) ly--;   // 底部被占则退到该列最近空格
          const dur = Math.max(150, Math.round(1600*(1-Math.sqrt(y/N))));
          teleport(q, {x, y:ly}, dur);
          stHit(q, 'disaster');              // 🌪️ 一轮闯关统计：被天灾打中
          logPush('🪨 '+COLORS[q.color].name+' 被滚石卷至棋盘底部', q.color);
          netEv({type:'mudhit', x, y, color:q.color, dur});
          hit=true;
        }
      }
      if (hit) sSmash();
    }, Math.round(1600*Math.sqrt(y/N)));
  }
  setTimeout(()=>{                          // 滚石落定后结算：墙数馈赠 + 战报（broken/carried 此时才最终确定）
    if (seq!==gameSeq) return;
    if (broken){ const comp = Math.min(broken,3); for (const p of players){ if (!p.left) p.walls += comp; } }   // 碎墙补偿封顶 3（防后期墙库通胀）
    renderPanel();
    logPush('🪨 泥石流！'+picked.length+' 列滚石轰下'+(broken?'，撞碎 '+broken+' 堵墙（全员各 +'+Math.min(broken,3)+' 堵墙）':'')+(carried.size?'，卷走 '+[...carried].map(c=>COLORS[c.color].name).join('、'):''), null);
  }, 1700);
  return {cols:picked};                     // 破坏数/卷走名单由延迟结算产生，经战报与快照同步
}

  if (winner) return;
  cur().extraActs=0;                       // 疾跑加行动只在当回合有效（防 pass 残留）
  turnIdx = (turnIdx+1)%players.length;
  if (turnIdx===0){                        // 全员轮完 = 1 回合结束：环境结算一次（tick 用旧回合数），再推进——动态机制全部按回合而非按角色行动计
    expireDisasters();                     // 天灾到期结算：地陷恢复 / 火墙熄灭
    blizzardTick();                        // 🌨️ 冰雪峡谷：暴风雪先于玩家移动（同格玩家被弹飞）
    desertTick();                          // 🏜️ 沙漠遗迹：暴风换位 / 骆驼走动
    wormTick();                            // 🪱 沙漠虫：砸入弹飞（每 5 回合一砸，按轮计）
    volcanoTick();                         // 🌋 火山王座：岩浆到期熄灭 / 周期喷发
    dragonTick();                          // 🐉 火龙：外围飞行 / 冲顶喷火（每轮回合一飞）
    maybeDisaster();                       // ☄️ 天灾：每 3 回合降下一次（每轮至多一次）
    roundNum++;                            // 全员轮完 → 新一轮（回合以所有玩家结束为准）
  }
  const npx = players[turnIdx];             // 🌑 日蚀：被遮蔽者回合开始时递减
  if (npx && npx.blindRounds>0) npx.blindRounds--;
  let guard = players.length*2;            // 防多人同时被定身导致死循环
  while (guard-- > 0 && !winner){
    const f = cur();
    // 🐪 骆驼骑乘：轮到骑手时兑现 +1 行动并扣 1 骑乘回合（定身/眩晕跳过也照常计时），用尽后骆驼跑远
    if (hostSim() && !winner && f.camel>0 && !f.left){
      f.camel--;
      f.extraActs++;
      toast('🐪 骆驼疾行：'+COLORS[f.color].name+' 本回合可多走一步（剩 '+f.camel+' 回合）');
      if (f.camel===0) dropCamel(f);
    }
    if (f.frozenTurns>0 && !f.left){       // ❄️ 定身 / 💫 眩晕：跳过该回合
      f.frozenTurns--;
      const st = f.stunTag;
      if (f.frozenTurns<=0) f.stunTag = false;
      toast((st?'💫 ':'❄️ ')+COLORS[f.color].name+(st?' 眩晕中，跳过回合':' 被定身，跳过回合'));
      logPush(st?'💫 眩晕中，跳过回合':'❄️ 被定身，跳过回合', f.color);
      netEv({type:'pass', color:f.color});
      passStreak++;
      turnIdx = (turnIdx+1)%players.length;
      continue;
    }
    if (f.rainBoost){                      // 🌧️ 暴雨加成：轮到该玩家时兑现 +1 次行动
      f.rainBoost = false; f.extraActs++;
      toast('🌧️ 暴雨加成：'+COLORS[f.color].name+' 本回合可多行动一次');
    }
    break;
  }
  renderPanel();
  autoPassIfNeeded();
  scheduleAI();
}
function autoPassIfNeeded(){
  if (winner) return;
  const p = cur();
  if (!hasAnyAction(p)){
    // 兜底救助：完全被困时尝试随机传送至安全位置
    const safeCell = randCell((x,y)=>{
      const tmp={cell:{x,y}, left:false};
      return legalMoves(tmp).length>0;   // 目标格至少有1步可走
    });
    if (safeCell){
      if (p.ai){
        // AI：自动传送
        teleport(p, safeCell);
        passStreak = 0;
        sJump();
        toast(COLORS[p.color].name+' 被困住了，随机传送脱困！');
        logPush('🧭 '+COLORS[p.color].name+' 被困住了，传送至 ('+safeCell.x+','+safeCell.y+') 脱困', p.color);
        netEv({type:'rescue', color:p.color, x:safeCell.x, y:safeCell.y});
        renderPanel();
        scheduleAI();
        return;
      }
      // 人类玩家：弹窗提示
      rescuePopup(p, safeCell);
      return;   // 弹窗回调里继续流程
    }
    // 无安全位置可传送 → 跳过
    toast(COLORS[p.color].name+' 无路可走，跳过');
    logPush('无路可走，跳过回合', p.color);
    netEv({type:'pass', color:p.color});
    passStreak++;
    if (passStreak >= players.length*2){ endDraw(); return; }
    turnIdx = (turnIdx+1)%players.length;
    renderPanel();
    autoPassIfNeeded();
  }
}

  {icon:'🗡️', name:'坑害之王', desc:'坑害对手最多（技能+陷阱）', key:'sabotage'},

  const crownOf = (c,k)=> base[c] + bonus.slice(0,k).reduce((n,b)=>n+((b.w&&b.w.color===c)?1:0), 0);

function toast(t){ toastMsg={text:t, t0:performance.now()}; }

/* ================= AI ================= */
function scheduleAI(){
  if (winner) return;
  const p = cur();
  if (p.ai){
    clearTimeout(aiTimer);
    aiTimer = setTimeout(()=>{ if(!winner && cur()===p && p.ai) aiTurn(); }, fastAI?16:110);
  }
}
function aiTurn(){
  const p = cur();
  if (winner || !p.ai) return;
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  const minOppD = Math.min(...opps.map(q=>dists[q.color]));

  const hammerIdx = p.inv.indexOf('hammer');
  if (hammerIdx>=0){                            // 有锤子：先免费砸一堵对自己最有利的墙
    const sm = bestSmash(p);
    if (sm){ p.inv.splice(hammerIdx,1); execSmashWall(p, sm[0], sm[1], sm[2]); }
  }
  aiUseSkill(p);                                // 技能：免费即时，择机自动放
  aiUseItems(p);                                // 道具：免费即时，择机自动用
  if (winner) return;
  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ aiAct(p, 'move', bestToward(p, ms)); return; }
  }
  // 评估放墙
  const lead = opps.slice().sort((a,b)=>dists[a.color]-dists[b.color])[0];   // 🎯 领先者：重点打击对象
  const behind = lead && dists[lead.color] < myD;                            // 🎯 我落后：放墙阈值下调，出手更凶
  let bestWall=null, bestScore=(behind? 1.0 : 1.6) + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>160) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0, rawGain=0;
      for(const q of opps){
        const before=dists[q.color], after=d2[q.color];
        const gain=after-before;
        if(gain>0){ rawGain+=gain; hurt += gain * (1 + Math.max(0,(6-before))*0.35) * (q===lead?1.2:1); }   // 🎯 拖领先者更值
      }
      const selfCost = d2[p.color] - myD;              // 正 = 自己的路被这堵墙延长
      if (selfCost > 0 && rawGain <= selfCost*2) continue;   // 自路受损时，拖对手总量必须≥2倍自损才值得
      const score = hurt - selfCost*3 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (!bestWall && minOppD<=3 && p.walls>0){
    // 紧急封堵：对手逼近王座，找一堵“拖住对手且不坑自己”的墙，评分选优
    const spots=allWallSpots().sort(()=>rnd()-0.5);
    let bestGuard=null, bestGuardScore=0;
    for(const [k,x,y] of spots){
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2=allDists(sH,sV);
      const selfCost = d2[p.color] - myD;
      if (selfCost > 1) continue;                    // 紧急时刻也最多容忍自损 1 步
      let hurt=0;
      for(const q of opps){
        const g=d2[q.color]-dists[q.color];
        if(g>0) hurt += g;
      }
      if (hurt <= selfCost) continue;                // 拖对手的量必须 strictly 大于自损
      const s = hurt - selfCost*2;
      if (s > bestGuardScore){ bestGuardScore=s; bestGuard=[k,x,y]; }
    }
    if (bestGuard) bestWall=bestGuard;
  }
  if (bestWall && rnd()>0.06){ aiAct(p,'wall',bestWall); return; }
  const ms=legalMoves(p);
  if (ms.length) aiAct(p,'move',bestToward(p,ms));
  else if (bestWall) aiAct(p,'wall',bestWall);
  else {                                          // 兜底：无路可走又无可心之墙（如被泥石流卷到底后被围死）→ 随手放一堵合法墙或跳过，回合链永不断裂
    const spots = p.walls>0 ? allWallSpots() : [];
    if (spots.length) aiAct(p,'wall', spots[Math.floor(rnd()*spots.length)]);
    else {
      logPush('无路可走，跳过回合', p.color); netEv({type:'pass', color:p.color});
      passStreak++;
      if (passStreak >= players.length*2){ endDraw(); return; }

}
function aiField(p){                    // 🤖 AI 个体感知场：地形危险加权、资源打折的 Dijkstra 距离（从王座反向扩散，代价=进入该格）
  const cost = _fieldCost.fill(Infinity);   // 复用预分配缓冲：调用方 bestToward 同步读完毕即弃，无跨调用持有
  const done = _fieldDone.fill(0);
  const step = (x,y)=>{
    if (isCollapsed(x,y) || isLava(x,y)) return Infinity;        // 🕳️ 塌陷不可入 / 🌋 岩浆不踩（沿用避岩浆语义）
    if (isSandstorm(x,y)) return 5;                              // 🌪️ 暴风：随机传送，大亏
    if (levelId===2){
      const ice = iceCells.find(c=>c.x===x&&c.y===y);
      if (ice) return ice.hp<=1 ? 7 : 1.5;                       // 🧊 快碎的冰≈坠回出生点；完整冰轻代价
    }
    if (isBlizzard(x,y)) return 4;                               // 🌨️ 暴风雪：同格弹飞
    if (levelId===2 && !isBlizzard(x,y)){                        // 🌨️ 邻格轻防：暴风雪每回合先动，可能移过来
      for(const[dx,dy]of DIRS) if (isBlizzard(x+dx,y+dy)) return 1.6;
    }
    if (levelId===1 && !(p.camel>0) && camels.some(c=>c.x===x&&c.y===y)) return 0.3;   // 🐪 骆驼：5 回合 +1 行动，强吸引
    if (p.inv.length < INV_CAP && boxAt(x,y)) return 0.6;        // 🎁 宝箱：等价允许小绕路拾取
    return 1;
  };
  cost[THRONE.y*N+THRONE.x]=0;
  for(;;){                          // Dijkstra：N²≤225 节点，线性扫最小值足够快
    let bi=-1, bd=Infinity;
    for(let i=0;i<N*N;i++) if(!done[i]&&cost[i]<bd){bd=cost[i];bi=i;}
    if (bi<0) break;
    done[bi]=1;
    const x=bi%N, y=(bi/N)|0;
    for(const[dx,dy]of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inB(nx,ny)) continue;
      if (dx===1)  { if (wallsV.has(K(nx,y))||wallsV.has(K(nx,y-1))) continue; }
      else if(dx===-1){ if (wallsV.has(K(x,y))||wallsV.has(K(x,y-1))) continue; }
      else if(dy===1) { if (wallsH.has(K(x,ny))||wallsH.has(K(x-1,ny))) continue; }
      else            { if (wallsH.has(K(x,y))||wallsH.has(K(x-1,y))) continue; }
      const nc = cost[bi] + step(nx,ny);
      if (nc < cost[ny*N+nx]) cost[ny*N+nx]=nc;
    }
  }
  return cost;
}
function bestToward(p, ms){
  const dist = aiField(p);           // 🤖 加权感知场选路：避暴风/碎冰/暴风雪/岩浆，追骆驼/宝箱
  let best=ms[0], bd=Infinity;
  for(const c of ms){ const d=dist[c.y*N+c.x]; if(d<bd){bd=d;best=c;} }
  return best;
}
function aiUseItems(p){                      // 免费道具：AI 择机自动用——策略层（拦截/防御/最优目标）+ 保底释放层（35% 随性开溜保证娱乐性）
  const dists = allDists();
  const myD = dists[p.color];
  const foes = players.filter(q=>q!==p && !q.left);
  if (!foes.length) return false;
  const threat = foes.slice().sort((a,b)=>dists[a.color]-dists[b.color])[0];   // 全场离王座最近的敌人：拦截与标记目标
  const td = dists[threat.color];
  const iR = p.inv.indexOf('restore');
  if (iR>=0 && skillsOn && p.skill && (p.skillUsed||0)>0){    // 🔋 技能用过才恢复（次数+1，不超上限）
    p.inv.splice(iR,1); p.skillUsed=Math.max(0,(p.skillUsed||0)-1); stHit(p, 'items');
    sPick(); renderPanel(); logPush('使用 🔋 技能恢复卡，技能已刷新', p.color);
    return true;
  }
  if (myD<=1 && legalMoves(p).some(c=>c.x===THRONE.x&&c.y===THRONE.y)) return false;   // 0️⃣ 快赢省资源：下一步直达王座就走

    if (p.inv.indexOf('blueshell')>=0 && useBlueShellItem(p)) return true;
    if (p.inv.indexOf('hourglass')>=0 && myD<=7 && useHourglassItem(p)) return true;
    if (p.inv.indexOf('eclipse')>=0 && useEclipseItem(p)) return true;
  }
  if (p.inv.indexOf('shield')>=0 && !p.shield){   // 2️⃣ 威胁防御：领跑或贴脸敌人才开盾（不白开）

    const iAmLeader = foes.every(q=>dists[q.color] >= myD);
    if ((nearFoe || iAmLeader) && useShieldItem(p)) return true;
  }
  if (p.inv.indexOf('doom')>=0 && useDoomItem(p, threat)) return true;   // 3️⃣ 定点标记：标全场最近敌人（领先时反标追击者）
  if (p.inv.indexOf('megaphone')>=0){    // 4️⃣ 📢 范围内敌≥1 或墙≥2 → 震（踢飞+碎墙总有戏剧效果）
    const cx=p.cell.x, cy=p.cell.y, md=(x,y)=>Math.abs(x-cx)+Math.abs(y-cy);
    let wn=0, en=0;
    for (const key of wallsH){ const [x,y]=key.split(',').map(Number); if (Math.min(md(x,y),md(x+1,y))<=4) wn++; }

      if (!selfHit && sc>bs){ bs=sc; best=[ddx,ddy]; }
    }
    if (best && useBombItem(p, best[0], best[1])) return true;
  }
  if (p.inv.indexOf('shell')>=0 || p.inv.indexOf('boomerang')>=0){   // 🐢🪃 四方向模拟，选命中目标价值最高（dist 最小）的方向
    let best=null, bt=1e9;
    for (const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      let x=p.cell.x, y=p.cell.y, q0=null;
      for (let s=0;s<6;s++){
        const nx=x+ddx, ny=y+ddy;
        if (!inB(nx,ny) || blocked(x,y,nx,ny)) break;
        x=nx; y=ny;
        const q=pawnAt(x,y);
        if (q && q!==p && !q.left){ q0=q; break; }
      }
      if (q0 && dists[q0.color] < bt){ bt=dists[q0.color]; best=[ddx,ddy]; }
    }
    if (best){
      if (p.inv.indexOf('shell')>=0) return useShellItem(p, best[0], best[1]);
      return useBoomerangItem(p, best[0], best[1]);
    }
  }
  if (p.inv.indexOf('mushroom')>=0 && useMushroomItem(p)) return true;   // 5️⃣ 赶路：🍄 BFS 贪心几乎总正收益
  if (p.inv.indexOf('skate')>=0){        // ⛸️ 四方向冲刺终点 dist 最小化
    const sdist = bfsFromThrone(wallsH,wallsV).dist;
    const cur = sdist[p.cell.y*N+p.cell.x];
    let ok=false, bdn=cur;
    for (const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      let x=p.cell.x, y=p.cell.y;

        const nx=x+ddx, ny=y+ddy;

  if (p.inv.indexOf('dice')>=0 && p.inv.length < INV_CAP && useDiceItem(p)) return true;   // 6️⃣ 🎲 道具箱未满才掷（满箱 6 号面作废）

  }
  if (p.inv.indexOf('trap')>=0 && td<=4){        // 🪤 埋在最近威胁下一步
    const {dist}=bfsFromThrone(wallsH,wallsV);
    const cands = legalMoves(threat).sort((a,b)=>dist[a.y*N+a.x]-dist[b.y*N+b.x]);
    for(const c of cands){ if (useTrapItem(p, c.x, c.y)) return true; }
  }
  if (p.inv.indexOf('bang')>=0){            // 7️⃣ 绝地反击：💥 垫底（无人比我更远）或无路可走 → 引爆
    if ((foes.length && foes.every(q=>dists[q.color] <= myD)) || !legalMoves(p).length){
      useBangItem(p);
      return true;
    }
  }
  if (rnd() < 0.35 && p.inv.length){        // 8️⃣ 🎉 保底释放：整回合没用出 → 35% 随性开溜一件（娱乐性保险丝；💥🔋除外）
    const pool = p.inv.filter(k => k!=='bang' && k!=='restore');
    shuffleArr(pool);
    for (const k of pool){
      const ok = k==='blueshell'?useBlueShellItem(p)
               : k==='hourglass'?useHourglassItem(p)
               : k==='eclipse'?useEclipseItem(p)
               : k==='dice'?useDiceItem(p)
               : k==='mushroom'?useMushroomItem(p)
               : k==='fakebox'?useFakeBoxItem(p)
               : k==='shield'?useShieldItem(p)
               : k==='megaphone'?useMegaphoneItem(p)
               : k==='doom'?useDoomItem(p, threat)
               : k==='skate'?useSkateItem(p)
               : k==='confusion'?useConfusionItem(p, threat)
               : (k==='shell'||k==='boomerang'||k==='bomb') ? (()=>{   // 方向类：任选合法方向发射
                   for (const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
                     const f = k==='shell'?useShellItem(p,ddx,ddy) : k==='bomb'?useBombItem(p,ddx,ddy) : useBoomerangItem(p,ddx,ddy);
                     if (f) return true;
                   }
                   return false; })()
               : k==='trap' ? (()=>{
                   const {dist}=bfsFromThrone(wallsH,wallsV);
                   const cands = legalMoves(threat).sort((a,b)=>dist[a.y*N+a.x]-dist[b.y*N+b.x]);
                   for (const c of cands){ if (useTrapItem(p, c.x, c.y)) return true; }
                   return false; })()

function aiAct(p, kind, arg){

  setTimeout(()=>{
    busy = false;
    if (winner) return;
    if (kind==='move') doMove(p, arg);

/* ---- 同步模式：实时驱动 ---- */
function syncAIDriver(now){
  if (winner || draft) return;
  for(const p of players){
    if (!p.ai) continue;
    if (now < p.frozenUntil) continue;     // ❄️ 同步模式：定身计时内不动
    if (now - p.lastAct < SYNC_CD) continue;
    if (p.ap < 1) continue;
    if (p.bank && p.ap < SYNC_APMAX) continue;   // 攒点中：等回满
    if (p.bank && p.ap >= SYNC_APMAX - 1e-6){    // 攒满 → 解锁连发
      p.bank = false;
      p.burstLeft = 1 + Math.floor(rnd()*3);     // 本次之后还连 1~3 手
    }
    if (now < p.nextThink) continue;
    p.nextThink = now + 60 + rnd()*180;
    const acted = syncAIDecide(p);
    if (!acted || winner) continue;
    if (p.burstLeft > 0){
      p.burstLeft--;                              // 连发中
    }else if (rnd() < 0.5){
      p.bank = true;                              // 转入攒点
    }
  }
}
function syncAIDecide(p){
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ doMove(p, bestToward(p, ms)); return true; }
  }
  const hammerIdx = p.inv.indexOf('hammer');
  if (hammerIdx>=0){                            // 有锤子：免费砸对自己收益最大的墙
    const sm = bestSmash(p);
    if (sm){ p.inv.splice(hammerIdx,1); execSmashWall(p, sm[0], sm[1], sm[2]); return true; }
  }
  if (aiUseSkill(p)) return true;               // 技能：免费即时，择机自动放
  if (aiUseItems(p)) return true;               // 道具：免费即时，择机自动用
  if (winner) return false;
  // 评估放墙
  const lead = opps.slice().sort((a,b)=>dists[a.color]-dists[b.color])[0];   // 🎯 领先者：重点打击对象
  const behind = lead && dists[lead.color] < myD;                            // 🎯 我落后：放墙阈值下调，出手更凶
  let bestWall=null, bestScore=(behind? 1.0 : 1.6) + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>140) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0, rawGain=0;
      for(const q of opps){
        const gain=d2[q.color]-dists[q.color];
        if(gain>0){ rawGain+=gain; hurt += gain * (1 + Math.max(0,(6-dists[q.color]))*0.35) * (q===lead?1.2:1); }   // 🎯 拖领先者更值
      }
      const selfCost = d2[p.color] - myD;              // 正 = 自己的路被这堵墙延长
      if (selfCost > 0 && rawGain <= selfCost*2) continue;   // 自路受损时，拖对手总量必须≥2倍自损才值得
      const score = hurt - selfCost*3 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (!bestWall && p.walls>0 && Math.min(...opps.map(q=>dists[q.color]))<=3){
    // 紧急封堵：对手逼近王座，找一堵“拖住对手且不坑自己”的墙，评分选优
    const spots=allWallSpots().sort(()=>rnd()-0.5);
    let bestGuard=null, bestGuardScore=0;
    for(const [k,x,y] of spots){
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2=allDists(sH,sV);
      const selfCost = d2[p.color] - myD;
      if (selfCost > 1) continue;                    // 紧急时刻也最多容忍自损 1 步
      let hurt=0;
      for(const q of opps){
        const g=d2[q.color]-dists[q.color];
        if(g>0) hurt += g;
      }
      if (hurt <= selfCost) continue;                // 拖对手的量必须 strictly 大于自损
      const s = hurt - selfCost*2;
      if (s > bestGuardScore){ bestGuardScore=s; bestGuard=[k,x,y]; }
    }
    if (bestGuard) bestWall=bestGuard;
  }
  if (bestWall && rnd()>0.10){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  const ms=legalMoves(p);
  if (ms.length){ doMove(p, bestToward(p,ms)); return true; }
  if (bestWall){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  return false;
}

function boxAt(x,y){ return boxes.find(b=>b.x===x&&b.y===y) || null; }
function trapAt(x,y){ return traps.find(t=>t.x===x&&t.y===y) || null; }
const LEGENDARY_KINDS = ['bang','doom','megaphone','skate','blueshell','bomb','hourglass','eclipse'];   // 💎 传说池：8 道具等权
const ATTACK_KINDS = ['trap','confusion','hammer','shell','fakebox'];    // 🔗 橡皮筋：领跑者开到攻击类 → 50% 重掷
const DEFENSE_KINDS = ['wall','shield','restore','stun'];                // 🔗 橡皮筋：垫底者开到防御类 → 50% 重掷
function rollLegendaryKind(){ return LEGENDARY_KINDS[Math.floor(rnd()*LEGENDARY_KINDS.length)]; }
function rollItemKind(){                   // 普通道具加权池（传说道具不进普通池）
  const pool = [];
  const put = (k,w)=>{ if (ITEMS[k]) for(let i=0;i<w;i++) pool.push(k); };
  put('wall',3); put('hammer',3);
  if (skillsOn) put('restore',2);
  put('trap',2); put('confusion',2); put('stun',1); put('shield',2);
  put('mushroom',2); put('shell',2); put('fakebox',1); put('dice',2); put('boomerang',2);
  return pool[Math.floor(rnd()*pool.length)];
}
function spawnBox(cap=5){                // 每 itemInterval 秒：棋盘随机刷一个宝箱；全场上限 5，超出顶掉最旧（FIFO）
  while (boxes.length >= cap) boxes.shift();
  const c = randCell((x,y)=>!boxAt(x,y) && !trapAt(x,y) && !fakeBoxAt(x,y));
  if (!c) return;
  boxes.push({x:c.x, y:c.y, i: rollItemKind()});   // 统一宝箱：外观相同，传说道具在开箱时小概率掷出
  fx.push({type:'boxin', x:c.x, y:c.y, t0:performance.now()});
  netEv({type:'boxspawn', x:c.x, y:c.y});
}
function afterStep(p, cell){              // 每次走到新格子（doMove 王座判定后）：陷阱 → 假宝箱 → 宝箱 → 关卡地形（暴风/骆驼/冰/岩浆）

  if (triggerFakeBox(p, cell)) return;

  if (levelId===1 && isSandstorm(cell.x, cell.y)){
    const pool=[];

      for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
        const nx=s.x+dx, ny=s.y+dy;
        if (!inB(nx,ny) || (dx===0&&dy===0) || isSandstorm(nx,ny) || pawnAt(nx,ny) || (nx===THRONE.x&&ny===THRONE.y)) continue;

    }
  }
  // 🐪 沙漠骆驼：走到骆驼所在格即骑上（5 回合内每回合 +1 行动，用尽后骆驼跑远）

function pickupAt(p, cell){               // 拾取脚下宝箱：不满箱直接拾取；💎 传说开箱定型（10% 掷传说）；满箱 → 开盖定型弹替换面板（人类）/ 自动取舍（AI）
  const b = boxAt(cell.x, cell.y);
  if (!b) return;
  if (b.pending && b.pending.o!==p.color) return;   // 他人待选中的宝箱：锁住不可动
  if (p.inv.length >= INV_CAP){
    const nk = b.pending ? b.pending.k : (rnd()<0.03 ? rollLegendaryKind() : b.i);
    if (p.ai){ aiSwapDecide(p, b, nk); return; }

  if (kind === b.i){                          // 🔗 橡皮筋：普通结果按开箱者名次重掷一次（重掷只出普通池）
    const d = allDists();

    if (act.length>1){
      if (p===act[0] && ATTACK_KINDS.includes(kind) && rnd()<0.5) kind = rollItemKind();
      else if (p===act[act.length-1] && DEFENSE_KINDS.includes(kind) && rnd()<0.5) kind = rollItemKind();

  p.inv.push(kind);
  sPick();
  fx.push({type:'openbox', x:b.x, y:b.y, i:kind, t0:performance.now()});

  }else if (LEGENDARY_KINDS.includes(kind)){
    logPush('💎 开出传说道具 '+ITEMS[kind].icon+' '+ITEMS[kind].name+'！', p.color);
  }else{
    logPush('🎁 打开宝箱获得 '+ITEMS[kind].icon+' '+ITEMS[kind].name, p.color);

function itemValue(k){ return (ITEMS[k] && ITEMS[k].legendary) ? 9 : (ITEM_VALUE[k]!=null ? ITEM_VALUE[k] : 3); }
function aiSwapDecide(p, b, nk){             // AI 满箱取舍：新道具与最差旧件比价值，留最优 2 件
  const bi = boxes.indexOf(b); if (bi>=0) boxes.splice(bi,1);
  let wi=0;
  for (let i=1;i<p.inv.length;i++) if (itemValue(p.inv[i])<itemValue(p.inv[wi])) wi=i;
  if (itemValue(nk) > itemValue(p.inv[wi])){
    logPush('🎁 用 '+ITEMS[nk].icon+' '+ITEMS[nk].name+' 替换了 '+ITEMS[p.inv[wi]].icon, p.color);
    p.inv.splice(wi,1); p.inv.push(nk);
    fx.push({type:'openbox', x:b.x, y:b.y, i:nk, t0:performance.now()});
  }else{
    logPush('🎁 放弃新道具 '+ITEMS[nk].icon+'（现有更值钱）', p.color);

function resolveSwap(p, b, drop){            // 满箱开盖裁决：drop≥0 替换第 drop 件；drop<0 放弃——宝箱均消失
  if (!b.pending || b.pending.o!==p.color) return false;
  const nk = b.pending.k;
  delete b.pending;
  const bi = boxes.indexOf(b); if (bi>=0) boxes.splice(bi,1);
  if (drop>=0 && drop<p.inv.length){
    const old = p.inv[drop];
    p.inv.splice(drop,1); p.inv.push(nk);
    fx.push({type:'openbox', x:b.x, y:b.y, i:nk, t0:performance.now()});
    netEv({type:'boxopen', x:b.x, y:b.y, i:nk});
    logPush('🎁 用 '+ITEMS[nk].icon+' '+ITEMS[nk].name+' 替换了 '+ITEMS[old].icon, p.color);

    logPush('🎁 放弃新道具 '+ITEMS[nk].icon+'，宝箱消失', p.color);

}

function bestSmash(p){
  let best=null, bestGain=0;
  const d0 = bfsFromThrone(wallsH,wallsV).dist;
  const myD = d0[p.cell.y*N+p.cell.x];
  const opps = players.filter(q=>q!==p&&!q.left)
                      .map(q=>[q, d0[q.cell.y*N+q.cell.x]]);     // 预读基线距离：下方 d2 复用同一共享缓冲，会覆盖 d0
  const consider=[];
  wallsH.forEach(function(k){ const[a,b]=k.split(',').map(Number); consider.push(['h',a,b]); });
  wallsV.forEach(function(k){ const[a,b]=k.split(',').map(Number); consider.push(['v',a,b]); });
  for(const [k,x,y] of consider){
    const sH=new Set(wallsH), sV=new Set(wallsV);   // 双向拷贝：评估绝不能污染真实棋局
    sH.delete(K(x,y)); sV.delete(K(x,y));
    const d2 = bfsFromThrone(sH,sV).dist;
    const gain = myD - d2[p.cell.y*N+p.cell.x];
    let oppGain=0;                                  // 砸墙对手也受益：别人沾光比我多就不砸
    for(const [q,od] of opps){ const og=od-d2[q.cell.y*N+q.cell.x]; if(og>oppGain) oppGain=og; }
    const net = gain - oppGain;
    if (gain>=1 && net>bestGain){ bestGain=net; best=[k,x,y]; }
  }
  return best;
}
const AI_SKILL_RANK = { phase:9, sprint:8, breakwall:7, swap:6, freeze:6, thronemove:5, shuffle:4, jump:3, steal:3, swapcolor:2 };
function aiPickSkill(offer){               // AI 选技：按强度排序取最高
  return offer.slice().sort((a,b)=>(AI_SKILL_RANK[b]||0)-(AI_SKILL_RANK[a]||0))[0];
}
function aiUseSkill(p){                    // AI 用技启发式（免费即时，每局 skillMax 次，择机自动放）
  if (!skillsOn || !p.skill || (p.skillUsed||0)>=skillMax || (p.skillCd||0)>0) return false;
  const dists=allDists();
  const myD=dists[p.color];
  const opps=players.filter(q=>q!==p&&!q.left);
  if (myD<0 || !opps.length) return false;
  const lead=opps.slice().sort((a,b)=>dists[a.color]-dists[b.color])[0];
  const use=t=>execSkill(p, p.skill, t);
  switch(p.skill){
    case 'breakwall': { const sm=bestSmash(p); return sm? use({kind:sm[0],x:sm[1],y:sm[2]}) : false; }
    case 'phase': {
      const dist=bfsFromThrone(wallsH,wallsV).dist;
      for(const[dx,dy]of DIRS){                       // 穿墙直达王座 → 直接赢
        const nx=p.cell.x+dx, ny=p.cell.y+dy;
        if (nx===THRONE.x && ny===THRONE.y && blocked(p.cell.x,p.cell.y,nx,ny)) return use({dx,dy});
      }
      let best=null, gain=1;                          // 否则：穿墙缩短≥2 才用
      for(const[dx,dy]of DIRS){
        const nx=p.cell.x+dx, ny=p.cell.y+dy;
        if(!inB(nx,ny)||pawnAt(nx,ny)||!blocked(p.cell.x,p.cell.y,nx,ny)) continue;
        const g=dist[p.cell.y*N+p.cell.x]-dist[ny*N+nx];
        if(g>gain){gain=g;best={dx,dy};}
      }
      return best? use(best):false;
    }
    case 'steal': { const v=opps.filter(q=>q.inv.length).sort((a,b)=>dists[a.color]-dists[b.color])[0]; return v? use({color:v.color}):false; }   // 优先偷领先者
    case 'swap': { return (myD-dists[lead.color]>=3)? use({color:lead.color}):false; }
    case 'swapcolor': { return (dists[lead.color]+2<=myD)? use({color:lead.color}):false; }   // 落后时捣乱
    case 'freeze': { return (dists[lead.color]<=3 && myD>dists[lead.color])? use({color:lead.color}):false; }
    case 'jump': { return (myD>=6 && myD-dists[lead.color]>=3)? use(null):false; }   // 落点随机：仅落后较多时赌一把
    case 'thronemove': { return (myD>=6 && myD-dists[lead.color]>=3)? use(null):false; }
    case 'shuffle': { return (dists[lead.color]<=3 && myD>=dists[lead.color]+2)? use({color:lead.color}):false; }
    case 'sprint': { return myD>=1 && myD<=3? use(null):false; }      // 冲刺期双行动
  }
  return false;
}
