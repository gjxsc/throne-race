function toast(t){ toastMsg={text:t, t0:performance.now()}; }

/* ================= AI ================= */
function scheduleAI(){
  if (winner) return;
  const p = cur();
  if (p.ai){
    clearTimeout(aiTimer);
    aiTimer = setTimeout(()=>{ if(!winner && cur()===p && p.ai) aiTurn(); }, fastAI?16:110);
  }
}
function aiTurn(){
  const p = cur();
  if (winner || !p.ai) return;
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  const minOppD = Math.min(...opps.map(q=>dists[q.color]));

  const hammerIdx = p.inv.indexOf('hammer');
  if (hammerIdx>=0){                            // 有锤子：先免费砸一堵对自己最有利的墙
    const sm = bestSmash(p);
    if (sm){ p.inv.splice(hammerIdx,1); execSmashWall(p, sm[0], sm[1], sm[2]); }
  }
  aiUseSkill(p);                                // 技能：免费即时，择机自动放
  aiUseItems(p);                                // 道具：免费即时，择机自动用
  if (winner) return;
  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ aiAct(p, 'move', bestToward(p, ms)); return; }
  }
  // 评估放墙
  let bestWall=null, bestScore=1.6 + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>160) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0, rawGain=0;
      for(const q of opps){
        const before=dists[q.color], after=d2[q.color];
        const gain=after-before;
        if(gain>0){ rawGain+=gain; hurt += gain * (1 + Math.max(0,(6-before))*0.35); }
      }
      const selfCost = d2[p.color] - myD;              // 正 = 自己的路被这堵墙延长
      if (selfCost > 0 && rawGain <= selfCost*2) continue;   // 自路受损时，拖对手总量必须≥2倍自损才值得
      const score = hurt - selfCost*3 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (!bestWall && minOppD<=2 && p.walls>0){
    // 紧急封堵：对手逼近王座，找一堵“拖住对手且不坑自己”的墙，评分选优
    const spots=allWallSpots().sort(()=>rnd()-0.5);
    let bestGuard=null, bestGuardScore=0;
    for(const [k,x,y] of spots){
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2=allDists(sH,sV);
      const selfCost = d2[p.color] - myD;
      if (selfCost > 1) continue;                    // 紧急时刻也最多容忍自损 1 步
      let hurt=0;
      for(const q of opps){
        const g=d2[q.color]-dists[q.color];
        if(g>0) hurt += g;
      }
      if (hurt <= selfCost) continue;                // 拖对手的量必须 strictly 大于自损
      const s = hurt - selfCost*2;
      if (s > bestGuardScore){ bestGuardScore=s; bestGuard=[k,x,y]; }
    }
    if (bestGuard) bestWall=bestGuard;
  }
  if (bestWall && rnd()>0.06){ aiAct(p,'wall',bestWall); return; }
  const ms=legalMoves(p);
  if (ms.length) aiAct(p,'move',bestToward(p,ms));
  else if (bestWall) aiAct(p,'wall',bestWall);
}
function bestToward(p, ms){
  const {dist}=bfsFromThrone(wallsH,wallsV);
  let best=ms[0], bd=1e9;
  for(const c of ms){ const d=dist[c.y*N+c.x]; if(d>=0&&d<bd){bd=d;best=c;} }
  for(const c of ms){ if (boxAt(c.x,c.y) && dist[c.y*N+c.x]===bd) return c; }   // 🎁 同距不绕路：顺路拾箱
  return best;
}
function aiUseItems(p){                      // 免费道具：AI 择机自动用（函数内 logPush/netEv 自带联机同步）
  if (useShieldItem(p)) return true;         // 🛡️ 保护卡：拿到就用（免疫 1 次技能/陷阱）
  const iR = p.inv.indexOf('restore');
  if (iR>=0 && skillsOn && p.skill && p.skillUsed){    // 🔋 技能用过才恢复
    p.inv.splice(iR,1); p.skillUsed=false;
    sPick(); renderPanel(); logPush('使用 🔋 技能恢复卡，技能已刷新', p.color);
    return true;
  }
  const dists = allDists();
  const myD = dists[p.color];
  const lead = players.filter(q=>q!==p && !q.left).sort((a,b)=>dists[a.color]-dists[b.color])[0];
  if (!lead || dists[lead.color] >= myD) return false;   // 领先者没跑到我前面：留着择机，不盲目出手
  if (p.inv.indexOf('confusion')>=0 && dists[lead.color]<=5){   // 🌀 混乱领先者
    if (useConfusionItem(p, lead)) return true;
  }
  if (p.inv.indexOf('trap')>=0 && dists[lead.color]<=4){        // 🪤 埋在领先者下一步
    const {dist}=bfsFromThrone(wallsH,wallsV);
    const cands = legalMoves(lead).sort((a,b)=>dist[a.y*N+a.x]-dist[b.y*N+b.x]);
    for(const c of cands){ if (useTrapItem(p, c.x, c.y)) return true; }
  }
  return false;
}
function aiAct(p, kind, arg){
  busy = true;
  setTimeout(()=>{
    busy = false;
    if (winner) return;
    if (kind==='move') doMove(p, arg);
    else doWall(p, arg[0], arg[1], arg[2]);
  }, fastAI ? 18 : 130 + rnd()*150);
}

/* ---- 同步模式：实时驱动 ---- */
function syncAIDriver(now){
  if (winner || draft) return;
  for(const p of players){
    if (!p.ai) continue;
    if (now < p.frozenUntil) continue;     // ❄️ 同步模式：定身计时内不动
    if (now - p.lastAct < SYNC_CD) continue;
    if (p.ap < 1) continue;
    if (p.bank && p.ap < SYNC_APMAX) continue;   // 攒点中：等回满
    if (p.bank && p.ap >= SYNC_APMAX - 1e-6){    // 攒满 → 解锁连发
      p.bank = false;
      p.burstLeft = 1 + Math.floor(rnd()*3);     // 本次之后还连 1~3 手
    }
    if (now < p.nextThink) continue;
    p.nextThink = now + 60 + rnd()*180;
    const acted = syncAIDecide(p);
    if (!acted || winner) continue;
    if (p.burstLeft > 0){
      p.burstLeft--;                              // 连发中
    }else if (rnd() < 0.5){
      p.bank = true;                              // 转入攒点
    }
  }
}
function syncAIDecide(p){
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ doMove(p, bestToward(p, ms)); return true; }
  }
  const hammerIdx = p.inv.indexOf('hammer');
  if (hammerIdx>=0){                            // 有锤子：免费砸对自己收益最大的墙
    const sm = bestSmash(p);
    if (sm){ p.inv.splice(hammerIdx,1); execSmashWall(p, sm[0], sm[1], sm[2]); return true; }
  }
  if (aiUseSkill(p)) return true;               // 技能：免费即时，择机自动放
  if (aiUseItems(p)) return true;               // 道具：免费即时，择机自动用
  if (winner) return false;
  let bestWall=null, bestScore=1.6 + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>140) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0, rawGain=0;
      for(const q of opps){
        const gain=d2[q.color]-dists[q.color];
        if(gain>0){ rawGain+=gain; hurt += gain * (1 + Math.max(0,(6-dists[q.color]))*0.35); }
      }
      const selfCost = d2[p.color] - myD;              // 正 = 自己的路被这堵墙延长
      if (selfCost > 0 && rawGain <= selfCost*2) continue;   // 自路受损时，拖对手总量必须≥2倍自损才值得
      const score = hurt - selfCost*3 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (bestWall && rnd()>0.10){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  const ms=legalMoves(p);
  if (ms.length){ doMove(p, bestToward(p,ms)); return true; }
  if (bestWall){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  return false;
}

function boxAt(x,y){ return boxes.find(b=>b.x===x&&b.y===y) || null; }
function trapAt(x,y){ return traps.find(t=>t.x===x&&t.y===y) || null; }
function spawnBox(){                      // 每 itemInterval 秒：棋盘随机刷一个宝箱（上限 4，开出随机道具）
  if (boxes.length >= 4) return;
  const c = randCell((x,y)=>!boxAt(x,y) && !trapAt(x,y));
  if (!c) return;
  const pool = [];
  const put = (k,w)=>{ if (ITEMS[k]) for(let i=0;i<w;i++) pool.push(k); };
  put('wall',3); put('hammer',3);
  if (skillsOn) put('restore',2);
  put('trap',2); put('confusion',2); put('stun',1); put('shield',2);
  const kind = pool[Math.floor(rnd()*pool.length)];
  boxes.push({x:c.x, y:c.y, i:kind});
  fx.push({type:'boxin', x:c.x, y:c.y, t0:performance.now()});
  netEv({type:'boxspawn', x:c.x, y:c.y});
}
function afterStep(p, cell){              // 每次走到新格子（doMove 王座判定后）：先判陷阱，再拾宝箱
  if (triggerTrap(p, cell)) return;
  pickupAt(p, cell);
}
function pickupAt(p, cell){               // 拾取脚下宝箱：道具箱满则留在原地
  const b = boxAt(cell.x, cell.y);
  if (!b) return;
  if (p.inv.length >= INV_CAP){
    if (p===localFreeActor()) toast('道具箱已满，宝箱留在原地');
    logPush('走到宝箱，但道具箱已满 🎁 留在原地', p.color);
    return;
  }
  boxes.splice(boxes.indexOf(b), 1);
  p.inv.push(b.i);
  sPick();
  fx.push({type:'openbox', x:b.x, y:b.y, i:b.i, t0:performance.now()});
  netEv({type:'boxopen', x:b.x, y:b.y, i:b.i});
  if (b.i==='stun'){
    applyStun(p);
    logPush('💫 打开宝箱中了眩晕！暂停 1 回合', p.color);
  }else{
    logPush('🎁 打开宝箱获得 '+ITEMS[b.i].icon+' '+ITEMS[b.i].name, p.color);
  }
  renderPanel();
}
function applyStun(p){                    // 眩晕：暂停 1 回合（同步模式冻结 2.5 秒）
  p.stunTag = true;
  if (isSyncMode()) p.frozenUntil = Math.max(p.frozenUntil, performance.now()+2500);
  else p.frozenTurns = Math.max(p.frozenTurns, 1);
  fx.push({type:'stun', x:p.cell.x, y:p.cell.y, t0:performance.now()});
  sBad();
  netEv({type:'stunfx', color:p.color});
}
function canSeeTrap(t){                   // 陷阱仅埋设方可见（联机看自己；本地看人类方）
  if (isOnline()) return t.o===myColor;
  const o = players.find(p=>p.color===t.o);
  return !!(o && o.human);
}
function canSeeShield(p){                 // 护盾状态仅使用者可见（联机看自己；本地看人类方）
  if (isOnline()) return p.color===myColor;
  return !!p.human;
}
function triggerTrap(p, cell){            // 踩中陷阱：塌陷特效 + 掉回出生点，陷阱消耗
  const t = trapAt(cell.x, cell.y);
  if (!t || t.o===p.color) return false;  // 埋设方免疫自己的陷阱
  traps.splice(traps.indexOf(t), 1);
  if (p.shield){                          // 🛡️ 护盾挡下陷阱：免于掉回出生点（特效全员可见）
    p.shield = false;
    fx.push({type:'shieldpop', x:cell.x, y:cell.y, t0:performance.now()});
    netEv({type:'shieldfx', color:p.color});
    sPick();
    toast('🛡️ '+COLORS[p.color].name+' 的护盾挡下了陷阱！');
    logPush('🛡️ 护盾挡下 🪤 陷阱，免于掉回出生点', p.color);
    renderPanel();
    return true;
  }
  fx.push({type:'trapgo', x:cell.x, y:cell.y, t0:performance.now()});
  sSmash();
  netEv({type:'trapgo', x:cell.x, y:cell.y});
  teleport(p, {x:SPAWN[p.color].x, y:SPAWN[p.color].y});
  toast('💥 '+COLORS[p.color].name+' 踩中陷阱，掉回出生点！');
  logPush('💥 踩中 🪤 陷阱，掉回出生点', p.color);
  renderPanel();
  return true;
}
function useTrapItem(p, x, y){            // 埋陷阱：空格、非王座、不与宝箱/已有陷阱重叠
  const i = p.inv.indexOf('trap');
  if (i<0) return false;
  if (!inB(x,y) || pawnAt(x,y) || (x===THRONE.x&&y===THRONE.y) || trapAt(x,y) || boxAt(x,y)) return false;
  p.inv.splice(i,1);
  traps.push({x, y, o:p.color});
  sPick(); renderPanel();
  logPush('🪤 埋入了一个陷阱', p.color);
  logPush('🪤 陷阱埋在 ('+x+','+y+')', p.color, true);   // 坐标仅自己可见
  return true;
}
function useConfusionItem(p, v){          // 混乱：目标对手下一步方向颠倒
  const i = p.inv.indexOf('confusion');
  if (i<0 || !v || v===p || v.left) return false;
  p.inv.splice(i,1);
  v.confused = true;
  sPick(); renderPanel();
  fx.push({type:'stun', x:v.cell.x, y:v.cell.y, t0:performance.now(), icon:'🌀'});
  netEv({type:'confusefx', color:v.color});
  toast('🌀 '+COLORS[v.color].name+' 被混乱！下一步方向颠倒');
  logPush('🌀 对 '+COLORS[v.color].name+' 使用混乱卡', p.color);
  return true;
}
function useShieldItem(p){                // 保护卡：免疫 1 次敌方指向性技能或陷阱（状态仅自己可见）
  const i = p.inv.indexOf('shield');
  if (i<0 || p.shield) return false;
  p.inv.splice(i,1);
  p.shield = true;
  sPick(); renderPanel();
  logPush('使用 🛡️ 保护卡，获得 1 次技能/陷阱免疫', p.color, true);   // 保密：仅自己可见
  return true;
}
function bestSmash(p){
  let best=null, bestGain=0;
  const d0 = bfsFromThrone(wallsH,wallsV).dist;
  const myD = d0[p.cell.y*N+p.cell.x];
  const opps = players.filter(q=>q!==p&&!q.left);
  const consider=[];
  wallsH.forEach(function(k){ const[a,b]=k.split(',').map(Number); consider.push(['h',a,b]); });
  wallsV.forEach(function(k){ const[a,b]=k.split(',').map(Number); consider.push(['v',a,b]); });
  for(const [k,x,y] of consider){
    const sH=new Set(wallsH), sV=new Set(wallsV);   // 双向拷贝：评估绝不能污染真实棋局
    sH.delete(K(x,y)); sV.delete(K(x,y));
    const d2 = bfsFromThrone(sH,sV).dist;
    const gain = myD - d2[p.cell.y*N+p.cell.x];
    let oppGain=0;                                  // 砸墙对手也受益：别人沾光比我多就不砸
    for(const q of opps){ const og=d0[q.cell.y*N+q.cell.x]-d2[q.cell.y*N+q.cell.x]; if(og>oppGain) oppGain=og; }
    const net = gain - oppGain;
    if (gain>=1 && net>bestGain){ bestGain=net; best=[k,x,y]; }
  }
  return best;
}
const AI_SKILL_RANK = { phase:9, sprint:8, breakwall:7, swap:6, freeze:6, thronemove:5, shuffle:4, jump:3, steal:3, swapcolor:2 };
function aiPickSkill(offer){               // AI 选技：按强度排序取最高
  return offer.slice().sort((a,b)=>(AI_SKILL_RANK[b]||0)-(AI_SKILL_RANK[a]||0))[0];
}
function aiUseSkill(p){                    // AI 用技启发式（免费即时，整局一次，择机自动放）
  if (!skillsOn || !p.skill || p.skillUsed) return false;
  const dists=allDists();
  const myD=dists[p.color];
  const opps=players.filter(q=>q!==p&&!q.left);
  if (myD<0 || !opps.length) return false;
  const lead=opps.slice().sort((a,b)=>dists[a.color]-dists[b.color])[0];
  const use=t=>execSkill(p, p.skill, t);
  switch(p.skill){
    case 'breakwall': { const sm=bestSmash(p); return sm? use({kind:sm[0],x:sm[1],y:sm[2]}) : false; }
    case 'phase': {
      const dist=bfsFromThrone(wallsH,wallsV).dist;
      for(const[dx,dy]of DIRS){                       // 穿墙直达王座 → 直接赢
        const nx=p.cell.x+dx, ny=p.cell.y+dy;
        if (nx===THRONE.x && ny===THRONE.y && blocked(p.cell.x,p.cell.y,nx,ny)) return use({dx,dy});
      }
      let best=null, gain=1;                          // 否则：穿墙缩短≥2 才用
      for(const[dx,dy]of DIRS){
        const nx=p.cell.x+dx, ny=p.cell.y+dy;
        if(!inB(nx,ny)||pawnAt(nx,ny)||!blocked(p.cell.x,p.cell.y,nx,ny)) continue;
        const g=dist[p.cell.y*N+p.cell.x]-dist[ny*N+nx];
        if(g>gain){gain=g;best={dx,dy};}
      }
      return best? use(best):false;
    }
    case 'steal': { const v=opps.filter(q=>q.inv.length).sort((a,b)=>dists[a.color]-dists[b.color])[0]; return v? use({color:v.color}):false; }   // 优先偷领先者
    case 'swap': { return (myD-dists[lead.color]>=3)? use({color:lead.color}):false; }
    case 'swapcolor': { return (dists[lead.color]+2<=myD)? use({color:lead.color}):false; }   // 落后时捣乱
    case 'freeze': { return (dists[lead.color]<=3 && myD>dists[lead.color])? use({color:lead.color}):false; }
    case 'jump': { return (myD>=6 && myD-dists[lead.color]>=3)? use(null):false; }   // 落点随机：仅落后较多时赌一把
    case 'thronemove': { return (myD>=6 && myD-dists[lead.color]>=3)? use(null):false; }
    case 'shuffle': { return (dists[lead.color]<=3 && myD>=dists[lead.color]+2)? use({color:lead.color}):false; }
    case 'sprint': { return myD>=1 && myD<=3? use(null):false; }      // 冲刺期双行动
  }
  return false;
}

/* ================= 人类输入 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});   // 不透明画布：合成更快，杜绝拖影
let CELL = 48, PAD = 16, boardPx = 0, hover = null;
let touchMode = matchMedia('(pointer: coarse)').matches;  // 触屏设备：放墙需两次点击确认
let pendingWall = null;                                   // 已预览待确认的墙位 ['h'|'v', x, y]
let wallHintShown = false;
window.addEventListener('touchstart', ()=>{ touchMode = true; }, { once:true, passive:true });

function px(v){ return PAD + v*CELL; }

cv.addEventListener('mousemove', e=>{
  const r=cv.getBoundingClientRect();
  hover = {gx:e.clientX-r.left, gy:e.clientY-r.top};
});
cv.addEventListener('mouseleave', ()=>hover=null);
cv.addEventListener('click', e=>{
  ac();
  if (winner||busy) return;
  // 目标选择模式：选中 🔨 后点墙击碎，点空处取消
  if (pendingItem==='hammer'){
    const pa = localFreeActor();
    if (!pa) return;
    pendingItem = null; renderPanel();
    const r0=cv.getBoundingClientRect();
    const sm = wallAt((e.clientX-r0.left-PAD)/CELL, (e.clientY-r0.top-PAD)/CELL);
    if (!sm){ toast('已取消'); return; }
    const intent = {type:'smash', kind:sm[0], x:sm[1], y:sm[2]};
    if (isOnline()){
      if (hostSim()) hostApplyAction(pa, intent);
      else { busy=true; setTimeout(()=>{ busy=false; }, 2500); netSend({t:'act', a:intent}); }
    }else{
      if (!useHammer(pa, sm[0], sm[1], sm[2])) toast('你没有锤子');
    }
    return;
  }
  // 目标选择模式：🪤 点空格埋陷阱 / 🌀 点对手施放混乱，点空处取消
  if (pendingItem==='trap' || pendingItem==='confusion'){
    const pa = localFreeActor();
    if (!pa) return;
    const kind = pendingItem;
    pendingItem = null; renderPanel();
    const r0=cv.getBoundingClientRect();
    const tx=Math.round((e.clientX-r0.left-PAD)/CELL-0.5), ty=Math.round((e.clientY-r0.top-PAD)/CELL-0.5);
    if (!inB(tx,ty)){ toast('已取消'); return; }
    let intent;
    if (kind==='trap') intent={type:'itemuse', kind:'trap', x:tx, y:ty};
    else{
      const v=pawnAt(tx,ty);
      if (!v || v===pa || v.left){ toast('要点一名对手'); return; }
      intent={type:'itemuse', kind:'confusion', t:{color:v.color}};
    }
    if (isOnline()){
      if (hostSim()) hostApplyAction(pa, intent);
      else { busy=true; setTimeout(()=>{ busy=false; }, 2500); netSend({t:'act', a:intent}); }
    }else{
      const ok = kind==='trap' ? useTrapItem(pa, tx, ty) : useConfusionItem(pa, pawnAt(tx,ty));
      if (!ok) toast(kind==='trap' ? '那里埋不了陷阱' : '目标无效');
    }
    return;
  }
  // 技能目标选择：按技能类型解析点击，点空处取消
  if (pendingSkill){
    const pa = localFreeActor();
    const sk = SKILLS.find(s=>s.id===pendingSkill);
    if (!pa || !sk){ pendingSkill=null; renderPanel(); return; }
    const r0=cv.getBoundingClientRect();
    const mx=(e.clientX-r0.left-PAD)/CELL, my=(e.clientY-r0.top-PAD)/CELL;
    let t=null;
    if (sk.id==='breakwall'){
      const sm=wallAt(mx,my);
      if (sm) t={kind:sm[0], x:sm[1], y:sm[2]};
    }else if (sk.id==='phase'){
      const dx=Math.floor(mx)-pa.cell.x, dy=Math.floor(my)-pa.cell.y;
      if (Math.abs(dx)+Math.abs(dy)===1) t={dx,dy};
    }else if (sk.target==='pawn'){
      const v=pawnAt(Math.floor(mx), Math.floor(my));
      if (v && v!==pa && !v.left) t={color:v.color};
    }
    pendingSkill=null; renderPanel();
    if (!t){ toast('已取消'); return; }
    const intent={type:'skilluse', id:sk.id, t};
    if (isOnline()){
      if (hostSim()) hostApplyAction(pa, intent);
      else { busy=true; setTimeout(()=>{ busy=false; }, 2500); netSend({t:'act', a:intent}); }
    }else if (!execSkill(pa, sk.id, t)) toast('目标无效');
    return;
  }
  let p;
  if (isOnline()){
    p = players.find(q=>q.color===myColor);
    if (!p || p.left || p.ai) return;
    if (isSyncMode()){
      const now = performance.now();
      if (now - p.lastAct < SYNC_CD){ toast('太快了！动作间隔 0.5 秒'); sBad(); return; }
      if (p.ap < 1){ toast('操作点不足，等它恢复'); sBad(); return; }
    }else if (cur()!==p){ toast('还没轮到你'); sBad(); return; }
  }else if (isSyncMode()){
    if (!players[0].human) return;         // 纯观战变体：无人类操作
    p = players[0];
    const now = performance.now();
    if (now - p.lastAct < SYNC_CD){ toast('太快了！动作间隔 0.5 秒'); sBad(); return; }
    if (p.ap < 1){ toast('操作点不足，等它恢复'); sBad(); return; }
  }else{
    p = cur(); if (!p.human) return;
  }
  const r=cv.getBoundingClientRect();
  const gx=e.clientX-r.left, gy=e.clientY-r.top;
  const intent = resolveIntent(p, (gx-PAD)/CELL, (gy-PAD)/CELL);
  if (!intent) return;
  // 触屏：放墙需要两次点击——第一次出预览，再点同一位置才确认，点格子则取消预览
  if (touchMode && intent.type === 'wall'){
    if (pendingWall && pendingWall[0]===intent.kind && pendingWall[1]===intent.x && pendingWall[2]===intent.y){
      pendingWall = null;                    // 第二次点击：确认放墙
    }else{
      pendingWall = [intent.kind, intent.x, intent.y];
      if (!wallHintShown){ toast('已预览墙位：再点一次确认放墙，点格子取消'); wallHintShown = true; }
      return;
    }
  }else if (intent.type !== 'wall'){
    pendingWall = null;                      // 走子/砸墙：预览自动取消
  }
  if (isOnline()){
    if (hostSim()) hostApplyAction(p, intent);          // 房主：本地校验后直接执行
    else {                                              // 客户端：发 intent，等房主快照
      busy = true; setTimeout(()=>{ busy=false; }, 2500);
      netSend({t:'act', a:intent});
    }
  }else{
    applyIntent(p, intent);
  }
});
// 免费即时动作（道具/技能）的本地执行者：在线=自己；同步=蓝方人类；经典=当前回合人类
function localFreeActor(){
  if (isOnline()){ const q=players.find(x=>x.color===myColor); return (q && !q.left && !q.ai) ? q : null; }
  if (isSyncMode()) return players[0].human ? players[0] : null;
  return (cur() && cur().human) ? cur() : null;
}
// 把一次点击解析成操作意图（带本地提示），真正的执行统一走 applyIntent
function resolveIntent(p, cx, cy){
  if (draft) return null;                 // 选技阶段不可操作
  if (isSyncMode() && performance.now() < p.frozenUntil){ toast('❄️ 你被定身了'); sBad(); return null; }
  // ① 靠近格线 → 放墙
  const w = snapWall(cx, cy);
  if (w){
    const [k,x,y]=w;
    if (p.walls<=0){ toast('你的墙用完了！'); sBad(); return null; }
    if (!wallOK(k,x,y)){
      toast(wallClash(k,x,y) ? '这里放不了墙' : '不能把人彻底堵死！');
      sBad(); return null;
    }
    return {type:'wall', kind:k, x, y};
  }
  // ② 点格子 → 移动
  const tx=Math.round(cx-0.5), ty=Math.round(cy-0.5);
  if (inB(tx,ty)){
    const ms = legalMoves(p);
    const hit = ms.find(c=>c.x===tx&&c.y===ty);
    if (hit) return {type:'move', x:tx, y:ty};
    if (tx===p.cell.x&&ty===p.cell.y){ toast('点相邻格移动，或点格线缝隙放墙'); return null; }
    toast(ms.length ? '走不到那里' : '你被困住了！');
    sBad();
  }
  return null;
}
function applyIntent(p, a){
  if (a.type==='move') doMove(p, {x:a.x, y:a.y});
  else if (a.type==='wall') doWall(p, a.kind, a.x, a.y);
  else if (a.type==='smash') useHammer(p, a.kind, a.x, a.y);
  else if (a.type==='skilluse') execSkill(p, a.id, a.t);
}
// 房主权威：校验任何来源（含自己）的操作后执行，非法则回执提示
function hostApplyAction(p, a){
  const reject = text => { netEv({type:'reject', to:p.color, text}); netFlush(); };
  if (p.ai || p.left) return;
  if (a.type==='skillpick'){                     // 开局选技：不占用回合、不查冻结/CD
    if (!draft || !draft.offers[p.color] || draft.picked[p.color]) return reject('现在不能选技能');
    if (draft.offers[p.color].indexOf(a.id)<0) return reject('技能不在候选中');
    pickSkill(p, a.id, true);
    netEv({type:'skill'}); netFlush();
    checkNetDraftDone();
    return;
  }
  const freeAct = a.type==='smash' || a.type==='itemuse' || a.type==='skilluse';   // 道具/技能：免费即时
  if (!isSyncMode() && cur()!==p) return reject('还没轮到你');
  if (isSyncMode()){
    const now = performance.now();
    if (now < p.frozenUntil) return reject('❄️ 你被定身了');   // 定身：一切操作（含技能/道具）都禁止
    if (!freeAct){
      if (now - p.lastAct < SYNC_CD) return reject('太快了！动作间隔 0.5 秒');
      if (p.ap < 1) return reject('操作点不足');
    }
  }
  if (a.type==='move'){
    if (!legalMoves(p).some(c=>c.x===a.x&&c.y===a.y)) return reject('走不到那里');
    applyIntent(p, a);
  }else if (a.type==='wall'){
    if (p.walls<=0) return reject('你的墙用完了！');
    if (!wallOK(a.kind,a.x,a.y)) return reject('这里放不了墙');
    applyIntent(p, a);
  }else if (a.type==='smash'){
    if (p.inv.indexOf('hammer')<0) return reject('你没有锤子');
    const set = a.kind==='h'?wallsH:wallsV;
    if (!set.has(K(a.x,a.y))) return reject('那堵墙已经没了');
    useHammer(p, a.kind, a.x, a.y);
  }else if (a.type==='itemuse' && a.kind==='wall'){
    const i = p.inv.indexOf('wall');
    if (i<0) return reject('没有 🧱 道具');
    p.inv.splice(i,1); p.walls++;
    logPush('使用 🧱 +1 堵墙', p.color);
    sPick(); renderPanel();
  }else if (a.type==='itemuse' && a.kind==='restore'){
    const i = p.inv.indexOf('restore');
    if (i<0) return reject('没有 🔋 恢复卡');
    if (!skillsOn || !p.skill) return reject('本局没有技能，恢复卡用不了');
    if (!p.skillUsed) return reject('技能还没用过，无需恢复');
    p.inv.splice(i,1); p.skillUsed=false;
    logPush('使用 🔋 技能恢复卡，技能已刷新', p.color);
    sPick(); renderPanel();
  }else if (a.type==='itemuse' && a.kind==='trap'){
    if (!useTrapItem(p, a.x, a.y)) return reject('那里埋不了陷阱');
  }else if (a.type==='itemuse' && a.kind==='confusion'){
    const v = players.find(q=>q.color===(a.t||{}).color);
    if (!useConfusionItem(p, v)) return reject('目标无效');
  }else if (a.type==='itemuse' && a.kind==='shield'){
    if (!useShieldItem(p)) return reject('护盾无法使用');
  }else if (a.type==='skilluse'){
    const sk = SKILLS.find(s=>s.id===a.id);
    if (!skillsOn) return reject('本局未开启技能');
    if (!sk || p.skill!==a.id) return reject('技能不符');
    if (p.skillUsed) return reject('技能已用过');
    const t=a.t||{};
    if (sk.id==='breakwall'){
      const set=t.kind==='h'?wallsH:wallsV;
      if (!set.has(K(t.x,t.y))) return reject('那堵墙已经没了');
    }else if (sk.id==='phase'){
      const nx=p.cell.x+t.dx, ny=p.cell.y+t.dy;
      if (!inB(nx,ny)||pawnAt(nx,ny)||!blocked(p.cell.x,p.cell.y,nx,ny)) return reject('那里穿不过去');
    }else if (sk.id==='steal'){
      const v=players.find(q=>q.color===t.color);
      if (!v||v===p||!v.inv.length) return reject('对方没有道具');
    }else if (sk.target==='pawn'){
      const v=players.find(q=>q.color===t.color);
      if (!v||v.left||v===p) return reject('目标无效');
    }
    if (!execSkill(p, a.id, t)) return reject('技能没有合适的目标');
  }
}
// 吸附最近的可放墙位置：光标靠近哪条格线，就沿哪条线放
function snapWall(cx, cy){
  const dV = Math.abs(cx - Math.round(cx));   // 离竖直格线
  const dH = Math.abs(cy - Math.round(cy));   // 离水平格线
  const TH = 0.32;
  if (Math.min(dV,dH) >= TH) return null;
  if (dV <= dH){
    const vx = Math.round(cx);
    const vy = Math.max(0, Math.min(N-2, Math.round(cy-1)));
    return ['v', vx, vy];
  }else{
    const hy = Math.round(cy);
    const hx = Math.max(0, Math.min(N-2, Math.round(cx-1)));
    return ['h', hx, hy];
  }
}
// 光标下的墙（锤子用）
function wallAt(cx, cy){
  let best=null, bd=0.3;
  wallsH.forEach(function(k){
    const[a,b]=k.split(',').map(Number);
    const dx=cx-Math.min(Math.max(cx,a),a+2), dy=cy-b;
    const d=Math.hypot(dx,dy);
    if(d<bd){ bd=d; best=['h',a,b]; }
  });
  wallsV.forEach(function(k){
    const[a,b]=k.split(',').map(Number);
    const dy=cy-Math.min(Math.max(cy,b),b+2), dx=cx-a;
    const d=Math.hypot(dx,dy);
    if(d<bd){ bd=d; best=['v',a,b]; }
  });
  return best;
}

/* ================= 渲染 ================= */
if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function layout(){
  const narrow = window.innerWidth <= 820;
  const maxW = narrow ? window.innerWidth-36 : window.innerWidth-330;
  const maxH = window.innerHeight - 170;
  boardPx = Math.max(300, Math.min(maxW, maxH, N>=13?680:620));
  const dpr = window.devicePixelRatio||1;
  cv.width = Math.round(boardPx*dpr); cv.height = Math.round(boardPx*dpr);
  cv.style.width = boardPx+'px'; cv.style.height = boardPx+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CELL = (boardPx - PAD*2)/N;
}
window.addEventListener('resize', layout);

let lastFrame = performance.now();
let _drawErrs = 0;
function draw(now){
  try{
  const dt = Math.min(.05,(now-lastFrame)/1000); lastFrame = now;
  if (isSyncMode() && !winner){
    for(const p of players) p.ap = Math.min(SYNC_APMAX, p.ap + dt);   // 每秒回1点
    if (hostSim()) syncAIDriver(now);
  }
  if (itemsOn && !winner && hostSim()){
    itemClock += dt;
    if (itemClock >= itemInterval){ itemClock = 0; spawnBox(); }
  }
  ctx.clearRect(0,0,boardPx,boardPx);

  const g = ctx.createLinearGradient(0,0,boardPx,boardPx);
  g.addColorStop(0,'#0c1322'); g.addColorStop(1,'#0a101d');
  ctx.fillStyle=g; ctx.fillRect(0,0,boardPx,boardPx);   // 满幅铺底（圆角交给 CSS 裁切）

  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    ctx.fillStyle = '#141b2b';
    rr(px(x)+1.5, px(y)+1.5, CELL-3, CELL-3, Math.max(4,CELL*0.14));
    ctx.fill();
  }
  ctx.fillStyle='rgba(120,150,210,.14)';
  for(let y=0;y<=N;y++) for(let x=0;x<=N;x++){
    ctx.beginPath(); ctx.arc(px(x),px(y),1.6,0,7); ctx.fill();
  }

  // 王座
  const pulse = 0.5+0.5*Math.sin(now/500);
  ctx.save();
  ctx.shadowColor='rgba(253,202,0,'+(0.45+0.3*pulse).toFixed(2)+')'; ctx.shadowBlur=18+8*pulse;
  ctx.fillStyle='#fdca00';
  rr(px(THRONE.x)+2.5, px(THRONE.y)+2.5, CELL-5, CELL-5, Math.max(5,CELL*0.16)); ctx.fill();
  ctx.restore();
  ctx.font = Math.floor(CELL*0.46)+'px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👑', px(THRONE.x)+CELL/2, px(THRONE.y)+CELL/2+2);

  // 当前人类玩家合法移动提示
  let cp = null;
  if (!winner){
    if (isSyncMode()) cp = isOnline() ? players.find(q=>q.color===myColor) : (players[0].human?players[0]:null);
    else cp = cur();
  }
  if (cp && cp.human && !busy){
    ctx.fillStyle='rgba(255,255,255,.10)';
    for(const c of legalMoves(cp)){
      ctx.beginPath(); ctx.arc(px(c.x)+CELL/2, px(c.y)+CELL/2, CELL*0.12, 0, 7); ctx.fill();
    }
  }

  // 墙
  const WT = Math.max(5, CELL*0.14);
  ctx.lineCap='round'; ctx.lineWidth=WT;
  for(const key of wallsH){
    const[a,b]=key.split(',').map(Number);
    const fw = fireWalls.some(q=>q.kind==='h'&&q.x===a&&q.y===b);   // 🔥 烈阳火墙：橙红燃烧
    const col = fw ? '#ff8b3d' : (COLORS[paintOf(wallOwner['h '+key])]?.main || '#7f8db0');
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur= fw ? 12+6*Math.sin(now/110) : 7;
    ctx.beginPath(); ctx.moveTo(px(a),px(b)); ctx.lineTo(px(a+2),px(b)); ctx.stroke();
  }
  for(const key of wallsV){
    const[a,b]=key.split(',').map(Number);
    const fw = fireWalls.some(q=>q.kind==='v'&&q.x===a&&q.y===b);   // 🔥 烈阳火墙：橙红燃烧
    const col = fw ? '#ff8b3d' : (COLORS[paintOf(wallOwner['v '+key])]?.main || '#7f8db0');
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur= fw ? 12+6*Math.sin(now/110) : 7;
    ctx.beginPath(); ctx.moveTo(px(a),px(b)); ctx.lineTo(px(a),px(b+2)); ctx.stroke();
  }
  ctx.shadowBlur=0;
  // 🔥 烈阳火墙：橙焰标记（无主之火，烧尽即灭）
  for(const f of fireWalls){
    const mx = f.kind==='h'? px(f.x+1) : px(f.x), my = f.kind==='h'? px(f.y) : px(f.y+1);
    ctx.save();
    ctx.globalAlpha=0.75+0.25*Math.sin(now/150+f.x*1.7+f.y);
    ctx.font=Math.floor(CELL*0.36)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🔥', mx, my);
    ctx.restore();
  }

  // 触屏待确认墙位：高亮预览（方向 + 两格跨度 + 受影响格子淡光）
  if (pendingWall && cp && cp.human && !busy){
    const [k,x,y] = pendingWall;
    const ok = cp.walls>0 && wallOK(k,x,y);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    const cells = k==='h' ? [[x,y-1],[x+1,y-1],[x,y],[x+1,y]] : [[x-1,y],[x,y-1],[x,y],[x,y+1]];
    for(const [cxx,cyy] of cells) if (inB(cxx,cyy)){
      rr(px(cxx)+1.5, px(cyy)+1.5, CELL-3, CELL-3, Math.max(4,CELL*0.14)); ctx.fill();
    }
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4*Math.sin(now/200);
    ctx.strokeStyle = ok ? COLORS[cp.color].main : '#ff4d4d';
    ctx.lineWidth = WT+3; ctx.lineCap = 'round';
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
    ctx.beginPath();
    if(k==='h'){ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x+2),px(y)); }
    else{ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x),px(y+2)); }
    ctx.stroke(); ctx.restore();
    ctx.font = '600 '+Math.max(11,Math.floor(CELL*0.24))+'px "PingFang SC",sans-serif';
    ctx.fillStyle = ok ? '#dfe7f5' : '#ff8f8f';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(k==='h'){ ctx.fillText(ok?'再点一次确认':'这里放不了', px(x+1), y<=THRONE.y ? px(y)-CELL*0.55 : px(y)+CELL*0.55); }
    else{ ctx.fillText(ok?'再点一次确认':'这里放不了', x<THRONE.x ? px(x)-CELL*0.75 : px(x)+CELL*0.75, px(y+1)); }
  }

  // 技能目标提示：pawn 类技能给全部对手棋子画虚线圈
  if (cp && !winner && pendingSkill){
    const st = SKILLS.find(s=>s.id===pendingSkill);
    if (st && st.target==='pawn'){
      ctx.save();
      ctx.strokeStyle='#fdca00'; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
      for(const q of players){
        if (q===cp || q.left) continue;
        ctx.beginPath();
        ctx.arc(px(q.cell.x)+CELL/2, px(q.cell.y)+CELL/2, CELL*0.46, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 墙 hover 预览（选中 🔨 或 wall 类技能时高亮可作用的墙）
  if (cp && cp.human && !busy && hover && !pendingWall){
    const cx=(hover.gx-PAD)/CELL, cy=(hover.gy-PAD)/CELL;
    const skT = pendingSkill && ((SKILLS.find(s=>s.id===pendingSkill)||{}).target);
    if (pendingItem==='hammer' || skT==='wall'){
      const sm = wallAt(cx,cy);
      if (sm){
        const [k,x,y]=sm;
        ctx.save(); ctx.globalAlpha=.85;
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=WT+2; ctx.lineCap='round';
        ctx.beginPath();
        if(k==='h'){ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x+2),px(y)); }
        else{ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x),px(y+2)); }
        ctx.stroke(); ctx.restore();
      }
    }else{
      const w = snapWall(cx,cy);
      if (w){
        const [k,x,y]=w;
        const ok = cp.walls>0 && wallOK(k,x,y);
        ctx.save(); ctx.globalAlpha=.3;
        ctx.strokeStyle = ok ? COLORS[cp.color].main : '#ff4d4d';
        ctx.lineWidth=WT; ctx.lineCap='round';
        ctx.beginPath();
        if(k==='h'){ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x+2),px(y)); }
        else{ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x),px(y+2)); }
        ctx.stroke(); ctx.restore();
      }
    }
  }

  // 🕳️ 地陷塌陷格：黑洞 + 紫边闪烁（2 回合后恢复）
  for(const c of collapsed){
    const X=px(c.x), Y=px(c.y);
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.78)';
    rr(X+2,Y+2,CELL-4,CELL-4, Math.max(4,CELL*0.14)); ctx.fill();
    ctx.strokeStyle='rgba(138,107,255,'+(0.45+0.4*Math.sin(now/240)).toFixed(2)+')'; ctx.lineWidth=2;
    rr(X+2,Y+2,CELL-4,CELL-4, Math.max(4,CELL*0.14)); ctx.stroke();
    ctx.globalAlpha=0.9;
    ctx.font=Math.floor(CELL*0.4)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🕳️', X+CELL/2, Y+CELL/2+2);
    ctx.restore();
  }
  // 宝箱（悬浮 + 呼吸辉光）
  for(const b of boxes){
    const bob = 2.5*Math.sin(now/300 + b.x*1.3 + b.y*0.9);
    ctx.save();
    ctx.shadowColor='rgba(253,202,0,.55)'; ctx.shadowBlur=10+4*Math.sin(now/200+b.x);
    ctx.font=Math.floor(CELL*0.52)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🎁', px(b.x)+CELL/2, px(b.y)+CELL/2+2+bob);
    ctx.restore();
  }
  // 自己埋的陷阱（仅埋设方可见）
  for(const t of traps){
    if (!canSeeTrap(t)) continue;
    const bob = 1.5*Math.sin(now/260 + t.x + t.y);
    ctx.save();
    ctx.globalAlpha=0.75+0.25*Math.sin(now/300);
    ctx.font=Math.floor(CELL*0.42)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🪤', px(t.x)+CELL/2, px(t.y)+CELL/2+2+bob);
    ctx.restore();
  }

  // 棋子
  for(const p of players){
    let X=px(p.cell.x)+CELL/2, Y=px(p.cell.y)+CELL/2;
    if (p.tween){
      const t=Math.min(1,(now-p.tween.t0)/90);   // 干脆利落的滑动
      const e=1-Math.pow(1-t,2);
      X=px(p.tween.fx+(p.cell.x-p.tween.fx)*e)+CELL/2;
      Y=px(p.tween.fy+(p.cell.y-p.tween.fy)*e)+CELL/2;
      if(t>=1) p.tween=null;
    }
    const isCur = !isSyncMode() && p===cp;
    if (isSyncMode()){
      if (!p.ai){
        const cd = Math.max(0, SYNC_CD-(now-p.lastAct))/SYNC_CD;
        if (cd>0){                       // 冷却进度环
          ctx.strokeStyle='rgba(255,255,255,.30)'; ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(X,Y,CELL*0.46,-Math.PI/2,-Math.PI/2+(1-cd)*Math.PI*2); ctx.stroke();
        }else if (p.ap>=1){              // 可行动：呼吸环
          ctx.strokeStyle='rgba(255,255,255,'+(0.45+0.3*Math.sin(now/220)).toFixed(2)+')';
          ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(X,Y,CELL*0.42+2.5+Math.sin(now/220)*1.2,0,7); ctx.stroke();
        }
      }
    }else if (p===cp){
      ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.35*Math.sin(now/220)).toFixed(2)+')';
      ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(X,Y,CELL*0.42+3+Math.sin(now/220)*1.5,0,7); ctx.stroke();
    }
    const [r,g2,b]=COLORS[paintOf(p.color)].rgb;
    const moving = !!p.tween;                 // 移动中不发光，避免辉光拖影
    ctx.save();
    ctx.shadowColor=`rgba(${r},${g2},${b},.8)`; ctx.shadowBlur = moving ? 0 : (isCur?16:9);
    const rg=ctx.createRadialGradient(X-CELL*0.1,Y-CELL*0.12,1,X,Y,CELL*0.36);
    rg.addColorStop(0,`rgb(${Math.min(255,r+70)},${Math.min(255,g2+70)},${Math.min(255,b+70)})`);
    rg.addColorStop(1,COLORS[paintOf(p.color)].main);
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(X,Y,CELL*0.32,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(X-CELL*0.09,Y-CELL*0.11,CELL*0.08,0,7); ctx.fill();
    if (isSyncMode()? now<p.frozenUntil : p.frozenTurns>0){   // ❄️ 定身 / 💫 眩晕指示
      ctx.font=Math.floor(CELL*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.stunTag?'💫':'❄️', X+CELL*0.28, Y-CELL*0.28);
    }
    if (p.confused){                        // 🌀 混乱待发：头顶摇晃图标
      ctx.save();
      ctx.translate(X-CELL*0.02, Y-CELL*0.52); ctx.rotate(Math.sin(now/180)*0.35);
      ctx.font=Math.floor(CELL*0.42)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🌀', 0, 0);
      ctx.restore();
    }
    if (p.shield && canSeeShield(p)){       // 🛡️ 护盾生效中：仅使用者可见（左上角）
      ctx.font=Math.floor(CELL*0.42)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🛡️', X-CELL*0.28, Y-CELL*0.28);
    }
    if (isSyncMode()){                     // 操作点气泡：3格，亮=可用；攒点中变金色
      for(let i=0;i<SYNC_APMAX;i++){
        const f = Math.max(0, Math.min(1, p.ap - i));
        ctx.fillStyle = p.bank
          ? 'rgba(253,202,0,'+(0.25+0.7*f).toFixed(2)+')'
          : 'rgba(255,255,255,'+(0.18+0.72*f).toFixed(2)+')';
        ctx.beginPath(); ctx.arc(X-CELL*0.22+i*CELL*0.22, Y-CELL*0.55, CELL*0.055, 0, 7); ctx.fill();
      }
    }
  }

  // 特效（openbox 开箱动画较长，单独放宽）
  fx = fx.filter(f=>now-f.t0 < (f.type==='openbox'?1200:((f.type==='trapgo'||f.type==='stun'||f.type==='shieldpop'||f.type==='sinkhole')?900:(f.type==='dfx'?1100:500))));
  for(const f of fx){
    if (f.type==='boxin'){                // 🎁 宝箱刷新：金色闪现
      const t=(now-f.t0)/450;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#fdca00'; ctx.lineWidth=2.5;
        const X=px(f.x)+CELL/2, Y=px(f.y)+CELL/2;
        ctx.beginPath(); ctx.arc(X, Y, CELL*(0.15+0.65*t), 0, 7); ctx.stroke();
        ctx.font=Math.floor(CELL*0.5)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=1-t; ctx.fillText('✨', X, Y);
        ctx.restore();
      }
    }else if (f.type==='openbox'){        // 🎁 开箱：抖动 → 箱盖上弹 → 道具图标放大浮现
      const t=(now-f.t0)/1200;
      const X=px(f.x)+CELL/2, Y=px(f.y)+CELL/2;
      if (t<0.35){
        ctx.font=Math.floor(CELL*0.52)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🎁', X+Math.sin(t/0.35*Math.PI*6)*CELL*0.09, Y+2);
      }else{
        const u=(t-0.35)/0.65;
        ctx.save();
        ctx.globalAlpha=(1-u)*0.85;
        ctx.font=Math.floor(CELL*0.5)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('📦', X, Y-CELL*0.55*u-2);
        ctx.globalAlpha=Math.min(1,u*3);
        ctx.font=Math.floor(CELL*(0.45+0.4*Math.sin(Math.min(1,u)*Math.PI)))+'px serif';
        ctx.fillText((ITEMS[f.i]||{icon:'🎁'}).icon, X, Y+2-CELL*0.12*u);
        ctx.strokeStyle='#fdca00'; ctx.lineWidth=2.5; ctx.globalAlpha=(1-u)*0.8;
        ctx.beginPath(); ctx.arc(X, Y, CELL*(0.25+0.75*u), 0, 7); ctx.stroke();
        ctx.restore();
      }
    }else if (f.type==='trapgo'){         // 🕳️ 陷阱塌陷：黑洞扩散 + 碎裂
      const t=(now-f.t0)/900;
      if (t<=1){
        const X=px(f.x)+CELL/2, Y=px(f.y)+CELL/2;
        ctx.save();
        ctx.globalAlpha=(1-t)*0.95;
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(X, Y, CELL*(0.12+0.42*t), 0, 7); ctx.fill();
        ctx.strokeStyle='#8a6bff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(X, Y, CELL*(0.2+0.62*t), 0, 7); ctx.stroke();
        ctx.font=Math.floor(CELL*0.5)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=1-t; ctx.fillText('💥', X, Y-CELL*0.3*t);
        ctx.restore();
      }
    }else if (f.type==='stun'){             // 💫 眩晕 / 🌀 混乱：图标旋转上浮
      const t=(now-f.t0)/900;
      if (t<=1){
        ctx.save();
        ctx.globalAlpha=t<0.7?1:(1-t)/0.3;
        ctx.translate(px(f.x)+CELL/2, px(f.y)+CELL/2-CELL*0.6*t);
        ctx.rotate(t*Math.PI*2);
        ctx.font=Math.floor(CELL*0.55)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(f.icon||'💫', 0, 0);
        ctx.restore();
      }
    }else if (f.type==='shieldpop'){        // 🛡️ 护盾格挡：金色光环扩散 + 盾徽上浮（全员可见）
      const t=(now-f.t0)/900;
      if (t<=1){
        const X=px(f.x)+CELL/2, Y=px(f.y)+CELL/2;
        ctx.save();
        ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#fdca00'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(X, Y, CELL*(0.3+0.55*t), 0, 7); ctx.stroke();
        ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(X, Y, CELL*(0.18+0.45*t), 0, 7); ctx.stroke();
        ctx.globalAlpha=t<0.15?t/0.15:(1-t)/0.85;
        ctx.font=Math.floor(CELL*0.5)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🛡️', X, Y-CELL*0.5*t);
        ctx.restore();
      }
    }else if (f.type==='wallpop'){
      const t=(now-f.t0)/300, e=1-Math.pow(1-Math.min(1,t),2);
      ctx.save(); ctx.globalAlpha=(1-t)*0.7;
      ctx.strokeStyle='#fff'; ctx.lineWidth=WT+6*e;
      ctx.lineCap='round';
      ctx.beginPath();
      if(f.kind==='h'){ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x+2),px(f.y)); }
      else{ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x),px(f.y+2)); }
      ctx.stroke(); ctx.restore();
    }else if (f.type==='smash'){
      const t=(now-f.t0)/350;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=WT+8*(1-t);
        ctx.lineCap='round';
        ctx.beginPath();
        if(f.kind==='h'){ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x+2),px(f.y)); }
        else{ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x),px(f.y+2)); }
        ctx.stroke(); ctx.restore();
      }
    }else if (f.type==='freeze'){           // ❄️ 定身：冰蓝扩散环
      const t=(now-f.t0)/600;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#7fd8ff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(px(f.x)+CELL/2, px(f.y)+CELL/2, CELL*(0.2+0.5*t), 0, 7); ctx.stroke();
        ctx.font=Math.floor(CELL*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=1-t; ctx.fillText('❄️', px(f.x)+CELL/2, px(f.y)+CELL/2);
        ctx.restore();
      }
    }else if (f.type==='throne'){           // 👑 王座迁移：金色双环
      const t=(now-f.t0)/700;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#fdca00'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(px(f.x)+CELL/2, px(f.y)+CELL/2, CELL*(0.3+0.7*t), 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(px(f.x)+CELL/2, px(f.y)+CELL/2, CELL*(0.15+0.5*t), 0, 7); ctx.stroke();
        ctx.restore();
      }
    }else if (f.type==='sinkhole'){         // 🕳️ 地陷：黑洞张口 / 恢复回弹
      const t=(now-f.t0)/900;
      if (t<=1){
        const X=px(f.x)+CELL/2, Y=px(f.y)+CELL/2;
        ctx.save();
        if (f.up){                          // 恢复：紫光回填 + ✨
          ctx.globalAlpha=(1-t)*0.85;
          ctx.strokeStyle='#8a6bff'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.arc(X, Y, CELL*(0.5-0.3*t), 0, 7); ctx.stroke();
          ctx.font=Math.floor(CELL*0.4)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('✨', X, Y);
        }else{                              // 塌陷：黑洞张口
          const gr=Math.min(1, t*2.5);
          ctx.globalAlpha=Math.min(1, t*5)*(1-t*0.3);
          ctx.fillStyle='#000';
          ctx.beginPath(); ctx.arc(X, Y, CELL*(0.15+0.33*gr), 0, 7); ctx.fill();
          ctx.strokeStyle='#8a6bff'; ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(X, Y, CELL*(0.2+0.34*gr), 0, 7); ctx.stroke();
        }
        ctx.restore();
      }
    }else if (f.type==='sunfx'){            // ☀️ 火墙点燃：橙红闪光
      const t=(now-f.t0)/500;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#ffb066'; ctx.lineWidth=WT+8*(1-t); ctx.lineCap='round';
        ctx.beginPath();
        if(f.kind==='h'){ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x+2),px(f.y)); }
        else{ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x),px(f.y+2)); }
        ctx.stroke(); ctx.restore();
      }
    }else if (f.type==='dfx'){              // ☄️ 天灾屏幕级特效（本地与远端事件共用）
      const t=(now-f.t0)/1100;
      if (t<=1){
        if (f.kind==='acid' || f.kind==='rain'){    // ☔🌧️ 酸雨/暴雨：全屏斜雨丝
          ctx.save(); ctx.globalAlpha=(1-t)*0.55;
          ctx.strokeStyle = f.kind==='acid' ? '#9be07a' : '#7fb2ff';
          ctx.lineWidth=1.5; ctx.beginPath();
          for(let i=0;i<46;i++){
            const sx=(i*173.3+i*i*7.7)%boardPx;
            const sy=((i*97.1)%boardPx + t*boardPx*1.7)%(boardPx+60)-30;
            ctx.moveTo(sx,sy); ctx.lineTo(sx-7,sy+18);
          }
          ctx.stroke(); ctx.restore();
        }else if (f.kind==='thunder'){              // ⚡ 暴雷：象限高亮 + 白闪 + ⚡
          ctx.save();
          if (t<0.15){ ctx.fillStyle='rgba(255,255,255,'+(0.5*(1-t/0.15)).toFixed(2)+')'; ctx.fillRect(0,0,boardPx,boardPx); }
          ctx.globalAlpha=(1-t)*0.28;
          ctx.fillStyle='#aee7ff'; ctx.fillRect(px(f.x), px(f.y), CELL*f.w, CELL*f.w);
          ctx.globalAlpha=(1-t)*0.85;
          ctx.strokeStyle='#dff4ff'; ctx.lineWidth=3;
          ctx.strokeRect(px(f.x), px(f.y), CELL*f.w, CELL*f.w);
          ctx.globalAlpha=t<0.5?1:(1-t)/0.5;
          ctx.font=Math.floor(CELL*1.3)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('⚡', px(f.x)+CELL*f.w/2, px(f.y)+CELL*f.w/2);
          ctx.restore();
        }else if (f.kind==='sun'){                  // ☀️ 烈阳：橙光罩顶
          ctx.save();
          const og=ctx.createLinearGradient(0,0,0,boardPx);
          og.addColorStop(0,'rgba(255,157,61,.5)'); og.addColorStop(1,'rgba(255,157,61,0)');
          ctx.globalAlpha=1-t; ctx.fillStyle=og; ctx.fillRect(0,0,boardPx,boardPx);
          ctx.globalAlpha=t<0.5?1:(1-t)/0.5;
          ctx.font=Math.floor(CELL*1.2)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('☀️', boardPx/2, CELL*0.9);
          ctx.restore();
        }else if (f.kind==='bang'){                 // 💥 大爆炸：白闪 + 冲击环
          ctx.save();
          if (t<0.18){ ctx.fillStyle='rgba(255,255,255,'+(0.75*(1-t/0.18)).toFixed(2)+')'; ctx.fillRect(0,0,boardPx,boardPx); }
          ctx.globalAlpha=1-t;
          ctx.strokeStyle='#ffc478'; ctx.lineWidth=5+9*(1-t);
          ctx.beginPath(); ctx.arc(boardPx/2, boardPx/2, 20+t*boardPx*0.85, 0, 7); ctx.stroke();
          if (t<0.5){ ctx.font=Math.floor(CELL*1.3)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💥', boardPx/2, boardPx/2); }
          ctx.restore();
        }
      }
    }
  }
  drawConfetti(dt);

  if (toastMsg){
    const t=(now-toastMsg.t0)/1400;
    if(t>1) toastMsg=null;
    else{
      ctx.save(); ctx.globalAlpha=t<0.85?1:(1-t)/0.15;
      ctx.font='600 14px "PingFang SC",sans-serif';
      const wtxt=ctx.measureText(toastMsg.text).width+30;
      rr(boardPx/2-wtxt/2, boardPx-40, wtxt, 28, 14);
      ctx.fillStyle='rgba(10,15,26,.9)'; ctx.fill();
      ctx.strokeStyle='#2a3a63'; ctx.stroke();
      ctx.fillStyle='#dfe7f5'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(toastMsg.text, boardPx/2, boardPx-26);
      ctx.restore();
    }
  }
  _drawErrs = 0;
  }catch(e){
    if (++_drawErrs >= 60) return;
  }finally{
    requestAnimationFrame(draw);
  }
}
function spawnConfetti(){
  for(let i=0;i<150;i++){
    confetti.push({
      x:Math.random()*boardPx, y:-20-Math.random()*boardPx*0.6,
      vx:(Math.random()-0.5)*60, vy:70+Math.random()*150,
      s:3+Math.random()*5, c:`hsl(${Math.floor(Math.random()*360)},90%,60%)`,
      rot:Math.random()*7, vr:(Math.random()-0.5)*8,
    });
  }
}
function drawConfetti(dt){
  if (winner && winner!=='draw' && confetti.length){
    const dpr = window.devicePixelRatio||1;
    ctx.save();
    for(const c of confetti){
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt;
      if(c.y>boardPx+20){ c.y=-20; c.x=Math.random()*boardPx; }
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
      ctx.fillStyle=c.c; ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s*1.6);
      ctx.restore();
    }
    ctx.restore();
  }
}

/* ================= 侧栏 ================= */
function buildPanel(){
  const el=document.getElementById('plist'); el.innerHTML='';
  for(const p of players){
    const row=document.createElement('div');
    row.className='prow'; row.id='prow-'+p.color;
    row.style.color=COLORS[paintOf(p.color)].main;
    row.innerHTML=`
      <span class="dot"></span>
      <span class="pname" style="color:var(--text)">${p.name || COLORS[p.color].name}
        ${(isOnline() ? (!netWatch && p.color===myColor) : (p.human&&(mode==='pve'||mode==='sync')))?'<span class="tagyou">你</span>':''}
        ${p.ai?'<span style="font-size:10px;color:var(--dim)">AI</span>':''}</span>
      <span class="itm"></span>
      <span class="skl"></span>
      <span class="wnum" title="剩余墙数">墙 ×${wallStock}</span>
      <span class="steps"></span>`;
    el.appendChild(row);
  }
}
function renderPanel(){
  const dists = winner? null : allDists();
  for(const p of players){
    const row=document.getElementById('prow-'+p.color); if(!row) continue;
    row.classList.toggle('active', !winner && p===cur());
    const wn=row.querySelector('.wnum');
    if (wn) wn.textContent='墙 ×'+p.walls;
    const itm=row.querySelector('.itm');
    if (itm){
      const mine = p===localFreeActor() && !winner;
      itm.innerHTML = p.inv.map((k,i)=>{
        const it=ITEMS[k]||{icon:'🎁',name:'',desc:''};
        return `<span class="islot${mine?' mine':''}${pendingItem===k?' on':''}" data-i="${i}" title="${it.name}：${it.desc}">${it.icon}</span>`;
      }).join('');
      if (mine) for(const s of itm.querySelectorAll('.islot'))
        s.onclick = ()=>clickInvSlot(p, +s.dataset.i);
    }
    const skl=row.querySelector('.skl');
    if (skl){
      const mine = p===localFreeActor() && !winner;
      const sk = p.skill? SKILLS.find(s=>s.id===p.skill) : null;
      skl.innerHTML = sk? `<span class="islot${mine&&!p.skillUsed?' mine':''}${pendingSkill===sk.id?' on':''}" title="${sk.name}：${sk.desc}${p.skillUsed?'（已用）':''}">${sk.icon}</span>` : '';
      const sp=skl.querySelector('.islot');
      if (sp && mine && !p.skillUsed) sp.onclick=()=>clickSkillSlot(p);
    }
    const steps=row.querySelector('.steps');
    if (winner===p) steps.textContent='👑 赢';
    else if (dists && dists[p.color]>=0) steps.textContent='距王座 '+dists[p.color];
    else steps.textContent='—';
  }
  renderLeftbar();
}
/* ---- 操作日志（左侧底部"动态"面板；联机时房主权威，随事件广播） ---- */
function logPush(text, color, priv){   // priv=true：仅 color 一方可见（如陷阱埋设坐标）
  if (isOnline()){
    if (!hostSim()) return;            // 客户端不产日志，只经 applyEvent 收
    netEv({type:'log', text, color: color||null, to: priv&&color ? color : null});
    if (priv && color !== myColor) return;   // 他人的私密日志：房主也不显示
  }
  logAppend(text, color);
}
function logAppend(text, color){
  logLines.push({t:turnCount, text, color: color||null});
  if (logLines.length > 90) logLines.shift();
  logRender();
}
function logRender(){
  const el=document.getElementById('logBody'); if(!el) return;
  el.innerHTML = logLines.map(L=>
    `<div class="lg"><span class="tno">T${L.t}</span><span>${L.color?`<b style="color:${COLORS[L.color].main}">${COLORS[L.color].name}</b> `:''}${L.text}</span></div>`).join('');
  el.scrollTop = el.scrollHeight;
}
function renderLeftbar(){                // 棋盘左侧技能卡 + 道具箱
  const skBody=document.getElementById('skBarBody'); if(!skBody) return;
  const invBody=document.getElementById('invBarBody');
  const me=localFreeActor();
  if (!me || winner || (pendingSkill&&pendingSkill!==(me.skill||''))) skArming=null;
  const sk=(me&&me.skill)?SKILLS.find(s=>s.id===me.skill):null;
  const used=me&&me.skillUsed;
  const usable=!!(sk&&!used&&!winner);
  const armed=!!(sk&&pendingSkill===sk.id);
  const confirming=usable&&!armed&&skArming===me.color;
  if (!sk){
    skBody.innerHTML=`<div class="lsk dis"><div class="ico">🃏</div><div class="nm">${me?'本局未选技能':'等待你的回合'}</div><div class="ds">${me?'本局没有可选技能，或技能已关闭':'轮到你时技能卡会在此点亮'}</div></div>`;
  }else{
    const cls='lsk'+(armed?' armed':(confirming?' arm':(used||!usable?' dis':'')));
    skBody.innerHTML=`
      <div class="${cls}" id="lskCard">
        <div class="ico">${sk.icon}</div>
        <div class="nm">${sk.name}${used?' · 已用':''}</div>
        <div class="ds">${used?'本局技能已释放':sk.desc}</div>
        ${armed?`<div class="ds" style="color:#e6c94f;margin-top:4px">已瞄准：点击棋盘上的目标；再点本卡可取消</div>`:''}
        ${confirming?`<div class="lskbtns"><button class="primary" id="lskGo">使 用</button><button id="lskNo">取 消</button></div>`:''}
      </div>`;
    const card=document.getElementById('lskCard');
    if (armed) card.onclick=()=>{ skArming=null; clickSkillSlot(me); };
    else if (usable&&!confirming) card.onclick=()=>{ skArming=me.color; renderLeftbar(); };
    else card.onclick=null;
    const go=document.getElementById('lskGo');
    if (go) go.onclick=e=>{ e.stopPropagation(); skArming=null; clickSkillSlot(me); };
    const no=document.getElementById('lskNo');
    if (no) no.onclick=e=>{ e.stopPropagation(); skArming=null; renderLeftbar(); };
  }
  if (invBody){
    const mine=!!me&&!winner;
    let cells='';
    for(let i=0;i<INV_CAP;i++){
      const k=me?me.inv[i]:null;
      const it=k?(ITEMS[k]||{icon:'🎁'}):null;
      cells+=`<div class="lslot${k&&mine?' mine':''}${pendingItem===k?' on':''}" data-i="${i}" title="${it?(it.icon+' '+it.name+'：'+it.desc):'空'}">${it?it.icon:''}</div>`;
    }
    invBody.innerHTML=`<div class="lslotwrap">${cells}</div>`;
    if (mine) for(const s of invBody.querySelectorAll('.lslot'))
      if (me.inv[+s.dataset.i]) s.onclick=()=>{ skArming=null; clickInvSlot(me, +s.dataset.i); };
  }
}
function clickInvSlot(p, i){          // 点击道具箱：🧱 +1 墙；🔨 选墙砸碎；🔋 恢复技能；🪤 选格埋雷；🌀 选对手混乱
  if (winner) return;
  if (!isSyncMode() && cur()!==p){ toast('还没轮到你'); return; }
  const kind = p.inv[i]; if (!kind) return;
  if (kind==='wall'){
    if (isOnline()){
      if (hostSim()) hostApplyAction(p, {type:'itemuse', kind:'wall'});
      else { busy=true; setTimeout(()=>{busy=false;},2500); netSend({t:'act', a:{type:'itemuse', kind:'wall'}}); }
    }else{
      p.inv.splice(i,1); p.walls++; sPick(); renderPanel();
      logPush('使用 🧱 +1 堵墙', p.color);
      toast(COLORS[p.color].name+' 使用 🧱：+1 堵墙');
    }
  }else if (kind==='restore'){
    if (!skillsOn || !p.skill){ toast('本局没有技能，恢复卡用不了'); return; }
    if (!p.skillUsed){ toast('技能还没用过，无需恢复'); return; }
    if (isOnline()){
      if (hostSim()) hostApplyAction(p, {type:'itemuse', kind:'restore'});
      else { busy=true; setTimeout(()=>{busy=false;},2500); netSend({t:'act', a:{type:'itemuse', kind:'restore'}}); }
    }else{
      p.inv.splice(i,1); p.skillUsed=false; sPick(); renderPanel();
      logPush('使用 🔋 技能恢复卡，技能已刷新', p.color);
      toast('🔋 技能使用次数已恢复');
    }
  }else if (kind==='shield'){
    if (p.shield){ toast('护盾已在生效中'); return; }
    if (isOnline()){
      if (hostSim()) hostApplyAction(p, {type:'itemuse', kind:'shield'});
      else { busy=true; setTimeout(()=>{busy=false;},2500); netSend({t:'act', a:{type:'itemuse', kind:'shield'}}); }
    }else{
      useShieldItem(p);
      toast('🛡️ 护盾已激活：将免疫 1 次敌方技能或陷阱');
    }
  }else if (kind==='trap' || kind==='confusion'){
    if (pendingItem===kind){ pendingItem=null; renderPanel(); return; }   // 再点一次取消
    pendingItem=kind;
    pendingSkill=null;                    // 与技能待选互斥
    renderPanel();
    toast(kind==='trap' ? '🪤 点击一个空格埋入陷阱（仅自己可见）' : '🌀 点击一名对手：混乱其下一步方向');
  }else{
    if (pendingItem==='hammer'){ pendingItem=null; renderPanel(); return; }   // 再点一次取消
    pendingItem='hammer';
    pendingSkill=null;                    // 与技能待选互斥
    renderPanel();
    toast('🔨 点击要击碎的墙');
  }
}
function clickSkillSlot(p){              // 点击技能槽：无目标技能立即放；有目标进入选择模式
  if (winner) return;
  if (!isSyncMode() && cur()!==p){ toast('还没轮到你'); return; }
  if (p.skillUsed || !p.skill) return;
  const sk=SKILLS.find(s=>s.id===p.skill); if (!sk) return;
  if (sk.target===null){
    if (isOnline()){
      if (hostSim()) hostApplyAction(p, {type:'skilluse', id:sk.id, t:null});
      else { busy=true; setTimeout(()=>{busy=false;},2500); netSend({t:'act', a:{type:'skilluse', id:sk.id, t:null}}); }
    }else if (!execSkill(p, sk.id, null)) toast('没有合适的位置');
    return;
  }
  if (pendingSkill===sk.id){ pendingSkill=null; renderPanel(); return; }   // 再点一次取消
  pendingItem=null;                      // 与道具待选互斥
  pendingSkill=sk.id;

}

const NET_WS_DEFAULT = 'wss://throne-race-online.1kb.ren/api/room';
                             // ↑ 在线对战服务器（部署在 1kb.ren 所在账号，Custom Domain 绑定，国内可直连）

const meOnline = () => players.find(p=>p.color===myColor);
function netWsBase(){ return Q.get('ws') || NET_WS_DEFAULT; }
function netSend(obj){ try{ if (net.ws && net.ws.readyState===1) net.ws.send(JSON.stringify(obj)); }catch(e){} }

/* ---- 房主：快照广播（动作函数里的 netEv 只记事件，微任务里合并成一次快照发出） ---- */
function netEv(e){
  if (!hostSim()) return;
  netPending.push(e);
  if (!netFlushQueued){ netFlushQueued = true; queueMicrotask(netFlush); }
}
function netFlush(){
  netFlushQueued = false;
  if (!netPending.length) return;
  const ev = netPending; netPending = [];
  netSend({ t:'state', s: serializeState(), ev });
}
function serializeState(){
  return {
    sync: isSyncMode(), watch: netWatch, N, throne:{x:THRONE.x, y:THRONE.y},
    wallsH: [...wallsH], wallsV: [...wallsV], wallOwner,
    boxes: boxes.map(b=>({x:b.x, y:b.y, i:b.i})),
    traps: traps.map(t=>({x:t.x, y:t.y, o:t.o})),
    disastersOn, disasterInterval,
    collapsed: collapsed.map(c=>({x:c.x, y:c.y, end:c.end})),
    fireWalls: fireWalls.map(f=>({kind:f.kind, x:f.x, y:f.y, end:f.end})),
    turnIdx, turnCount, passStreak,
    winner: winner==null ? null : (winner==='draw' ? 'draw' : winner.color),
    draft: draft? {offers:draft.offers, picked:draft.picked} : null,
    players: players.map(p=>({
      color:p.color, name:p.name, cell:{x:p.cell.x, y:p.cell.y},
      walls:p.walls, left:p.left, ai:p.ai, human:p.human,
      inv:[...p.inv], sk:p.skill, sku:p.skillUsed?1:0,
      fzt:p.frozenTurns, fzu:Math.round(p.frozenUntil), exa:p.extraActs, pt:p.paint,
      cnf:p.confused?1:0, stn:p.stunTag?1:0, shd:p.shield?1:0, rb:p.rainBoost?1:0,
      ap:Math.round(p.ap*100)/100,
    })),
    now: performance.now(),
  };
}
function applySnapshot(s, ev){
  mode = s.sync ? 'onsync' : 'online';
  netWatch = !!s.watch;
  busy = false;
  pendingWall = null;   // 状态已刷新，待确认预览作废
  const prevCells = {};
  for (const p of players) prevCells[p.color] = { ...p.cell };
  if (s.N !== N) setBoardSize(s.N);
  if (s.throne){ THRONE.x = s.throne.x; THRONE.y = s.throne.y; }   // 王座可能被技能移动过
  wallsH = new Set(s.wallsH);
  wallsV = new Set(s.wallsV);
  wallOwner = { ...s.wallOwner };
  boxes = (s.boxes||[]).map(b=>({x:b.x, y:b.y, i:b.i}));
  traps = (s.traps||[]).map(t=>({x:t.x, y:t.y, o:t.o}));
  const prevColl = new Set(collapsed.map(c=>c.x+','+c.y));      // 快照 diff：消失的塌陷格 = 已恢复（远端补播 ✨ 动画）
  collapsed = (s.collapsed||[]).map(c=>({x:c.x, y:c.y, end:c.end}));
  fireWalls = (s.fireWalls||[]).map(f=>({kind:f.kind, x:f.x, y:f.y, end:f.end}));
  for (const c of collapsed) prevColl.delete(c.x+','+c.y);
  for (const k of prevColl){ const [x,y]=k.split(',').map(Number); fx.push({type:'sinkhole', x, y, up:true, t0:performance.now()}); }
  disastersOn = s.disasters!==false;
  disasterInterval = [3,10,20].includes(s.disasterInterval) ? s.disasterInterval : 3;
  turnIdx = s.turnIdx; turnCount = s.turnCount; passStreak = s.passStreak;
  itemClock = 0;
  draft = s.draft ? {offers:s.draft.offers, picked:s.draft.picked} : null;
  const hostNow = s.now || 0;
  players = s.players.map(sp=>{
    const np = {
      color:sp.color, name:sp.name, cell:{x:sp.cell.x, y:sp.cell.y},
      walls:sp.walls, left:sp.left, ai:sp.ai, human:sp.human,
      inv: sp.inv? [...sp.inv] : [],
      skill: sp.sk||null, skillUsed: !!sp.sku, skillOffer:[],   // 候选从 draft.offers 恢复，不走玩家字段
      frozenTurns: sp.fzt||0,
      frozenUntil: sp.fzu ? performance.now() + Math.max(0, sp.fzu - hostNow) : 0,   // 主机时钟 → 本地时钟
      extraActs: sp.exa||0, paint: sp.pt||null,
      confused: !!sp.cnf, stunTag: !!sp.stn, shield: !!sp.shd, rainBoost: !!sp.rb,
      ap: sp.ap!=null ? sp.ap : SYNC_APMAX,
      lastAct: performance.now() - Math.max(0, hostNow - (sp.lastAct || hostNow)),  // 换算到本地时钟
      tween:null, bank:false, burstLeft:0, nextThink:0,
    };
    const oc = prevCells[sp.color];                       // 远端棋子也走 90ms 滑动动画
    if (oc && (oc.x!==np.cell.x || oc.y!==np.cell.y))
      np.tween = { fx:oc.x, fy:oc.y, t0:performance.now() };
    return np;
  });
  winner = s.winner==null ? null : (s.winner==='draw' ? 'draw' : (players.find(p=>p.color===s.winner)||null));
  layout();
  buildPanel(); renderPanel(); refreshHint(); syncSelects();
  document.getElementById('overlay').classList.remove('show');
  refreshNetDraft();                                  // 远端：按 draft 状态同步选技遮罩
  for (const e of ev||[]) applyEvent(e);
}
function applyEvent(e){
  if (e.to && e.to !== myColor) return;                   // 定向消息只给收件人
  const now = performance.now();
  switch(e.type){
    case 'roundstart': toast('新对局开始！'); logLines = []; netSkillPicked=false; break;
    case 'move': (e.jump?sJump:sMove)(); break;
    case 'wall': sWall(); fx.push({type:'wallpop', kind:e.kind, x:e.x, y:e.y, t0:now}); break;
    case 'smash': sSmash(); fx.push({type:'smash', kind:e.kind, x:e.x, y:e.y, t0:now}); break;
    case 'skill': (e.fx==='jump'?sJump:sPick)(); break;
    case 'boxspawn': fx.push({type:'boxin', x:e.x, y:e.y, t0:now}); break;
    case 'boxopen': fx.push({type:'openbox', x:e.x, y:e.y, i:e.i, t0:now}); sPick(); break;
    case 'trapgo': { fx.push({type:'trapgo', x:e.x, y:e.y, t0:now}); sSmash(); toast('💥 有人踩中陷阱，掉回出生点！'); break; }
    case 'disaster': {                              // 天灾屏幕特效（状态本身走快照，这里只播表现）
      const {type, ...rest} = e;                   // 剔除 type:'disaster'，防其覆盖 fx 的 type:'dfx'
      disasterFx(e.kind, rest);
      if (e.kind==='sink') for (const [x,y] of (e.cells||[])) fx.push({type:'sinkhole', x, y, t0:now});
      break;
    }
    case 'stunfx': { const q=players.find(x=>x.color===e.color); if (q) fx.push({type:'stun', x:q.cell.x, y:q.cell.y, t0:now}); sBad(); break; }
    case 'confusefx': { const q=players.find(x=>x.color===e.color); if (q) fx.push({type:'stun', x:q.cell.x, y:q.cell.y, t0:now, icon:'🌀'}); break; }
    case 'shieldfx': { const q=players.find(x=>x.color===e.color); if (q) fx.push({type:'shieldpop', x:q.cell.x, y:q.cell.y, t0:now}); sPick(); break; }
    case 'pass': toast(COLORS[e.color].name+' 无路可走，跳过'); break;
    case 'reject': toast(e.text); sBad(); break;
    case 'log': logAppend(e.text, e.color); break;
    case 'aidesk': toast((players.find(q=>q.color===e.color)||{}).name+' 掉线，AI 接管'); break;
    case 'win': sWin(); spawnConfetti(); showOnlineEnd(e.color); break;
    case 'draw': showOnlineEnd('draw'); break;
  }
}

function newOnlineGame(seats, settings){
  clearTimeout(aiTimer);
  mode = settings.sync ? 'onsync' : 'online';
  netWatch = !!settings.watch;
  setBoardSize(settings.size);
  wallStock = settings.walls;
  itemsOn = settings.items>0; itemInterval = settings.items||5;
  skillsOn = settings.skills!==false;
  disastersOn = settings.disasters!==false;
  disasterInterval = [3,10,20].includes(settings.disasterInterval) ? settings.disasterInterval : 3;
  wallsH.clear(); wallsV.clear(); wallOwner = {};
  players = ['blue','green','red','orange'].map(c=>{
    const meta = (seats||[]).find(s=>s.seat===c);
    const occupied = !!meta && !settings.watch;      // 观战局：全员 AI，房主也只围观
    return {
      color:c, name: occupied ? meta.name : ('AI·'+COLORS[c].name),
      cell:{...SPAWN[c]}, walls:wallStock, left:false,
      ai: !occupied, human: occupied,
      tween:null, ap:SYNC_APMAX, lastAct:performance.now(), nextThink:0, bank:false, burstLeft:0,
      inv:[], skill:null, skillUsed:false, skillOffer:[],
      frozenTurns:0, frozenUntil:0, extraActs:0, paint:null,
      shield:false,
      rainBoost:false,
    };
  });
  turnIdx = Math.floor(rnd()*4);
  winner = null; busy = false; turnCount = 0; passStreak = 0;
  itemClock = 0; boxes = []; traps = [];
  collapsed = []; fireWalls = [];            // 天灾残留清空
  logLines = [];
  logPush('🏁 新对局开始，抢座大战一触即发', null);
  confetti = []; fx = []; toastMsg = null; pendingWall = null;
  document.getElementById('overlay').classList.remove('show');
  layout(); syncSelects(); buildPanel(); renderPanel(); refreshHint();
  if (skillsOn) startDraftOnline();        // 联机选技：房主权威，随快照广播给全员
  else if (!isSyncMode()){ autoPassIfNeeded(); scheduleAI(); }   // 先手可能是 AI
  netEv({type:'roundstart'});       // 触发首份快照广播
}
function netStartRound(){
  const sel = document.getElementById('netSyncSel');
  let sync, watch;
  if (sel){ const v = sel.value; sync = v.includes('1'); watch = v.startsWith('w'); }
  else { sync = isSyncMode(); watch = netWatch; }     // 对局中重开：沿用本局设置
  netSend({ t:'start', settings:{ sync, watch, size:N, walls:wallStock, items: itemsOn?itemInterval:0, skills: skillsOn, disasters: disastersOn, disasterInterval } });
}

function netBegin(kind, code){
  const base = netWsBase();
  const st = document.getElementById('netConnStatus');
  if (!base){
    st.textContent = '还没配置服务器：部署 server/ 后把地址填入 index.html 的 NET_WS_DEFAULT，或临时用 ?ws=wss://… 参数';
    return;
  }
  showNetConnect.nick = document.getElementById('netNick').value;
  st.textContent = '连接中…';
  net.lastErr = null;
  net.phase = 'connecting';
  net.pendingCode = code;
  try{
    net.ws = new WebSocket(base + '?' + (kind==='create' ? 'create=1' : 'code='+encodeURIComponent(code)));
  }catch(err){
    net.phase='idle'; st.textContent = '无法连接：'+err.message; return;
  }
  net.ws.onopen = ()=>{ netSend({ t:'hello', name: showNetConnect.nick }); };
  net.ws.onmessage = ev=>{ let m; try{ m = JSON.parse(ev.data); }catch{ return; } netOnMsg(m); };
  net.ws.onerror = ()=>{};
  net.ws.onclose = ()=>{
    if (net.phase==='connecting'){
      st.textContent = net.lastErr ? ('连接失败：'+net.lastErr) : '连接失败：服务器不可达';
      net.phase='idle'; net.ws=null; return;
    }
    netTeardown(net.leaving ? '已离开房间' : '与服务器的连接已断开');
  };
}
function netOnMsg(m){
  switch(m.t){
    case 'welcome':
      net.phase='lobby'; net.code=m.code; net.seat=m.seat; net.isHost=!!m.isHost;
      myColor=m.seat; net.roster=m.players||[];
      document.getElementById('overlay').classList.remove('show');
      renderNetCard(); lockNetSettings();
      return;
    case 'roster':
      net.roster=m.players||[]; renderNetCard();
      return;
    case 'start':
      net.phase='playing';
      if (net.isHost) newOnlineGame(m.seats, m.settings);
      else toast('对局开始！');
      renderNetCard(); lockNetSettings();
      return;
    case 'act':
      if (net.isHost){
        const p = players.find(q=>q.color===m.from);
        if (p) hostApplyAction(p, m.a);
      }
      return;
    case 'state':
      if (!net.isHost) applySnapshot(m.s, m.ev||[]);
      return;
    case 'left': {
      net.roster = m.players || net.roster;
      if (net.isHost && net.phase==='playing'){
        const p = players.find(q=>q.color===m.seat);      // 掉线者的座位交给 AI
        if (p && !p.ai){
          p.ai=true; p.human=false; p.lastAct=performance.now()-SYNC_CD;
          buildPanel(); renderPanel();
          netEv({type:'aidesk', color:m.seat});
          if (!isSyncMode() && !winner && cur()===p) scheduleAI();
        }
      }else{
        renderNetCard();
        toast((m.name||'有玩家')+' 离开了');
      }
      return;
    }
    case 'host-left': netTeardown('房主离开，房间已解散'); return;
    case 'err':
      net.lastErr = m.msg || '未知错误';
      if (net.phase==='connecting'){
        const st = document.getElementById('netConnStatus');
        if (st) st.textContent = '失败：'+net.lastErr;
      }else toast(net.lastErr);
      return;
  }
}
function netTeardown(msg){
  try{ if (net.ws){ net.ws.onclose=null; net.ws.close(); } }catch(e){}
  net.ws=null; net.phase='idle'; net.code=null; net.seat=null;
  net.isHost=false; net.roster=[]; net.leaving=false;
  myColor=null;
  if (msg) toast(msg);
  if (isOnline()){ mode='pve'; newGame(); }
  renderNetCard(); lockNetSettings(); syncSelects();
}
function netLeave(){
  net.leaving = true;
  const had = net.ws && net.ws.readyState<=1;
  try{ if (net.ws) net.ws.close(); }catch(e){}
  if (!had) netTeardown('已离开房间');
}
function lockNetSettings(){
  const hostLobby = isOnline() && net.isHost && net.phase==='lobby';
  for (const id of ['sizeSel','wallSel','itemSel','skillSel'])
    document.getElementById(id).disabled = isOnline() ? !hostLobby : false;
  document.getElementById('modeSel').disabled = isOnline();
}
function renderNetCard(){
  const el = document.getElementById('netCard');
  if (!isOnline() || net.phase==='idle' || net.phase==='connecting'){ el.style.display='none'; return; }
  el.style.display='';
  const rows = ['blue','green','red','orange'].map(c=>{
    const idx = net.roster.findIndex(r=>r.seat===c);
    if (idx<0) return `<div class="nrow" style="color:#5a6a8c"><span class="dot" style="color:${COLORS[c].main}"></span><span class="ndim">空位 · 开局后 AI 补位</span></div>`;
    const meta = net.roster[idx];
    return `<div class="nrow" style="color:${COLORS[c].main}">
      <span class="dot"></span>
      <span class="pname" style="color:var(--text)">${escapeHtml(meta.name||COLORS[c].name)}
        ${meta.seat===net.seat?'<span class="tagyou">你</span>':''}
        ${idx===0?'<span class="ndim">房主</span>':''}</span></div>`;
  }).join('');
  const mid = net.phase==='playing'
    ? `<div class="ndim" style="text-align:center; margin:4px 0 8px">${netWatch
        ? '观战进行中 · 结束后自动下一局'
        : `对局进行中${net.isHost?' · 顶部「开新一局」可开新回合':''}`}</div>
       <div class="btnrow"><button id="btnNetLeave">离开房间</button></div>`
    : (net.isHost
      ? `<select id="netSyncSel">
           <option value="">经典 · 轮流行动（空位 AI 补位）</option>
           <option value="1">同步 · 实时乱斗（空位 AI 补位）</option>
           <option value="w">观战 · 经典规则 AI 互坑</option>
           <option value="w1">观战 · 同步规则 AI 互坑</option>
         </select>
         <div class="ndim" style="margin:6px 0 2px">地图 / 墙数 / 道具用左侧设置，开局后锁定</div>
         <div class="btnrow" style="margin-top:6px">
           <button class="primary" id="btnNetStart">开始对局</button>
           <button id="btnNetLeave">离开</button>
         </div>`
      : `<div class="ndim" style="text-align:center; margin:4px 0 8px">等待房主开始…</div>
         <div class="btnrow"><button id="btnNetLeave">离开房间</button></div>`);
  el.innerHTML = `
    <h3>在线房间</h3>
    <div class="netcode">${escapeHtml(net.code||'')}</div>
    <div class="btnrow">
      <button id="btnCopyCode">复制房码</button>
      <button id="btnCopyLink">邀请链接</button>
    </div>
    <div style="height:8px"></div>${rows}<div style="height:8px"></div>${mid}`;
  document.getElementById('btnCopyCode').onclick = ()=>copyText(net.code);
  document.getElementById('btnCopyLink').onclick = ()=>copyText(location.origin+location.pathname+'?join='+net.code);
  document.getElementById('btnNetLeave').onclick = ()=>netLeave();
  const bs = document.getElementById('btnNetStart'); if (bs) bs.onclick = ()=>netStartRound();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function copyText(t){
  const ok = ()=>toast('已复制');
  const fallback = ()=>{
    try{
      const i=document.createElement('textarea');
      i.value=t; document.body.appendChild(i); i.select();
      document.execCommand('copy'); document.body.removeChild(i); ok();
    }catch(e){ toast('复制失败：'+t); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(ok, fallback);
  else fallback();
}

/* ================= 按钮 ================= */
function showRules(first){
  const ov=document.getElementById('overlay'), pn=document.getElementById('ovPanel');
  pn.innerHTML = `
    <h2>玩法</h2>
    <div id="rules">
      四名玩家从四边中点出发，<b>轮流行动</b>，每回合二选一：<br>
      ① <b>移动</b>：棋子走一格（上下左右），不能穿墙、不能叠人；贴脸时可<b>跳</b>过去。<br>
      ② <b>放墙</b>：一堵墙占 2 格边，永久存在，用你的颜色。<br>
      <b>第一个踏上中央王座 👑 的人获胜。</b><br>
      规则保护：不许放墙把任何玩家彻底堵死——谁都得起码留一条活路。<br>
      <b>同步模式</b>：取消回合，四人同时行动。每人 3 个操作点（上限3），走子/放墙各耗 1 点，动作间隔 0.5 秒，每秒恢复 1 点。<br>
      <b>道具模式</b>（设置里开启）：棋盘每隔几秒随机出现 🎁 宝箱，走上去拾取后开出随机道具（道具箱上限 2 个）：🧱 +1 堵墙；🔨 击碎任意一堵墙；🔋 恢复技能次数 1 次；🪤 埋陷阱（仅自己可见，踩中者掉回出生点）；🌀 混乱对手（其下一步方向上下左右颠倒）；🛡️ 保护卡（激活后免疫 1 次敌方指向性技能或陷阱，护盾状态仅自己可见）；💫 眩晕（开箱即触发，拾取者暂停 1 回合）。免费即时，不耗操作点。<br>
      <b>技能</b>（设置里开启）：开局每人从随机抽出的 3 个候选中选 1 个，整局限用 1 次。点击面板上的技能图标释放，免费即时（不耗回合/操作点；经典模式限自己回合内；被 ❄️ 定身时不可用）。<br>
      没有队友，没有谈判。<b>4位玩家，1位赢家，0个朋友。</b>
    </div>
    <div class="legend">
      <span style="color:#0f9ceb"><i></i>蓝</span><span style="color:#17d76c"><i></i>绿</span>
      <span style="color:#e02955"><i></i>红</span><span style="color:#f5a307"><i></i>橙</span>
    </div>
    <button class="primary" id="btnOk">${first?'开打！':'继续'}</button>`;
  ov.classList.add('show');
  document.getElementById('btnOk').onclick=()=>{ ov.classList.remove('show'); ac(); };
}
document.getElementById('btnNew').onclick = ()=>{
  ac();
  if (isOnline()){
    if (hostSim()) netStartRound();          // 房主：直接用当前设置开新回合
    else toast('等待房主开新局');
    return;
  }
  newGame();
};
document.getElementById('btnRules').onclick = ()=>showRules(false);
document.getElementById('btnMute').onclick = function(){
  muted=!muted; this.textContent = muted? '🔇 静音':'🔊 音效';
};
document.getElementById('btnSpeed').onclick = function(){
  fastAI=!fastAI; this.textContent = fastAI? '⚡ 极速':'⚡ 正常';
};
document.getElementById('modeSel').onchange = function(){
  if (this.value==='online'){ mode='online'; myColor=null; showNetConnect(); return; }
  if (isOnline()){ this.value='online'; return; }   // 在线中不允许切回本地模式，先离开房间
  mode=this.value; newGame();
};
document.getElementById('sizeSel').onchange = function(){
  if (isOnline()){ if(!hostSim()) this.value=String(N); return; }   // 在线时仅房主在大厅可调
  setBoardSize(+this.value); newGame();
};
document.getElementById('wallSel').onchange = function(){
  if (isOnline()){ if(!hostSim()) this.value=String(wallStock); return; }
  wallStock=+this.value; newGame();
};
document.getElementById('itemSel').onchange = function(){
  const v=+this.value; itemsOn = v>0; itemInterval = v||5;
  itemClock = 0; refreshHint();
  if (isOnline() && !hostSim()){ this.value = String(itemsOn?itemInterval:0); }
};
document.getElementById('skillSel').onchange = function(){
  if (isOnline() && !hostSim()){ this.value = skillsOn? '1':'0'; return; }
  skillsOn = this.value==='1'; refreshHint();
};
document.getElementById('disasterSel').onchange = function(){
  if (isOnline() && !hostSim()){ this.value = disastersOn? String(disasterInterval) : '0'; return; }
  const v = +this.value;
  disastersOn = v > 0;
  if (v > 0) disasterInterval = v;
  refreshHint();
};

/* ================= 启动 ================= */
layout();
newGame();
requestAnimationFrame(draw);
// 首次进入展示规则（带 seed 的自动化测试跳过；带 join 邀请码时也直接进连接框）
if (!Q.get('seed') && !Q.get('join')) showRules(true);
if (Q.get('join')) showNetConnect(Q.get('join').toUpperCase());
else if (Q.get('mode')==='online') showNetConnect();
</script>
