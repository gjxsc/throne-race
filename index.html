<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>4位玩家，1位赢家，0个朋友 · 王座墙棋</title>
<style>
  :root{ --bg:#070b14; --text:#dfe7f5; --dim:#8fa0bd; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #101a30 0%, var(--bg) 60%);
    color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    overflow-x:hidden;
  }
  header{ text-align:center; padding:16px 12px 4px; }
  header h1{
    font-size:clamp(20px,3.4vw,30px); letter-spacing:1px; font-weight:800;
    background:linear-gradient(90deg,#5db9ff,#ff5d8f,#2ee38a,#ffb62e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .tag{ color:var(--dim); font-size:12px; margin-top:4px; letter-spacing:2px;}
  #wrap{ display:flex; gap:18px; align-items:flex-start; justify-content:center; padding:10px 14px 26px; flex:1; width:100%; max-width:1100px;}
  #boardBox{ position:relative; }
  canvas{ display:block; border-radius:14px; }
  #side{ width:300px; flex:0 0 300px; display:flex; flex-direction:column; gap:10px;}
  .card{ background:rgba(13,19,34,.82); border:1px solid #1b2438; border-radius:14px; padding:12px;}
  .card h3{ font-size:12px; color:var(--dim); letter-spacing:2px; margin-bottom:8px; font-weight:600;}
  .prow{ display:flex; align-items:center; gap:8px 5px; padding:6px 8px; border-radius:10px; margin-bottom:6px; transition:.25s; border:1px solid transparent;}
  .prow.active{ background:rgba(255,255,255,.055); border-color:#263250;}
  .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 14px; box-shadow:0 0 8px 1px currentColor; background:currentColor;}
  .pname{ font-size:13px; font-weight:600; flex:1; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .tagyou{ font-size:10px; color:#0a0f1a; background:#cfe0ff; border-radius:6px; padding:1px 5px; font-weight:700; margin-right:3px;}
  .wnum{ font-size:11px; font-weight:700; color:currentColor; white-space:nowrap;}
  .itm{ font-size:13px; }
  .islot{ display:inline-block; min-width:20px; text-align:center; border-radius:6px; padding:1px 2px; margin-left:2px; border:1px solid transparent;}
  .islot.mine{ cursor:pointer; border-color:#2c3a63;}
  .islot.mine:hover{ background:#1c2949;}
  .islot.on{ background:#263250; border-color:#4a5f97; box-shadow:0 0 6px rgba(80,120,220,.5);}
  .skl{ font-size:13px; }
  .steps{ font-size:11px; color:var(--dim); flex:0 0 auto; text-align:right; white-space:nowrap;}
  button{
    background:#16203a; color:var(--text); border:1px solid #263252; border-radius:10px;
    padding:9px 10px; font-size:13px; cursor:pointer; font-family:inherit; transition:.15s;
  }
  button:hover{ background:#1c2949; border-color:#33447a;}
  button.primary{ background:linear-gradient(135deg,#1a56c9,#3f8cff); border-color:#4f8dff; font-weight:700;}
  button.primary:hover{ filter:brightness(1.12);}
  .btnrow{ display:flex; gap:8px; }
  .btnrow button{ flex:1; }
  select{
    width:100%; background:#16203a; color:var(--text); border:1px solid #263252;
    border-radius:10px; padding:9px 8px; font-size:13px; font-family:inherit; outline:none;
  }
  select:disabled, button:disabled{ opacity:.45; cursor:not-allowed; }
  input{
    width:100%; background:#16203a; color:var(--text); border:1px solid #263252;
    border-radius:10px; padding:9px 10px; font-size:14px; font-family:inherit; outline:none;
  }
  input:focus, select:focus{ border-color:#3f6fd8; }
  .netcode{ font-size:24px; text-align:center; letter-spacing:8px; font-weight:800; color:#fdca00; margin:2px 0 8px;}
  .nrow{ display:flex; align-items:center; gap:8px; padding:3px 6px; font-size:13px;}
  .ndim{ color:var(--dim); font-size:12px; line-height:1.6;}
  #hint{ font-size:12px; color:var(--dim); line-height:1.75;}
  #hint b{ color:var(--text);}
  #overlay{
    position:fixed; inset:0; background:rgba(4,7,14,.72); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #overlay.show{ display:flex;}
  .panel{
    background:linear-gradient(160deg,#121a2e,#0c1220); border:1px solid #27345a;
    border-radius:20px; padding:26px 32px; text-align:center; max-width:430px; width:92%;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .panel h2{ font-size:26px; margin-bottom:6px;}
  .panel .sub{ color:var(--dim); font-size:13px; margin-bottom:16px;}
  #rules{ text-align:left; font-size:13px; line-height:1.9; color:#c6d3ea; margin:4px 0 16px;}
  #rules b{ color:var(--gold, #fdca00);}
  .legend{ display:flex; gap:14px; justify-content:center; margin:8px 0 16px; font-size:12px; color:var(--dim); flex-wrap:wrap;}
  .legend span{ display:flex; align-items:center; gap:5px;}
  .legend i{ width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}
  #draft{
    position:fixed; inset:0; background:rgba(4,7,14,.82); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:60;
  }
  #draft.show{ display:flex;}
  .skrow{ display:flex; gap:12px; margin-top:14px; }
  .skcard{
    flex:1; min-width:110px; background:#0e1628; border:1px solid #27345a; border-radius:14px;
    padding:18px 10px; cursor:pointer; transition:.15s;
  }
  .skcard:hover{ border-color:#fdca00; transform:translateY(-4px); background:#14203a; }
  .skcard .ico{ font-size:30px; }
  .skcard .nm{ font-size:14px; font-weight:700; margin:8px 0 6px; color:#eaf0fb; }
  .skcard .ds{ font-size:11px; color:var(--dim); line-height:1.6; }
  @media (max-width:820px){
    #wrap{ flex-direction:column; align-items:center;}
    #side{ width:100%; max-width:520px; flex:none; flex-direction:row; flex-wrap:wrap;}
    #side .card{ flex:1 1 45%;}
  }
</style>

<body>
<header>
  <h1>4位玩家，1位赢家，0个朋友</h1>
  <div class="tag">四 人 抢 座 · 墙 棋 大 逃 杀</div>
</header>

<div id="wrap">
  <div id="boardBox"><canvas id="cv"></canvas></div>
  <div id="side">
    <div class="card">
      <h3>玩家</h3>
      <div id="plist"></div>
    </div>
    <div class="card" id="netCard" style="display:none"></div>
    <div class="card">
      <h3>模式</h3>
      <select id="modeSel">
        <option value="pve">经典 · 我打 3 个 AI</option>
        <option value="hotseat">经典 · 4 人同屏热座</option>
        <option value="sync">同步 · 实时乱斗（我 + 3 AI）</option>
        <option value="syncspec">同步 · 4 AI 实时互坑（观战）</option>
        <option value="spectate">观战 · 4 个 AI 互坑</option>
        <option value="online">🌐 在线 · 好友联机</option>
      </select>
      <div style="height:8px"></div>
      <select id="sizeSel">
        <option value="9">地图 9×9 · 紧凑</option>
        <option value="11" selected>地图 11×11 · 标准</option>
        <option value="13">地图 13×13 · 大</option>
        <option value="15">地图 15×15 · 超大</option>
      </select>
      <div style="height:8px"></div>
      <select id="wallSel">
        <option value="5">每人 5 堵墙</option>
        <option value="8" selected>每人 8 堵墙</option>
        <option value="12">每人 12 堵墙</option>
        <option value="16">每人 16 堵墙</option>
        <option value="20">每人 20 堵墙</option>
      </select>
      <div style="height:8px"></div>
      <select id="itemSel">
        <option value="0" selected>道具：关闭</option>
        <option value="3">道具：每 3 秒刷新</option>
        <option value="5">道具：每 5 秒刷新</option>
        <option value="7">道具：每 7 秒刷新</option>
        <option value="10">道具：每 10 秒刷新</option>
      </select>
      <div style="height:8px"></div>
      <select id="skillSel">
        <option value="1" selected>技能：开局 3 选 1</option>
        <option value="0">技能：关闭</option>
      </select>
      <div style="height:10px"></div>
      <div class="btnrow">
        <button class="primary" id="btnNew">开新一局</button>
        <button id="btnRules">规则</button>
      </div>
      <div style="height:8px"></div>
      <div class="btnrow">
        <button id="btnMute">🔊 音效</button>
        <button id="btnSpeed" title="AI 行棋速度">⚡ 正常</button>
      </div>
    </div>
    <div class="card" id="hint">
      <b>每回合二选一</b><br>
      ① 点击相邻格子 = 走一步（可跳过贴脸的棋子）<br>
      ② 点击格线缝隙 = 放一堵墙（占2格，永久，自己颜色）<br>
      <b>获胜</b>：第一个踏上中央 👑 王座。<br>
      墙不能穿过、不能重叠，也不许把任何人<b>彻底堵死</b>。
    </div>
  </div>
</div>

<div id="overlay"><div class="panel" id="ovPanel"></div></div>
<div id="draft"><div class="panel" id="dPanel"></div></div>

<script>
"use strict";
/* ================= 常量 ================= */
let N = 11;
const THRONE = {x:5, y:5};
const COLORS = {
  blue:  {main:'#0f9ceb', name:'蓝方', rgb:[15,156,235]},
  green: {main:'#17d76c', name:'绿方', rgb:[23,215,108]},
  red:   {main:'#e02955', name:'红方', rgb:[224,41,85]},
  orange:{main:'#f5a307', name:'橙方', rgb:[245,163,7]},
};
const SPAWN = {blue:{x:5,y:0}, green:{x:0,y:5}, red:{x:10,y:5}, orange:{x:5,y:10}};
function setBoardSize(n){          // 四家出生点到王座始终等距
  N = n; const c = (N-1)/2;
  THRONE.x = THRONE.y = c;
  SPAWN.blue = {x:c,y:0}; SPAWN.green = {x:0,y:c}; SPAWN.red = {x:N-1,y:c}; SPAWN.orange = {x:c,y:N-1};
}
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
/* ---- 技能池（开局每人随机抽 3 选 1，整局限用 1 次） ---- */
const SKILLS = [
  {id:'breakwall', icon:'💥', name:'墙面爆破', target:'wall', desc:'击碎棋盘上任意一堵墙'},
  {id:'phase',     icon:'👻', name:'穿墙',     target:'wall', desc:'穿过身边一堵墙，落到墙另一侧的空格'},
  {id:'steal',     icon:'🪓', name:'盗取道具', target:'pawn', desc:'夺取一名对手道具箱里的 1 个道具'},
  {id:'swap',      icon:'🔄', name:'换位',     target:'pawn', desc:'与指定角色互换位置'},
  {id:'swapcolor', icon:'🎨', name:'换色',     target:'pawn', desc:'与指定角色互换颜色（棋子与墙）'},
  {id:'freeze',    icon:'❄️', name:'定身术',   target:'pawn', desc:'指定角色 1 回合不可操作（同步模式冻结 3 秒）'},
  {id:'jump',      icon:'🎲', name:'随机跳跃', target:null,   desc:'随机传送到任意空格（不会落到王座附近）'},
  {id:'thronemove',icon:'👑', name:'王座随机换位', target:null, desc:'王座随机迁移到棋盘上另一处'},
  {id:'shuffle',   icon:'🌀', name:'指定角色随机换位', target:'pawn', desc:'把指定角色随机传送到任意空格'},
  {id:'sprint',    icon:'🏃', name:'疾跑',     target:null,   desc:'本回合可行动 2 次（同步模式 +2 操作点）'},
];
const INV_CAP = 2;   // 道具箱容量

/* ================= 状态 ================= */
let wallsH = new Set();   // "x,y"：横墙，挡住 (x,y-1)/(x,y) 与 (x+1,y-1)/(x+1,y) 的竖向通行
let wallsV = new Set();   // "x,y"：竖墙，挡住 (x-1,y)/(x,y) 与 (x-1,y+1)/(x,y+1) 的横向通行
let wallOwner = {};       // "h x,y" / "v x,y" -> color
let players = [];
let turnIdx = 0, winner = null, busy = false, turnCount = 0, passStreak = 0;
let mode = 'pve', wallStock = 8, muted = false, fastAI = false;
let itemsOn = false, itemInterval = 5, itemClock = 0;   // 道具系统：定时发到玩家道具箱
let skillsOn = true;                            // 技能系统开关
let pendingSkill = null, pendingItem = null;    // 目标选择中：待确认的技能/道具
let draftTimer = 0, netSkillPicked = false;     // 联机选技：30s 代选定时器 / 本端已提交标记
let draft = null;                               // 开局选技 {offers:{color:[3个id]}, picked:{color:id}}
let confetti = [], fx = [], toastMsg = null;
let aiTimer = null;
const SYNC_CD = 500;      // 同步模式：动作间隔（毫秒）
const SYNC_APMAX = 3;     // 同步模式：操作点上限
function isSyncMode(){ return mode==='sync' || mode==='syncspec' || mode==='onsync'; }
function isOnline(){ return mode==='online' || mode==='onsync'; }
function hostSim(){       // 在线模式下只有房主跑游戏逻辑（AI、道具、规则判定）
  return !isOnline() || (net.isHost && net.phase==='playing');
}

/* ---- 在线对战全局 ---- */
let myColor = null;                       // 我坐的颜色（blue/green/red/orange）
let netWatch = false;                     // 观战局：4 个座位全由 AI 打，全员围观
let netPending = [], netFlushQueued = false;
const net = { ws:null, phase:'idle', code:null, seat:null, isHost:false, roster:[], leaving:false, lastErr:null };

/* ================= 种子随机（可复现） ================= */
let RNGSEED = 1;
function srand(s){ RNGSEED = (s>>>0)||1; }
function rnd(){ RNGSEED = (RNGSEED*1103515245 + 12345) & 0x7fffffff; return RNGSEED/0x7fffffff; }
const Q = new URLSearchParams(location.search);
if (Q.get('mode')) mode = Q.get('mode');
const qw = +Q.get('walls');
if (Q.get('walls') && qw>=1) wallStock = Math.min(20, qw);
if (Q.get('size')){ const n=+Q.get('size'); if([9,11,13,15].includes(n)) setBoardSize(n); }
if (Q.get('item')){ const v=+Q.get('item'); if([3,5,7,10].includes(v)){ itemsOn=true; itemInterval=v; } }
if (Q.get('skill')==='0') skillsOn = false;
if (Q.get('fast') === '1') fastAI = true;
srand(Q.get('seed') ? +Q.get('seed') : ((Date.now()*2654435761)>>>0));

/* ================= 音效（WebAudio 合成） ================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, gain, slide){
  if (muted) return; const c = ac(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), c.currentTime+dur);
    g.gain.setValueAtTime(gain||.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+.03);
  }catch(e){}
}
const sMove=()=>beep(320,.07,'triangle',.09,-90);
const sJump=()=>beep(420,.1,'triangle',.1,180);
const sWall=()=>{ beep(130,.14,'square',.09,-50); beep(85,.2,'sine',.12,-30); };
const sBad =()=>beep(150,.12,'sawtooth',.06,-70);
const sSmash=()=>{ beep(200,.08,'square',.1,-120); beep(70,.25,'sine',.16,-30); };
const sPick=()=>{ beep(660,.08,'sine',.1); setTimeout(()=>beep(990,.1,'sine',.1),70); };
const sWin =()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.15),i*130));

/* ================= 规则核心 ================= */
const K=(x,y)=>x+','+y;
const inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;

function blocked(x1,y1,x2,y2){
  if (x2===x1+1) return wallsV.has(K(x2,y1)) || wallsV.has(K(x2,y1-1));
  if (x2===x1-1) return wallsV.has(K(x1,y1)) || wallsV.has(K(x1,y1-1));
  if (y2===y1+1) return wallsH.has(K(x1,y2)) || wallsH.has(K(x1-1,y2));
  if (y2===y1-1) return wallsH.has(K(x1,y1)) || wallsH.has(K(x1-1,y1));
  return true;
}
function pawnAt(x,y){ return players.find(p=>!p.left && p.cell.x===x && p.cell.y===y); }
function cur(){ return players[turnIdx]; }

function bfsFromThrone(wH, wV){
  const reach = new Uint8Array(N*N), dist = new Int16Array(N*N).fill(-1);
  const q=[[THRONE.x,THRONE.y]]; const si=THRONE.y*N+THRONE.x;
  reach[si]=1; dist[si]=0;
  for(let h=0;h<q.length;h++){
    const [x,y]=q[h], d=dist[y*N+x];
    for(const[dx,dy]of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inB(nx,ny)) continue;
      if (dx===1)  { if (wV.has(K(nx,y))||wV.has(K(nx,y-1))) continue; }
      else if(dx===-1){ if (wV.has(K(x,y))||wV.has(K(x,y-1))) continue; }
      else if(dy===1) { if (wH.has(K(x,ny))||wH.has(K(x-1,ny))) continue; }
      else            { if (wH.has(K(x,y))||wH.has(K(x-1,y))) continue; }
      const i=ny*N+nx;
      if(!reach[i]){ reach[i]=1; dist[i]=d+1; q.push([nx,ny]); }
    }
  }
  return {reach, dist};
}
function everyoneHasPath(wH, wV){
  const {reach} = bfsFromThrone(wH, wV);
  return players.every(p=>p.left || reach[p.cell.y*N+p.cell.x]);
}
function allDists(wH, wV){
  const {dist} = bfsFromThrone(wH||wallsH, wV||wallsV);
  const m={}; for(const p of players) if(!p.left) m[p.color]=dist[p.cell.y*N+p.cell.x];
  return m;
}

function legalMoves(p){
  const res=[]; const {x,y}=p.cell;
  for(const[dx,dy]of DIRS){
    const nx=x+dx, ny=y+dy;
    if(!inB(nx,ny)||blocked(x,y,nx,ny)) continue;
    const occ = pawnAt(nx,ny);
    if(!occ) res.push({x:nx,y:ny});
    else{
      const jx=nx+dx, jy=ny+dy;   // 直线跳过贴脸棋子
      if(inB(jx,jy)&&!blocked(nx,ny,jx,jy)&&!pawnAt(jx,jy)) res.push({x:jx,y:jy});
    }
  }
  return res;
}

function wallBoundsOK(kind,x,y){
  return kind==='h' ? (x>=0&&x<=N-2&&y>=1&&y<=N-1)
                    : (x>=1&&x<=N-1&&y>=0&&y<=N-2);
}
function wallClash(kind,x,y){
  if(kind==='h'){
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y&&Math.abs(a-x)<2) return true; }
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x+1&&b===y-1) return true; }
  }else{
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x&&Math.abs(b-y)<2) return true; }
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y+1&&a===x-1) return true; }
  }
  return false;
}
function wallOK(kind,x,y){
  if(!wallBoundsOK(kind,x,y)) return false;
  if(wallClash(kind,x,y)) return false;
  const sH = kind==='h' ? new Set(wallsH) : wallsH;
  const sV = kind==='v' ? new Set(wallsV) : wallsV;
  if(kind==='h') sH.add(K(x,y)); else sV.add(K(x,y));
  return everyoneHasPath(sH, sV);
}
function allWallSpots(){
  const out=[];
  for(let y=1;y<N;y++) for(let x=0;x<N-1;x++) if(wallOK('h',x,y)) out.push(['h',x,y]);
  for(let y=0;y<N-1;y++) for(let x=1;x<N;x++) if(wallOK('v',x,y)) out.push(['v',x,y]);
  return out;
}
function hasAnyAction(p){
  if (legalMoves(p).length) return true;
  return p.walls>0 && allWallSpots().length>0;
}

/* ================= 开局 ================= */
function newGame(){
  clearTimeout(aiTimer);
  wallsH.clear(); wallsV.clear(); wallOwner = {};
  players = ['blue','green','red','orange'].map(c=>{
    const human = (mode==='hotseat') || ((mode==='pve'||mode==='sync') && c==='blue');
    return {
      color:c, cell:{...SPAWN[c]},
      walls:wallStock, left:false,
      ai:(mode==='spectate') || (mode!=='hotseat' && !human),
      human,
      tween:null, ap:SYNC_APMAX, lastAct:0, nextThink:0, bank:false, burstLeft:0,
      inv:[],                                     // 道具箱：'wall' 🧱 / 'hammer' 🔨
      skill:null, skillUsed:false, skillOffer:[], // 本局技能 / 是否已用 / 开局 3 选 1 候选
      frozenTurns:0, frozenUntil:0, extraActs:0, paint:null,
    };
  });
  turnIdx = Math.floor(rnd()*4);
  winner = null; busy = false; turnCount = 0; passStreak = 0;
  itemClock = 0;
  confetti = []; fx = []; toastMsg = null; pendingWall = null;
  document.getElementById('overlay').classList.remove('show');
  layout();
  buildPanel(); renderPanel(); syncSelects();
  refreshHint();
  if (skillsOn) startDraft();
  else if (!isSyncMode()){ autoPassIfNeeded(); scheduleAI(); }
}

/* ---- 开局选技（每人从 10 个技能随机抽 3 选 1；AI 自动；全选完才开局） ---- */
function startDraft(){
  draft = {offers:{}, picked:{}, queue:[]};
  for(const p of players){
    const pool=[...SKILLS];
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    p.skill=null; p.skillUsed=false;
    p.skillOffer = pool.slice(0,3).map(s=>s.id);
    draft.offers[p.color]=[...p.skillOffer];
    if (p.ai) pickSkill(p, aiPickSkill(p.skillOffer), true);   // AI 按强度选
  }
  draft.queue = players.filter(p=>!p.ai).map(p=>p.color);
  if (!draft.queue.length){ draftDone(); return; }
  showDraft();
}
function pickSkill(p, id, silent){
  if (!p || p.skill || !p.skillOffer.includes(id)) return;
  p.skill=id; p.skillOffer=[];
  if (draft) draft.picked[p.color]=id;
  renderPanel();
  if (!silent) sPick();
}
function showDraft(color){
  const c = color || draft.queue[0];             // 本地热座按队列；联机直接指定颜色
  const p = players.find(q=>q.color===c); if (!p){ draftDone(); return; }
  const d=document.getElementById('dPanel');
  d.innerHTML = `<h2><span style="color:${COLORS[p.color].main}">●</span> ${COLORS[p.color].name}：选择本局技能</h2>
    <div class="sub">免费即时 · 整局限用 1 次 · 全员选完自动开局</div>
    <div class="skrow">`+
    draft.offers[p.color].map(id=>{
      const s=SKILLS.find(x=>x.id===id);
      return `<div class="skcard" data-id="${id}"><div class="ico">${s.icon}</div><div class="nm">${s.name}</div><div class="ds">${s.desc}</div></div>`;
    }).join('')+`</div>`;
  document.getElementById('draft').classList.add('show');
  for(const el of d.querySelectorAll('.skcard'))
    el.onclick=()=>onDraftPick(c, el.dataset.id);
}
function draftNext(){
  draft.queue = draft.queue.filter(c=>!draft.picked[c]);
  if (draft.queue.length){ showDraft(); return; }
  document.getElementById('draft').classList.remove('show');
  draftDone();
}
function draftDone(){
  draft = null;
  if (!isSyncMode()){ autoPassIfNeeded(); scheduleAI(); }
}
/* ---- 联机选技：房主权威，各端并行选，30 秒未选按 AI 强度代选 ---- */
function startDraftOnline(){
  clearTimeout(draftTimer);
  draft = {offers:{}, picked:{}, queue:[]};
  for(const p of players){
    const pool=[...SKILLS];
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    p.skill=null; p.skillUsed=false;
    p.skillOffer = pool.slice(0,3).map(s=>s.id);
    draft.offers[p.color]=[...p.skillOffer];
    if (p.ai) pickSkill(p, aiPickSkill(p.skillOffer), true);
  }
  netSkillPicked=false;
  const me = players.find(p=>p.color===myColor && !p.ai && !p.left);
  if (me && !draft.picked[me.color]) showDraft(me.color);   // 房主真人：弹自己的 3 选 1
  else checkNetDraftDone();
  draftTimer = setTimeout(draftTimeout, 30000);
}
function onDraftPick(color, id){
  const p = players.find(q=>q.color===color); if (!p || !draft) return;
  if (!isOnline()){ pickSkill(p, id); draftNext(); return; }   // 本地热座：按队列逐个选
  document.getElementById('draft').classList.remove('show');
  if (net.isHost){ pickSkill(p, id); netEv({type:'skill'}); netFlush(); checkNetDraftDone(); }
  else { netSend({t:'act', a:{type:'skillpick', id}}); netSkillPicked=true; }   // 远端：提交房主，等快照
}
function checkNetDraftDone(){
  if (!draft) return;
  if (players.some(p=>!p.ai && !p.left && !draft.picked[p.color])) return;
  clearTimeout(draftTimer);
  document.getElementById('draft').classList.remove('show');
  draftDone();
  netFlush();                                    // 广播 draft:null，全员开局
}
function draftTimeout(){
  if (!draft) return;
  for(const p of players){
    if (!p.ai && !p.left && !draft.picked[p.color])
      pickSkill(p, aiPickSkill(draft.offers[p.color]||[]), true);
  }
  netEv({type:'skill'}); netFlush();
  checkNetDraftDone();
}
function refreshNetDraft(){                      // 远端收到快照：同步选技遮罩
  const ov=document.getElementById('draft'); if (!ov) return;
  if (!isOnline() || net.isHost || netWatch || !myColor) return;   // 本地/房主：遮罩自己管
  const me = players.find(p=>p.color===myColor && !p.ai && !p.left);
  if (draft && me && !draft.picked[myColor] && !netSkillPicked && draft.offers[myColor])
    showDraft(myColor);
  else
    ov.classList.remove('show');
}

/* ================= 行动执行 ================= */
function spendAP(p){ p.ap = Math.max(0, p.ap-1); p.lastAct = performance.now(); }
function doMove(p, cell){
  const jump = Math.abs(p.cell.x-cell.x)+Math.abs(p.cell.y-cell.y) > 1;
  p.tween = {fx:p.cell.x, fy:p.cell.y, t0:performance.now()};
  p.cell = {x:cell.x, y:cell.y};
  passStreak = 0; turnCount++;
  netEv({type:'move', color:p.color, jump});
  jump ? sJump() : sMove();
  if (cell.x===THRONE.x && cell.y===THRONE.y){ endGame(p); return; }
  if (isSyncMode()){ spendAP(p); renderPanel(); return; }
  if (p.extraActs>0){ p.extraActs--; toast('💨 疾跑：可再行动一次'); renderPanel(); scheduleAI(); return; }
  nextTurn();
}
function execSmashWall(p, kind, x, y){   // 免费即时：击碎一堵墙（🔨 道具与 💥 墙面爆破共用）
  (kind==='h'?wallsH:wallsV).delete(K(x,y));
  delete wallOwner[kind+' '+K(x,y)];
  sSmash();
  netEv({type:'smash', color:p.color, kind, x, y});
  fx.push({type:'smash', kind, x, y, t0:performance.now()});
  renderPanel();
}
function useHammer(p, kind, x, y){       // 消耗道具箱里的 🔨 并击碎一堵墙
  const i = p.inv.indexOf('hammer');
  if (i<0) return false;
  p.inv.splice(i,1);
  execSmashWall(p, kind, x, y);
  return true;
}

/* ---- 技能执行（免费即时：不耗回合/操作点、不结束回合；整局每人限 1 次） ---- */
const paintOf = c => { const q=players.find(x=>x.color===c); return (q && q.paint) || c; };
const cheb = (x,y,c) => Math.max(Math.abs(x-c.x), Math.abs(y-c.y));

function randCell(filter){                     // 随机空格（不在王座上，可附加过滤条件）
  const cands=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if (!pawnAt(x,y) && !(x===THRONE.x&&y===THRONE.y) && (!filter||filter(x,y))) cands.push({x,y});
  return cands.length? cands[Math.floor(rnd()*cands.length)] : null;
}
function throneMovable(x,y){                   // 王座迁到 (x,y) 是否人人仍有路（临时换座验证）
  const ox=THRONE.x, oy=THRONE.y;
  THRONE.x=x; THRONE.y=y;
  const ok = everyoneHasPath(wallsH, wallsV);
  THRONE.x=ox; THRONE.y=oy;
  return ok;
}
function teleport(pawn, cell){                 // 传送并带动 90ms 滑动动画
  pawn.tween = {fx:pawn.cell.x, fy:pawn.cell.y, t0:performance.now()};
  pawn.cell = {x:cell.x, y:cell.y};
}

function execSkill(p, id, t){                  // t：{kind,x,y}=墙 / {dx,dy}=穿墙方向 / {color}=角色 / null
  const sk = SKILLS.find(s=>s.id===id);
  if (!sk || p.skill!==id || p.skillUsed) return false;
  let done = false;
  switch(id){
    case 'breakwall': {                        // 💥 击碎任意一堵墙（复用锤子逻辑）
      const set = t.kind==='h'?wallsH:wallsV;
      if (!set.has(K(t.x,t.y))) return false;
      execSmashWall(p, t.kind, t.x, t.y);
      done = true; break; }
    case 'phase': {                            // 👻 穿过身边一堵墙，落到另一侧空格
      const nx=p.cell.x+t.dx, ny=p.cell.y+t.dy;
      if (!inB(nx,ny) || pawnAt(nx,ny) || !blocked(p.cell.x,p.cell.y,nx,ny)) return false;
      teleport(p, {x:nx,y:ny}); sJump();
      netEv({type:'skill', fx:'jump'}); done = true;
      if (p.cell.x===THRONE.x && p.cell.y===THRONE.y){   // 穿墙直达王座：直接获胜
        p.skillUsed = true; renderPanel(); endGame(p); return true;
      }
      break; }
    case 'steal': {                            // 🪓 夺取目标道具箱里 1 个道具
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p || !v.inv.length) return false;
      p.inv.push(v.inv.pop());
      sPick(); netEv({type:'skill', fx:'pick'});
      toast(COLORS[p.color].name+' 🪓 夺走了 '+COLORS[v.color].name+' 的道具');
      done = true; break; }
    case 'swap': {                             // 🔄 与目标互换位置
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      const a={...p.cell}, b={...v.cell};
      teleport(p, b); teleport(v, a);
      sJump(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'swapcolor': {                        // 🎨 与目标互换显示色（棋子与墙）
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      const da=p.paint||p.color, db=v.paint||v.color;
      p.paint=db; v.paint=da;
      sPick(); netEv({type:'skill', fx:'pick'}); done = true; break; }
    case 'freeze': {                           // ❄️ 定身：经典=下回合跳过 / 同步=3 秒不能动
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (isSyncMode()) v.frozenUntil = performance.now()+3000;
      else v.frozenTurns = 1;
      fx.push({type:'freeze', x:v.cell.x, y:v.cell.y, t0:performance.now()});
      sPick(); netEv({type:'skill', fx:'pick'}); done = true; break; }
    case 'jump': {                             // 🎲 随机跳跃（落点距王座 ≥4 格）
      const c = randCell((x,y)=>cheb(x,y,THRONE)>=4);
      if (!c) return false;
      teleport(p, c); sJump(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'thronemove': {                       // 👑 王座随机迁移（离所有棋子 ≥2 格且人人可达）
      const c = randCell((x,y)=>players.every(q=>q.left||cheb(x,y,q.cell)>=2) && throneMovable(x,y));
      if (!c) return false;
      THRONE.x=c.x; THRONE.y=c.y;
      fx.push({type:'throne', x:c.x, y:c.y, t0:performance.now()});
      sWall(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'shuffle': {                          // 🌀 把目标随机传送到任意空格
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      const c = randCell();
      if (!c) return false;
      teleport(v, c); sJump(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'sprint': {                           // 🏃 疾跑：经典=本回合多 1 次行动 / 同步=+2 操作点
      if (isSyncMode()) p.ap = Math.min(SYNC_APMAX, p.ap+2);
      else p.extraActs += 1;
      sPick(); netEv({type:'skill', fx:'pick'}); done = true; break; }
  }
  if (!done) return false;
  p.skillUsed = true;
  renderPanel();
  return true;
}
function doWall(p, kind, x, y){
  (kind==='h'?wallsH:wallsV).add(K(x,y));
  wallOwner[kind+' '+K(x,y)] = p.color;
  p.walls--;
  passStreak = 0; turnCount++;
  sWall();
  netEv({type:'wall', color:p.color, kind, x, y});
  fx.push({type:'wallpop', kind, x, y, t0:performance.now()});
  if (isSyncMode()){ spendAP(p); renderPanel(); return; }
  if (p.extraActs>0){ p.extraActs--; toast('💨 疾跑：可再行动一次'); renderPanel(); scheduleAI(); return; }
  nextTurn();
}
function nextTurn(){
  if (winner) return;
  cur().extraActs=0;                       // 疾跑加行动只在当回合有效（防 pass 残留）
  turnIdx = (turnIdx+1)%players.length;
  let guard = players.length*2;            // 防多人同时被定身导致死循环
  while (guard-- > 0 && !winner){
    const f = cur();
    if (f.frozenTurns>0 && !f.left){       // ❄️ 定身：跳过该回合
      f.frozenTurns--;
      toast('❄️ '+COLORS[f.color].name+' 被定身，跳过回合');
      netEv({type:'pass', color:f.color});
      passStreak++;
      turnIdx = (turnIdx+1)%players.length;
      continue;
    }
    break;
  }
  renderPanel();
  autoPassIfNeeded();
  scheduleAI();
}
function autoPassIfNeeded(){
  if (winner) return;
  const p = cur();
  if (!hasAnyAction(p)){
    toast(COLORS[p.color].name+' 无路可走，跳过');
    netEv({type:'pass', color:p.color});
    passStreak++;
    if (passStreak >= players.length*2){ endDraw(); return; }
    turnIdx = (turnIdx+1)%players.length;
    renderPanel();
    autoPassIfNeeded();
  }
}
function endDraw(){
  winner = 'draw'; busy = true;
  netEv({type:'draw'});
  const ov=document.getElementById('overlay'), pn=document.getElementById('ovPanel');
  const btns = isOnline()
    ? `<button class="primary" id="btnAgain">${netWatch?'立即下一局':'再来一局'}</button><button id="btnNetExit">离开房间</button>`
    : '<button class="primary" id="btnAgain">再来一局</button>';

    <div class="sub">互相筑墙的代价 —— 平局（0个朋友实锤）</div>
    <div class="btnrow">${btns}</div>
    ${isOnline()&&netWatch?'<div class="ndim" style="margin-top:8px">观战模式 · 5 秒后自动开始下一局</div>':''}`;

function endGame(p){
  winner = p; busy = true;
  netEv({type:'win', color:p.color});
  sWin(); spawnConfetti();

  const ov=document.getElementById('overlay'), pn=document.getElementById('ovPanel');

    <div class="sub">4位玩家 · 1位赢家 · 0个朋友 —— 共 ${turnCount} 手</div>
    <div class="legend">
      ${players.map(q=>`<span style="color:${COLORS[q.color].main}"><i></i>${q.name||COLORS[q.color].name}${q===p?' 👑':''}</span>`).join('')}
    </div>
    <div class="btnrow">${btns}</div>
    ${isOnline()&&netWatch?'<div class="ndim" style="margin-top:8px">观战模式 · 5 秒后自动开始下一局</div>':''}`;
  ov.classList.add('show');
  document.getElementById('btnAgain').onclick = ()=> isOnline()? netStartRound() : newGame();
  const bw=document.getElementById('btnWatch'); if (bw) bw.onclick = ()=>{ mode='spectate'; newGame(); };
  const bx=document.getElementById('btnNetExit'); if (bx) bx.onclick = ()=>netLeave();
  if (mode==='spectate' || mode==='syncspec'){
    setTimeout(()=>{ if(winner===p) newGame(); }, 5000);
  }else if (isOnline() && netWatch && hostSim()){

function toast(t){ toastMsg={text:t, t0:performance.now()}; }

/* ================= AI ================= */
function scheduleAI(){
  if (winner) return;
  const p = cur();
  if (p.ai){
    clearTimeout(aiTimer);
    aiTimer = setTimeout(()=>{ if(!winner && cur()===p && p.ai) aiTurn(); }, fastAI?16:110);
  }
}
function aiTurn(){
  const p = cur();
  if (winner || !p.ai) return;
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  const minOppD = Math.min(...opps.map(q=>dists[q.color]));

  const hammerIdx = p.inv.indexOf('hammer');
  if (hammerIdx>=0){                            // 有锤子：先免费砸一堵对自己最有利的墙
    const sm = bestSmash(p);
    if (sm){ p.inv.splice(hammerIdx,1); execSmashWall(p, sm[0], sm[1], sm[2]); }
  }
  aiUseSkill(p);                                // 技能：免费即时，择机自动放
  if (winner) return;
  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ aiAct(p, 'move', bestToward(p, ms)); return; }
  }
  // 评估放墙
  let bestWall=null, bestScore=1.6 + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>160) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0, rawGain=0;
      for(const q of opps){
        const before=dists[q.color], after=d2[q.color];
        const gain=after-before;
        if(gain>0){ rawGain+=gain; hurt += gain * (1 + Math.max(0,(6-before))*0.35); }
      }
      const selfCost = myD - d2[p.color];
      if (rawGain <= selfCost) continue;   // 拖对手的总量不超过自损：白坑自己，直接否决
      const score = hurt - selfCost*2.2 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (!bestWall && minOppD<=2 && p.walls>0){
    // 紧急封堵：对手逼近王座，找一堵“拖住对手且不坑自己”的墙，评分选优
    const spots=allWallSpots().sort(()=>rnd()-0.5);
    let bestGuard=null, bestGuardScore=0;
    for(const [k,x,y] of spots){
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2=allDists(sH,sV);
      const selfCost = myD - d2[p.color];
      if (selfCost > 1) continue;                    // 紧急时刻也最多容忍自损 1 步
      let hurt=0;
      for(const q of opps){
        const g=d2[q.color]-dists[q.color];
        if(g>0) hurt += g;
      }
      if (hurt <= selfCost) continue;                // 拖对手的量必须 strictly 大于自损
      const s = hurt - selfCost*2;
      if (s > bestGuardScore){ bestGuardScore=s; bestGuard=[k,x,y]; }
    }
    if (bestGuard) bestWall=bestGuard;
  }
  if (bestWall && rnd()>0.06){ aiAct(p,'wall',bestWall); return; }
  const ms=legalMoves(p);
  if (ms.length) aiAct(p,'move',bestToward(p,ms));
  else if (bestWall) aiAct(p,'wall',bestWall);
}
function bestToward(p, ms){
  const {dist}=bfsFromThrone(wallsH,wallsV);
  let best=ms[0], bd=1e9;
  for(const c of ms){ const d=dist[c.y*N+c.x]; if(d>=0&&d<bd){bd=d;best=c;} }
  return best;
}
function aiAct(p, kind, arg){
  busy = true;
  setTimeout(()=>{
    busy = false;
    if (winner) return;
    if (kind==='move') doMove(p, arg);
    else doWall(p, arg[0], arg[1], arg[2]);
  }, fastAI ? 18 : 130 + rnd()*150);
}

/* ---- 同步模式：实时驱动 ---- */
function syncAIDriver(now){
  if (winner || draft) return;
  for(const p of players){
    if (!p.ai) continue;
    if (now < p.frozenUntil) continue;     // ❄️ 同步模式：定身计时内不动
    if (now - p.lastAct < SYNC_CD) continue;
    if (p.ap < 1) continue;
    if (p.bank && p.ap < SYNC_APMAX) continue;   // 攒点中：等回满
    if (p.bank && p.ap >= SYNC_APMAX - 1e-6){    // 攒满 → 解锁连发
      p.bank = false;
      p.burstLeft = 1 + Math.floor(rnd()*3);     // 本次之后还连 1~3 手
    }
    if (now < p.nextThink) continue;
    p.nextThink = now + 60 + rnd()*180;
    const acted = syncAIDecide(p);
    if (!acted || winner) continue;
    if (p.burstLeft > 0){
      p.burstLeft--;                              // 连发中
    }else if (rnd() < 0.5){
      p.bank = true;                              // 转入攒点
    }
  }
}
function syncAIDecide(p){
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ doMove(p, bestToward(p, ms)); return true; }
  }
  const hammerIdx = p.inv.indexOf('hammer');
  if (hammerIdx>=0){                            // 有锤子：免费砸对自己收益最大的墙
    const sm = bestSmash(p);
    if (sm){ p.inv.splice(hammerIdx,1); execSmashWall(p, sm[0], sm[1], sm[2]); return true; }
  }
  if (aiUseSkill(p)) return true;               // 技能：免费即时，择机自动放
  if (winner) return false;
  let bestWall=null, bestScore=1.6 + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>140) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0, rawGain=0;
      for(const q of opps){
        const gain=d2[q.color]-dists[q.color];
        if(gain>0){ rawGain+=gain; hurt += gain * (1 + Math.max(0,(6-dists[q.color]))*0.35); }
      }
      const selfCost = myD - d2[p.color];
      if (rawGain <= selfCost) continue;   // 拖对手的总量不超过自损：白坑自己，直接否决
      const score = hurt - selfCost*2.2 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (bestWall && rnd()>0.10){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  const ms=legalMoves(p);
  if (ms.length){ doMove(p, bestToward(p,ms)); return true; }
  if (bestWall){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  return false;
}

function grantItems(){                  // 每 itemInterval 秒：给每个没满的玩家发 1 个随机道具
  let granted = false;
  for(const p of players){
    if (p.left || p.inv.length>=INV_CAP) continue;
    p.inv.push(rnd()<0.5?'hammer':'wall');
    netEv({type:'grant', color:p.color});
    granted = true;
  }
  if (granted){ sPick(); renderPanel(); }
}
function bestSmash(p){
  let best=null, bestGain=0;
  const myD = bfsFromThrone(wallsH,wallsV).dist[p.cell.y*N+p.cell.x];
  const consider=[];
  wallsH.forEach(function(k){ const[a,b]=k.split(',').map(Number); consider.push(['h',a,b]); });
  wallsV.forEach(function(k){ const[a,b]=k.split(',').map(Number); consider.push(['v',a,b]); });
  for(const [k,x,y] of consider){
    const sH=new Set(wallsH), sV=new Set(wallsV);   // 双向拷贝：评估绝不能污染真实棋局
    sH.delete(K(x,y)); sV.delete(K(x,y));
    const d2 = bfsFromThrone(sH,sV).dist[p.cell.y*N+p.cell.x];
    const gain = myD - d2;
    if (gain>bestGain){ bestGain=gain; best=[k,x,y]; }
  }
  return best;
}
const AI_SKILL_RANK = { phase:9, sprint:8, breakwall:7, swap:6, freeze:6, jump:5, thronemove:5, shuffle:4, steal:3, swapcolor:2 };
function aiPickSkill(offer){               // AI 选技：按强度排序取最高
  return offer.slice().sort((a,b)=>(AI_SKILL_RANK[b]||0)-(AI_SKILL_RANK[a]||0))[0];
}
function aiUseSkill(p){                    // AI 用技启发式（免费即时，整局一次，择机自动放）
  if (!skillsOn || !p.skill || p.skillUsed) return false;
  const dists=allDists();
  const myD=dists[p.color];
  const opps=players.filter(q=>q!==p&&!q.left);
  if (myD<0 || !opps.length) return false;
  const lead=opps.slice().sort((a,b)=>dists[a.color]-dists[b.color])[0];
  const use=t=>execSkill(p, p.skill, t);
  switch(p.skill){
    case 'breakwall': { const sm=bestSmash(p); return sm? use({kind:sm[0],x:sm[1],y:sm[2]}) : false; }
    case 'phase': {
      const dist=bfsFromThrone(wallsH,wallsV).dist;
      for(const[dx,dy]of DIRS){                       // 穿墙直达王座 → 直接赢
        const nx=p.cell.x+dx, ny=p.cell.y+dy;
        if (nx===THRONE.x && ny===THRONE.y && blocked(p.cell.x,p.cell.y,nx,ny)) return use({dx,dy});
      }
      let best=null, gain=1;                          // 否则：穿墙缩短≥2 才用
      for(const[dx,dy]of DIRS){
        const nx=p.cell.x+dx, ny=p.cell.y+dy;
        if(!inB(nx,ny)||pawnAt(nx,ny)||!blocked(p.cell.x,p.cell.y,nx,ny)) continue;
        const g=dist[p.cell.y*N+p.cell.x]-dist[ny*N+nx];
        if(g>gain){gain=g;best={dx,dy};}
      }
      return best? use(best):false;
    }
    case 'steal': { const v=opps.find(q=>q.inv.length); return v? use({color:v.color}):false; }
    case 'swap': { return (myD-dists[lead.color]>=3)? use({color:lead.color}):false; }
    case 'swapcolor': { return (dists[lead.color]+2<=myD)? use({color:lead.color}):false; }   // 落后时捣乱
    case 'freeze': { return (dists[lead.color]<=3 && myD>dists[lead.color])? use({color:lead.color}):false; }
    case 'jump': { return myD>=7? use(null):false; }                  // 落点随机：远时赌一把
    case 'thronemove': { return (myD>=6 && myD-dists[lead.color]>=3)? use(null):false; }
    case 'shuffle': { return (dists[lead.color]<=3 && myD>=dists[lead.color]+2)? use({color:lead.color}):false; }
    case 'sprint': { return myD>=1 && myD<=3? use(null):false; }      // 冲刺期双行动
  }
  return false;
}

/* ================= 人类输入 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});   // 不透明画布：合成更快，杜绝拖影
let CELL = 48, PAD = 16, boardPx = 0, hover = null;
let touchMode = matchMedia('(pointer: coarse)').matches;  // 触屏设备：放墙需两次点击确认
let pendingWall = null;                                   // 已预览待确认的墙位 ['h'|'v', x, y]
let wallHintShown = false;
window.addEventListener('touchstart', ()=>{ touchMode = true; }, { once:true, passive:true });

function px(v){ return PAD + v*CELL; }

cv.addEventListener('mousemove', e=>{

    if (!t){ toast('已取消'); return; }
    const intent={type:'skilluse', id:sk.id, t};
    if (isOnline()){
      if (hostSim()) hostApplyAction(pa, intent);
      else { busy=true; setTimeout(()=>{ busy=false; }, 2500); netSend({t:'act', a:intent}); }
    }else if (!execSkill(pa, sk.id, t)) toast('目标无效');
    return;
  }
  let p;
  if (isOnline()){
    p = players.find(q=>q.color===myColor);

    }else if (cur()!==p){ toast('还没轮到你'); sBad(); return; }
  }else if (isSyncMode()){
    if (!players[0].human) return;         // 纯观战变体：无人类操作
    p = players[0];
    const now = performance.now();
    if (now - p.lastAct < SYNC_CD){ toast('太快了！动作间隔 0.5 秒'); sBad(); return; }
    if (p.ap < 1){ toast('操作点不足，等它恢复'); sBad(); return; }
  }else{

  const gx=e.clientX-r.left, gy=e.clientY-r.top;
  const intent = resolveIntent(p, (gx-PAD)/CELL, (gy-PAD)/CELL);
  if (!intent) return;
  // 触屏：放墙需要两次点击——第一次出预览，再点同一位置才确认，点格子则取消预览
  if (touchMode && intent.type === 'wall'){
    if (pendingWall && pendingWall[0]===intent.kind && pendingWall[1]===intent.x && pendingWall[2]===intent.y){
      pendingWall = null;                    // 第二次点击：确认放墙
    }else{
      pendingWall = [intent.kind, intent.x, intent.y];
      if (!wallHintShown){ toast('已预览墙位：再点一次确认放墙，点格子取消'); wallHintShown = true; }
      return;
    }
  }else if (intent.type !== 'wall'){
    pendingWall = null;                      // 走子/砸墙：预览自动取消
  }
  if (isOnline()){
    if (hostSim()) hostApplyAction(p, intent);          // 房主：本地校验后直接执行
    else {                                              // 客户端：发 intent，等房主快照
      busy = true; setTimeout(()=>{ busy=false; }, 2500);
      netSend({t:'act', a:intent});
    }
  }else{
    applyIntent(p, intent);
  }
});
// 免费即时动作（道具/技能）的本地执行者：在线=自己；同步=蓝方人类；经典=当前回合人类
function localFreeActor(){
  if (isOnline()){ const q=players.find(x=>x.color===myColor); return (q && !q.left && !q.ai) ? q : null; }
  if (isSyncMode()) return players[0].human ? players[0] : null;
  return (cur() && cur().human) ? cur() : null;
}
// 把一次点击解析成操作意图（带本地提示），真正的执行统一走 applyIntent
function resolveIntent(p, cx, cy){
  if (draft) return null;                 // 选技阶段不可操作
  if (isSyncMode() && performance.now() < p.frozenUntil){ toast('❄️ 你被定身了'); sBad(); return null; }
  // ① 靠近格线 → 放墙
  const w = snapWall(cx, cy);
  if (w){
    const [k,x,y]=w;
    if (p.walls<=0){ toast('你的墙用完了！'); sBad(); return null; }
    if (!wallOK(k,x,y)){
      toast(wallClash(k,x,y) ? '这里放不了墙' : '不能把人彻底堵死！');
      sBad(); return null;
    }
    return {type:'wall', kind:k, x, y};
  }
  // ② 点格子 → 移动
  const tx=Math.round(cx-0.5), ty=Math.round(cy-0.5);
  if (inB(tx,ty)){
    const ms = legalMoves(p);
    const hit = ms.find(c=>c.x===tx&&c.y===ty);
    if (hit) return {type:'move', x:tx, y:ty};
    if (tx===p.cell.x&&ty===p.cell.y){ toast('点相邻格移动，或点格线缝隙放墙'); return null; }
    toast(ms.length ? '走不到那里' : '你被困住了！');
    sBad();
  }
  return null;
}
function applyIntent(p, a){
  if (a.type==='move') doMove(p, {x:a.x, y:a.y});
  else if (a.type==='wall') doWall(p, a.kind, a.x, a.y);
  else if (a.type==='smash') useHammer(p, a.kind, a.x, a.y);
  else if (a.type==='skilluse') execSkill(p, a.id, a.t);
}
// 房主权威：校验任何来源（含自己）的操作后执行，非法则回执提示
function hostApplyAction(p, a){
  const reject = text => { netEv({type:'reject', to:p.color, text}); netFlush(); };
  if (p.ai || p.left) return;
  if (a.type==='skillpick'){                     // 开局选技：不占用回合、不查冻结/CD
    if (!draft || !draft.offers[p.color] || draft.picked[p.color]) return reject('现在不能选技能');
    if (draft.offers[p.color].indexOf(a.id)<0) return reject('技能不在候选中');
    pickSkill(p, a.id, true);
    netEv({type:'skill'}); netFlush();
    checkNetDraftDone();
    return;
  }
  const freeAct = a.type==='smash' || a.type==='itemuse' || a.type==='skilluse';   // 道具/技能：免费即时
  if (!isSyncMode() && cur()!==p) return reject('还没轮到你');
  if (isSyncMode()){
    const now = performance.now();
    if (now < p.frozenUntil) return reject('❄️ 你被定身了');   // 定身：一切操作（含技能/道具）都禁止
    if (!freeAct){
      if (now - p.lastAct < SYNC_CD) return reject('太快了！动作间隔 0.5 秒');
      if (p.ap < 1) return reject('操作点不足');
    }
  }
  if (a.type==='move'){
    if (!legalMoves(p).some(c=>c.x===a.x&&c.y===a.y)) return reject('走不到那里');
    applyIntent(p, a);
  }else if (a.type==='wall'){
    if (p.walls<=0) return reject('你的墙用完了！');
    if (!wallOK(a.kind,a.x,a.y)) return reject('这里放不了墙');
    applyIntent(p, a);
  }else if (a.type==='smash'){
    if (p.inv.indexOf('hammer')<0) return reject('你没有锤子');
    const set = a.kind==='h'?wallsH:wallsV;
    if (!set.has(K(a.x,a.y))) return reject('那堵墙已经没了');
    useHammer(p, a.kind, a.x, a.y);
  }else if (a.type==='itemuse' && a.kind==='wall'){
    const i = p.inv.indexOf('wall');
    if (i<0) return reject('没有 🧱 道具');
    p.inv.splice(i,1); p.walls++;
    sPick(); renderPanel();
  }else if (a.type==='skilluse'){
    const sk = SKILLS.find(s=>s.id===a.id);
    if (!skillsOn) return reject('本局未开启技能');
    if (!sk || p.skill!==a.id) return reject('技能不符');
    if (p.skillUsed) return reject('技能已用过');
    const t=a.t||{};
    if (sk.id==='breakwall'){
      const set=t.kind==='h'?wallsH:wallsV;
      if (!set.has(K(t.x,t.y))) return reject('那堵墙已经没了');
    }else if (sk.id==='phase'){
      const nx=p.cell.x+t.dx, ny=p.cell.y+t.dy;
      if (!inB(nx,ny)||pawnAt(nx,ny)||!blocked(p.cell.x,p.cell.y,nx,ny)) return reject('那里穿不过去');
    }else if (sk.id==='steal'){
      const v=players.find(q=>q.color===t.color);
      if (!v||v===p||!v.inv.length) return reject('对方没有道具');
    }else if (sk.target==='pawn'){
      const v=players.find(q=>q.color===t.color);
      if (!v||v.left||v===p) return reject('目标无效');
    }
    if (!execSkill(p, a.id, t)) return reject('技能没有合适的目标');
  }
}
// 吸附最近的可放墙位置：光标靠近哪条格线，就沿哪条线放
function snapWall(cx, cy){
  const dV = Math.abs(cx - Math.round(cx));   // 离竖直格线
  const dH = Math.abs(cy - Math.round(cy));   // 离水平格线
  const TH = 0.32;
  if (Math.min(dV,dH) >= TH) return null;
  if (dV <= dH){
    const vx = Math.round(cx);
    const vy = Math.max(0, Math.min(N-2, Math.round(cy-1)));
    return ['v', vx, vy];
  }else{
    const hy = Math.round(cy);
    const hx = Math.max(0, Math.min(N-2, Math.round(cx-1)));
    return ['h', hx, hy];
  }
}
// 光标下的墙（锤子用）
function wallAt(cx, cy){
  let best=null, bd=0.3;
  wallsH.forEach(function(k){
    const[a,b]=k.split(',').map(Number);
    const dx=cx-Math.min(Math.max(cx,a),a+2), dy=cy-b;
    const d=Math.hypot(dx,dy);
    if(d<bd){ bd=d; best=['h',a,b]; }
  });
  wallsV.forEach(function(k){
    const[a,b]=k.split(',').map(Number);
    const dy=cy-Math.min(Math.max(cy,b),b+2), dx=cx-a;
    const d=Math.hypot(dx,dy);
    if(d<bd){ bd=d; best=['v',a,b]; }
  });
  return best;
}

/* ================= 渲染 ================= */
if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function layout(){
  const narrow = window.innerWidth <= 820;
  const maxW = narrow ? window.innerWidth-36 : window.innerWidth-330;
  const maxH = window.innerHeight - 170;
  boardPx = Math.max(300, Math.min(maxW, maxH, N>=13?680:620));
  const dpr = window.devicePixelRatio||1;
  cv.width = Math.round(boardPx*dpr); cv.height = Math.round(boardPx*dpr);
  cv.style.width = boardPx+'px'; cv.style.height = boardPx+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CELL = (boardPx - PAD*2)/N;
}
window.addEventListener('resize', layout);

let lastFrame = performance.now();
function draw(now){
  const dt = Math.min(.05,(now-lastFrame)/1000); lastFrame = now;
  if (isSyncMode() && !winner){
    for(const p of players) p.ap = Math.min(SYNC_APMAX, p.ap + dt);   // 每秒回1点
    if (hostSim()) syncAIDriver(now);
  }
  if (itemsOn && !winner && hostSim()){
    itemClock += dt;
    if (itemClock >= itemInterval){ itemClock = 0; grantItems(); }
  }
  ctx.clearRect(0,0,boardPx,boardPx);

  const g = ctx.createLinearGradient(0,0,boardPx,boardPx);
  g.addColorStop(0,'#0c1322'); g.addColorStop(1,'#0a101d');
  ctx.fillStyle=g; ctx.fillRect(0,0,boardPx,boardPx);   // 满幅铺底（圆角交给 CSS 裁切）

  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    ctx.fillStyle = '#141b2b';
    rr(px(x)+1.5, px(y)+1.5, CELL-3, CELL-3, Math.max(4,CELL*0.14));
    ctx.fill();
  }
  ctx.fillStyle='rgba(120,150,210,.14)';
  for(let y=0;y<=N;y++) for(let x=0;x<=N;x++){
    ctx.beginPath(); ctx.arc(px(x),px(y),1.6,0,7); ctx.fill();
  }

  // 王座
  const pulse = 0.5+0.5*Math.sin(now/500);
  ctx.save();
  ctx.shadowColor='rgba(253,202,0,'+(0.45+0.3*pulse).toFixed(2)+')'; ctx.shadowBlur=18+8*pulse;
  ctx.fillStyle='#fdca00';
  rr(px(THRONE.x)+2.5, px(THRONE.y)+2.5, CELL-5, CELL-5, Math.max(5,CELL*0.16)); ctx.fill();
  ctx.restore();
  ctx.font = Math.floor(CELL*0.46)+'px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👑', px(THRONE.x)+CELL/2, px(THRONE.y)+CELL/2+2);

  // 当前人类玩家合法移动提示
  let cp = null;
  if (!winner){
    if (isSyncMode()) cp = isOnline() ? players.find(q=>q.color===myColor) : (players[0].human?players[0]:null);
    else cp = cur();
  }
  if (cp && cp.human && !busy){
    ctx.fillStyle='rgba(255,255,255,.10)';
    for(const c of legalMoves(cp)){
      ctx.beginPath(); ctx.arc(px(c.x)+CELL/2, px(c.y)+CELL/2, CELL*0.12, 0, 7); ctx.fill();
    }
  }

  // 墙
  const WT = Math.max(5, CELL*0.14);
  ctx.lineCap='round'; ctx.lineWidth=WT;
  for(const key of wallsH){
    const[a,b]=key.split(',').map(Number);
    const col = COLORS[paintOf(wallOwner['h '+key])]?.main || '#7f8db0';
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=7;
    ctx.beginPath(); ctx.moveTo(px(a),px(b)); ctx.lineTo(px(a+2),px(b)); ctx.stroke();
  }
  for(const key of wallsV){
    const[a,b]=key.split(',').map(Number);
    const col = COLORS[paintOf(wallOwner['v '+key])]?.main || '#7f8db0';
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=7;
    ctx.beginPath(); ctx.moveTo(px(a),px(b)); ctx.lineTo(px(a),px(b+2)); ctx.stroke();
  }
  ctx.shadowBlur=0;

  // 触屏待确认墙位：高亮预览（方向 + 两格跨度 + 受影响格子淡光）
  if (pendingWall && cp && cp.human && !busy){
    const [k,x,y] = pendingWall;
    const ok = cp.walls>0 && wallOK(k,x,y);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    const cells = k==='h' ? [[x,y-1],[x+1,y-1],[x,y],[x+1,y]] : [[x-1,y],[x,y-1],[x,y],[x,y+1]];
    for(const [cxx,cyy] of cells) if (inB(cxx,cyy)){
      rr(px(cxx)+1.5, px(cyy)+1.5, CELL-3, CELL-3, Math.max(4,CELL*0.14)); ctx.fill();
    }
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4*Math.sin(now/200);
    ctx.strokeStyle = ok ? COLORS[cp.color].main : '#ff4d4d';
    ctx.lineWidth = WT+3; ctx.lineCap = 'round';
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
    ctx.beginPath();
    if(k==='h'){ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x+2),px(y)); }
    else{ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x),px(y+2)); }
    ctx.stroke(); ctx.restore();
    ctx.font = '600 '+Math.max(11,Math.floor(CELL*0.24))+'px "PingFang SC",sans-serif';
    ctx.fillStyle = ok ? '#dfe7f5' : '#ff8f8f';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(k==='h'){ ctx.fillText(ok?'再点一次确认':'这里放不了', px(x+1), y<=THRONE.y ? px(y)-CELL*0.55 : px(y)+CELL*0.55); }
    else{ ctx.fillText(ok?'再点一次确认':'这里放不了', x<THRONE.x ? px(x)-CELL*0.75 : px(x)+CELL*0.75, px(y+1)); }
  }

  // 技能目标提示：pawn 类技能给全部对手棋子画虚线圈
  if (cp && !winner && pendingSkill){
    const st = SKILLS.find(s=>s.id===pendingSkill);
    if (st && st.target==='pawn'){
      ctx.save();
      ctx.strokeStyle='#fdca00'; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
      for(const q of players){
        if (q===cp || q.left) continue;
        ctx.beginPath();
        ctx.arc(px(q.cell.x)+CELL/2, px(q.cell.y)+CELL/2, CELL*0.46, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 墙 hover 预览（选中 🔨 或 wall 类技能时高亮可作用的墙）
  if (cp && cp.human && !busy && hover && !pendingWall){
    const cx=(hover.gx-PAD)/CELL, cy=(hover.gy-PAD)/CELL;
    const skT = pendingSkill && ((SKILLS.find(s=>s.id===pendingSkill)||{}).target);
    if (pendingItem==='hammer' || skT==='wall'){
      const sm = wallAt(cx,cy);
      if (sm){
        const [k,x,y]=sm;
        ctx.save(); ctx.globalAlpha=.85;
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=WT+2; ctx.lineCap='round';
        ctx.beginPath();
        if(k==='h'){ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x+2),px(y)); }
        else{ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x),px(y+2)); }
        ctx.stroke(); ctx.restore();
      }
    }else{
      const w = snapWall(cx,cy);
      if (w){
        const [k,x,y]=w;
        const ok = cp.walls>0 && wallOK(k,x,y);
        ctx.save(); ctx.globalAlpha=.3;
        ctx.strokeStyle = ok ? COLORS[cp.color].main : '#ff4d4d';
        ctx.lineWidth=WT; ctx.lineCap='round';
        ctx.beginPath();
        if(k==='h'){ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x+2),px(y)); }
        else{ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x),px(y+2)); }
        ctx.stroke(); ctx.restore();
      }
    }
  }

  // 棋子
  for(const p of players){
    let X=px(p.cell.x)+CELL/2, Y=px(p.cell.y)+CELL/2;
    if (p.tween){
      const t=Math.min(1,(now-p.tween.t0)/90);   // 干脆利落的滑动
      const e=1-Math.pow(1-t,2);
      X=px(p.tween.fx+(p.cell.x-p.tween.fx)*e)+CELL/2;
      Y=px(p.tween.fy+(p.cell.y-p.tween.fy)*e)+CELL/2;
      if(t>=1) p.tween=null;
    }
    const isCur = !isSyncMode() && p===cp;
    if (isSyncMode()){
      if (!p.ai){
        const cd = Math.max(0, SYNC_CD-(now-p.lastAct))/SYNC_CD;
        if (cd>0){                       // 冷却进度环
          ctx.strokeStyle='rgba(255,255,255,.30)'; ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(X,Y,CELL*0.46,-Math.PI/2,-Math.PI/2+(1-cd)*Math.PI*2); ctx.stroke();
        }else if (p.ap>=1){              // 可行动：呼吸环
          ctx.strokeStyle='rgba(255,255,255,'+(0.45+0.3*Math.sin(now/220)).toFixed(2)+')';
          ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(X,Y,CELL*0.42+2.5+Math.sin(now/220)*1.2,0,7); ctx.stroke();
        }
      }
    }else if (p===cp){
      ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.35*Math.sin(now/220)).toFixed(2)+')';
      ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(X,Y,CELL*0.42+3+Math.sin(now/220)*1.5,0,7); ctx.stroke();
    }
    const [r,g2,b]=COLORS[paintOf(p.color)].rgb;
    const moving = !!p.tween;                 // 移动中不发光，避免辉光拖影
    ctx.save();
    ctx.shadowColor=`rgba(${r},${g2},${b},.8)`; ctx.shadowBlur = moving ? 0 : (isCur?16:9);
    const rg=ctx.createRadialGradient(X-CELL*0.1,Y-CELL*0.12,1,X,Y,CELL*0.36);
    rg.addColorStop(0,`rgb(${Math.min(255,r+70)},${Math.min(255,g2+70)},${Math.min(255,b+70)})`);
    rg.addColorStop(1,COLORS[paintOf(p.color)].main);
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(X,Y,CELL*0.32,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(X-CELL*0.09,Y-CELL*0.11,CELL*0.08,0,7); ctx.fill();
    if (isSyncMode()? now<p.frozenUntil : p.frozenTurns>0){   // ❄️ 定身指示
      ctx.font=(CELL*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('❄️', X+CELL*0.28, Y-CELL*0.28);
    }
    if (isSyncMode()){                     // 操作点气泡：3格，亮=可用；攒点中变金色
      for(let i=0;i<SYNC_APMAX;i++){
        const f = Math.max(0, Math.min(1, p.ap - i));
        ctx.fillStyle = p.bank
          ? 'rgba(253,202,0,'+(0.25+0.7*f).toFixed(2)+')'
          : 'rgba(255,255,255,'+(0.18+0.72*f).toFixed(2)+')';
        ctx.beginPath(); ctx.arc(X-CELL*0.22+i*CELL*0.22, Y-CELL*0.55, CELL*0.055, 0, 7); ctx.fill();
      }
    }
  }

  // 特效
  fx = fx.filter(f=>now-f.t0 < 500);
  for(const f of fx){
    if (f.type==='wallpop'){
      const t=(now-f.t0)/300, e=1-Math.pow(1-Math.min(1,t),2);
      ctx.save(); ctx.globalAlpha=(1-t)*0.7;
      ctx.strokeStyle='#fff'; ctx.lineWidth=WT+6*e;
      ctx.lineCap='round';
      ctx.beginPath();
      if(f.kind==='h'){ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x+2),px(f.y)); }
      else{ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x),px(f.y+2)); }
      ctx.stroke(); ctx.restore();
    }else if (f.type==='smash'){
      const t=(now-f.t0)/350;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=WT+8*(1-t);
        ctx.lineCap='round';
        ctx.beginPath();
        if(f.kind==='h'){ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x+2),px(f.y)); }
        else{ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x),px(f.y+2)); }
        ctx.stroke(); ctx.restore();
      }
    }else if (f.type==='freeze'){           // ❄️ 定身：冰蓝扩散环
      const t=(now-f.t0)/600;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#7fd8ff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(px(f.x)+CELL/2, px(f.y)+CELL/2, CELL*(0.2+0.5*t), 0, 7); ctx.stroke();
        ctx.font=(CELL*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=1-t; ctx.fillText('❄️', px(f.x)+CELL/2, px(f.y)+CELL/2);
        ctx.restore();
      }
    }else if (f.type==='throne'){           // 👑 王座迁移：金色双环
      const t=(now-f.t0)/700;
      if (t<=1){
        ctx.save(); ctx.globalAlpha=(1-t)*0.9;
        ctx.strokeStyle='#fdca00'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(px(f.x)+CELL/2, px(f.y)+CELL/2, CELL*(0.3+0.7*t), 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(px(f.x)+CELL/2, px(f.y)+CELL/2, CELL*(0.15+0.5*t), 0, 7); ctx.stroke();
        ctx.restore();
      }
    }
  }
  drawConfetti(dt);

  if (toastMsg){
    const t=(now-toastMsg.t0)/1400;
    if(t>1) toastMsg=null;
    else{
      ctx.save(); ctx.globalAlpha=t<0.85?1:(1-t)/0.15;
      ctx.font='600 14px "PingFang SC",sans-serif';
      const wtxt=ctx.measureText(toastMsg.text).width+30;
      rr(boardPx/2-wtxt/2, boardPx-40, wtxt, 28, 14);
      ctx.fillStyle='rgba(10,15,26,.9)'; ctx.fill();
      ctx.strokeStyle='#2a3a63'; ctx.stroke();
      ctx.fillStyle='#dfe7f5'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(toastMsg.text, boardPx/2, boardPx-26);
      ctx.restore();
    }
  }
  requestAnimationFrame(draw);
}
function spawnConfetti(){
  for(let i=0;i<150;i++){
    confetti.push({
      x:Math.random()*boardPx, y:-20-Math.random()*boardPx*0.6,
      vx:(Math.random()-0.5)*60, vy:70+Math.random()*150,
      s:3+Math.random()*5, c:`hsl(${Math.floor(Math.random()*360)},90%,60%)`,
      rot:Math.random()*7, vr:(Math.random()-0.5)*8,
    });
  }
}
function drawConfetti(dt){
  if (winner && winner!=='draw' && confetti.length){
    const dpr = window.devicePixelRatio||1;
    ctx.save();
    for(const c of confetti){
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt;
      if(c.y>boardPx+20){ c.y=-20; c.x=Math.random()*boardPx; }
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
      ctx.fillStyle=c.c; ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s*1.6);
      ctx.restore();
    }
    ctx.restore();
  }
}

function buildPanel(){
  const el=document.getElementById('plist'); el.innerHTML='';
  for(const p of players){
    const row=document.createElement('div');
    row.className='prow'; row.id='prow-'+p.color;
    row.style.color=COLORS[paintOf(p.color)].main;
    row.innerHTML=`
      <span class="dot"></span>
      <span class="pname" style="color:var(--text)">${p.name || COLORS[p.color].name}
        ${(isOnline() ? (!netWatch && p.color===myColor) : (p.human&&(mode==='pve'||mode==='sync')))?'<span class="tagyou">你</span>':''}
        ${p.ai?'<span style="font-size:10px;color:var(--dim)">AI</span>':''}</span>
      <span class="itm"></span>
      <span class="skl"></span>
      <span class="wnum" title="剩余墙数">墙 ×${wallStock}</span>
      <span class="steps"></span>`;
    el.appendChild(row);
  }
}
function renderPanel(){
  const dists = winner? null : allDists();
  for(const p of players){
    const row=document.getElementById('prow-'+p.color); if(!row) continue;
    row.classList.toggle('active', !winner && p===cur());
    const wn=row.querySelector('.wnum');
    if (wn) wn.textContent='墙 ×'+p.walls;
    const itm=row.querySelector('.itm');
    if (itm){
      const mine = p===localFreeActor() && !winner;
      itm.innerHTML = p.inv.map((k,i)=>
        `<span class="islot${mine?' mine':''}${pendingItem==='hammer'&&k==='hammer'?' on':''}" data-i="${i}">${k==='hammer'?'🔨':'🧱'}</span>`).join('');
      if (mine) for(const s of itm.querySelectorAll('.islot'))
        s.onclick = ()=>clickInvSlot(p, +s.dataset.i);
    }
    const skl=row.querySelector('.skl');
    if (skl){
      const mine = p===localFreeActor() && !winner;
      const sk = p.skill? SKILLS.find(s=>s.id===p.skill) : null;
      skl.innerHTML = sk? `<span class="islot${mine&&!p.skillUsed?' mine':''}${pendingSkill===sk.id?' on':''}" title="${sk.name}：${sk.desc}${p.skillUsed?'（已用）':''}">${sk.icon}</span>` : '';
      const sp=skl.querySelector('.islot');
      if (sp && mine && !p.skillUsed) sp.onclick=()=>clickSkillSlot(p);
    }
    const steps=row.querySelector('.steps');
    if (winner===p) steps.textContent='👑 赢';
    else if (dists && dists[p.color]>=0) steps.textContent='距王座 '+dists[p.color];
    else steps.textContent='—';
  }
}
function clickInvSlot(p, i){          // 点击道具箱：🧱 立即 +1 墙；🔨 进入选墙模式
  if (winner) return;
  if (!isSyncMode() && cur()!==p){ toast('还没轮到你'); return; }
  const kind = p.inv[i]; if (!kind) return;
  if (kind==='wall'){
    if (isOnline()){
      if (hostSim()) hostApplyAction(p, {type:'itemuse', kind:'wall'});
      else { busy=true; setTimeout(()=>{busy=false;},2500); netSend({t:'act', a:{type:'itemuse', kind:'wall'}}); }
    }else{
      p.inv.splice(i,1); p.walls++; sPick(); renderPanel();
      toast(COLORS[p.color].name+' 使用 🧱：+1 堵墙');
    }
  }else{
    if (pendingItem==='hammer'){ pendingItem=null; renderPanel(); return; }   // 再点一次取消
    pendingItem='hammer';
    pendingSkill=null;                    // 与技能待选互斥
    renderPanel();
    toast('🔨 点击要击碎的墙');
  }
}
function clickSkillSlot(p){              // 点击技能槽：无目标技能立即放；有目标进入选择模式
  if (winner) return;
  if (!isSyncMode() && cur()!==p){ toast('还没轮到你'); return; }
  if (p.skillUsed || !p.skill) return;
  const sk=SKILLS.find(s=>s.id===p.skill); if (!sk) return;
  if (sk.target===null){
    if (isOnline()){
      if (hostSim()) hostApplyAction(p, {type:'skilluse', id:sk.id, t:null});
      else { busy=true; setTimeout(()=>{busy=false;},2500); netSend({t:'act', a:{type:'skilluse', id:sk.id, t:null}}); }
    }else if (!execSkill(p, sk.id, null)) toast('没有合适的位置');
    return;
  }
  if (pendingSkill===sk.id){ pendingSkill=null; renderPanel(); return; }   // 再点一次取消
  pendingItem=null;                      // 与道具待选互斥
  pendingSkill=sk.id;
  renderPanel();
  toast(sk.icon+' '+sk.name+'：'+(sk.id==='phase'?'点击身边想穿过的墙方向':'点击'+(sk.target==='pawn'?'目标角色':'要击碎的墙')));
}
function syncSelects(){

  document.getElementById('itemSel').value = String(itemsOn?itemInterval:0);

      '② 点击格线缝隙 = 放一堵墙（占2格，永久，自己颜色）<br>'+
