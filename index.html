<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>4位玩家，1位赢家，0个朋友 · 王座墙棋</title>
<style>
  :root{ --bg:#070b14; --text:#dfe7f5; --dim:#8fa0bd; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #101a30 0%, var(--bg) 60%);
    color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    overflow-x:hidden;
  }
  header{ text-align:center; padding:16px 12px 4px; }
  header h1{
    font-size:clamp(20px,3.4vw,30px); letter-spacing:1px; font-weight:800;
    background:linear-gradient(90deg,#5db9ff,#ff5d8f,#2ee38a,#ffb62e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .tag{ color:var(--dim); font-size:12px; margin-top:4px; letter-spacing:2px;}
  #wrap{ display:flex; gap:18px; align-items:flex-start; justify-content:center; padding:10px 14px 26px; flex:1; width:100%; max-width:1100px;}
  #boardBox{ position:relative; }
  canvas{ display:block; border-radius:14px; }
  #side{ width:300px; flex:0 0 300px; display:flex; flex-direction:column; gap:10px;}
  #leftbar{ width:170px; flex:0 0 170px; display:flex; flex-direction:column; gap:10px; align-self:stretch;}
  .logcard{ flex:0 0 auto; height:240px; display:flex; flex-direction:column; overflow:hidden;}
  #logBody{ flex:1 1 auto; min-height:0; overflow-y:auto; font-size:11px; line-height:1.8; color:var(--dim); scrollbar-width:thin;}
  #logBody::-webkit-scrollbar{ width:4px;}
  #logBody::-webkit-scrollbar-thumb{ background:#263252; border-radius:2px;}
  #logBody .lg{ display:flex; gap:5px; align-items:baseline;}
  #logBody .tno{ flex:0 0 auto; font-size:9.5px; color:#4d5a78;}
  #logBody b{ font-weight:700;}
  .lsk{ border:1px solid #263252; border-radius:12px; padding:10px; cursor:pointer; transition:.2s; background:rgba(22,32,58,.45);}
  .lsk .ico{ font-size:26px; line-height:1;}
  .lsk .nm{ font-size:13px; font-weight:700; margin:7px 0 4px; color:var(--text);}
  .lsk .ds{ font-size:11px; color:var(--dim); line-height:1.55;}
  .lsk:hover{ background:#1c2949; border-color:#33447a;}
  .lsk.dis{ opacity:.42; cursor:default; filter:grayscale(.75);}
  .lsk.dis:hover{ background:rgba(22,32,58,.45); border-color:#263252;}
  .lsk.arm{ border-color:#4a5f97; box-shadow:0 0 10px rgba(80,120,220,.45);}
  .lsk.armed{ border-color:#c9a227; box-shadow:0 0 10px rgba(230,200,90,.4); background:rgba(96,76,22,.28); cursor:pointer;}
  .lsk.armed:hover{ border-color:#e6c94f;}
  .lskbtns{ display:flex; gap:6px; margin-top:9px;}
  .lskbtns button{ flex:1; padding:5px 4px; font-size:12px; border-radius:8px;}
  .lslotwrap{ display:flex; gap:8px;}
  .lslot{ flex:1; min-height:48px; border:1.5px dashed #2c3a63; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; transition:.2s;}
  .lslot.mine{ border-style:solid; cursor:pointer;}
  .lslot.mine:hover{ background:#1c2949;}
  .lslot.on{ background:#263250; border-color:#4a5f97; box-shadow:0 0 6px rgba(80,120,220,.5);}
  .card{ background:rgba(13,19,34,.82); border:1px solid #1b2438; border-radius:14px; padding:12px;}
  .card h3{ font-size:12px; color:var(--dim); letter-spacing:2px; margin-bottom:8px; font-weight:600;}
  .prow{ display:flex; align-items:center; gap:8px 5px; padding:6px 8px; border-radius:10px; margin-bottom:6px; transition:.25s; border:1px solid transparent;}
  .prow.active{ background:rgba(255,255,255,.055); border-color:#263250;}
  .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 14px; box-shadow:0 0 8px 1px currentColor; background:currentColor;}
  .pname{ font-size:13px; font-weight:600; flex:1; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .tagyou{ font-size:10px; color:#0a0f1a; background:#cfe0ff; border-radius:6px; padding:1px 5px; font-weight:700; margin-right:3px;}
  .wnum{ font-size:11px; font-weight:700; color:currentColor; white-space:nowrap;}
  .itm{ font-size:13px; }
  .islot{ display:inline-block; min-width:20px; text-align:center; border-radius:6px; padding:1px 2px; margin-left:2px; border:1px solid transparent;}
  .islot.mine{ cursor:pointer; border-color:#2c3a63;}
  .islot.mine:hover{ background:#1c2949;}
  .islot.on{ background:#263250; border-color:#4a5f97; box-shadow:0 0 6px rgba(80,120,220,.5);}
  .skl{ font-size:13px; }
  .steps{ font-size:11px; color:var(--dim); flex:0 0 auto; text-align:right; white-space:nowrap;}
  button{
    background:#16203a; color:var(--text); border:1px solid #263252; border-radius:10px;
    padding:9px 10px; font-size:13px; cursor:pointer; font-family:inherit; transition:.15s;
  }
  button:hover{ background:#1c2949; border-color:#33447a;}
  button.primary{ background:linear-gradient(135deg,#1a56c9,#3f8cff); border-color:#4f8dff; font-weight:700;}
  button.primary:hover{ filter:brightness(1.12);}
  .btnrow{ display:flex; gap:8px; }
  .btnrow button{ flex:1; }
  select{
    width:100%; background:#16203a; color:var(--text); border:1px solid #263252;
    border-radius:10px; padding:9px 8px; font-size:13px; font-family:inherit; outline:none;
  }
  select:disabled, button:disabled{ opacity:.45; cursor:not-allowed; }
  input{
    width:100%; background:#16203a; color:var(--text); border:1px solid #263252;
    border-radius:10px; padding:9px 10px; font-size:14px; font-family:inherit; outline:none;
  }
  input:focus, select:focus{ border-color:#3f6fd8; }
  .netcode{ font-size:24px; text-align:center; letter-spacing:8px; font-weight:800; color:#fdca00; margin:2px 0 8px;}
  .nrow{ display:flex; align-items:center; gap:8px; padding:3px 6px; font-size:13px;}
  .ndim{ color:var(--dim); font-size:12px; line-height:1.6;}
  #hint{ font-size:12px; color:var(--dim); line-height:1.75;}
  #hint b{ color:var(--text);}
  #overlay{
    position:fixed; inset:0; background:rgba(4,7,14,.72); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #overlay.show{ display:flex;}
  .panel{
    background:linear-gradient(160deg,#121a2e,#0c1220); border:1px solid #27345a;
    border-radius:20px; padding:26px 32px; text-align:center; max-width:430px; width:92%;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .panel h2{ font-size:26px; margin-bottom:6px;}
  .panel .sub{ color:var(--dim); font-size:13px; margin-bottom:16px;}
  #rules{ text-align:left; font-size:13px; line-height:1.9; color:#c6d3ea; margin:4px 0 16px;}
  #rules b{ color:var(--gold, #fdca00);}
  .legend{ display:flex; gap:14px; justify-content:center; margin:8px 0 16px; font-size:12px; color:var(--dim); flex-wrap:wrap;}
  .legend span{ display:flex; align-items:center; gap:5px;}
  .legend i{ width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}
  #draft{
    position:fixed; inset:0; background:rgba(4,7,14,.82); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:60;
  }
  #draft.show{ display:flex;}
  .skrow{ display:flex; gap:12px; margin-top:14px; }
  .skcard{
    flex:1; min-width:110px; background:#0e1628; border:1px solid #27345a; border-radius:14px;
    padding:18px 10px; cursor:pointer; transition:.15s;
  }
  .skcard:hover{ border-color:#fdca00; transform:translateY(-4px); background:#14203a; }
  .skcard .ico{ font-size:30px; }
  .skcard .nm{ font-size:14px; font-weight:700; margin:8px 0 6px; color:#eaf0fb; }
  .skcard .ds{ font-size:11px; color:var(--dim); line-height:1.6; }
  @media (max-width:820px){
    #wrap{ flex-direction:column; align-items:center;}
    #boardBox{ order:-1;}
    #side{ width:100%; max-width:520px; flex:none; flex-direction:row; flex-wrap:wrap;}
    #side .card{ flex:1 1 45%;}
    #leftbar{ width:100%; max-width:520px; flex:none; flex-direction:row; flex-wrap:wrap; align-self:auto;}
    #leftbar .card{ flex:1 1 45%;}
    #leftbar .logcard{ flex:1 1 100%; height:150px;}
    .lskbtns button{ padding:11px 6px; font-size:13px; min-height:44px;}
    .lslot{ min-height:52px;}
    .islot{ min-width:40px; min-height:40px; display:inline-flex; align-items:center; justify-content:center; font-size:17px; padding:2px 5px; margin-left:4px;}
    select{ padding:12px 8px;}
    #side button{ min-height:44px;}
  }
  @media (max-width:480px){
    #side .card, #leftbar .card{ flex:1 1 100%;}
  }
  @media (max-width:520px){
    .panel{ padding:18px 16px; max-height:88vh; overflow-y:auto;}
    .panel h2{ font-size:20px;}
    .skrow{ flex-direction:column; gap:10px; margin-top:12px;}
    .skcard{ min-width:0; padding:12px 14px; display:grid; grid-template-columns:36px 1fr; column-gap:12px; align-items:center; text-align:left;}
    .skcard .ico{ font-size:26px; grid-row:1 / span 2;}
    .skcard .nm{ margin:0 0 3px;}
    .skcard .ds{ line-height:1.5;}
    .skcard:hover{ transform:none;}
  }
</style>
</head>
<body>
<header>
  <h1>4位玩家，1位赢家，0个朋友</h1>
  <div class="tag">四 人 抢 座 · 墙 棋 大 逃 杀</div>
</header>

<div id="wrap">
  <div id="leftbar">
    <div class="card"><h3>技能</h3><div id="skBarBody"></div></div>
    <div class="card"><h3>道具箱</h3><div id="invBarBody"></div></div>
    <div class="card logcard"><h3>动态</h3><div id="logBody"></div></div>
  </div>
  <div id="boardBox"><canvas id="cv"></canvas></div>
  <div id="side">
    <div class="card">
      <h3>玩家</h3>
      <div id="plist"></div>
    </div>
    <div class="card" id="netCard" style="display:none"></div>
    <div class="card">
      <h3>模式</h3>
      <select id="modeSel">
        <option value="pve">经典 · 我打 3 个 AI</option>
        <option value="hotseat">经典 · 4 人同屏热座</option>
        <option value="sync">同步 · 实时乱斗（我 + 3 AI）</option>
        <option value="syncspec">同步 · 4 AI 实时互坑（观战）</option>
        <option value="spectate">观战 · 4 个 AI 互坑</option>
        <option value="online">🌐 在线 · 好友联机</option>
      </select>
      <div style="height:8px"></div>
      <select id="sizeSel">
        <option value="9">地图 9×9 · 紧凑</option>
        <option value="11" selected>地图 11×11 · 标准</option>
        <option value="13">地图 13×13 · 大</option>
        <option value="15">地图 15×15 · 超大</option>
      </select>
      <div style="height:8px"></div>
      <select id="wallSel">
        <option value="5">每人 5 堵墙</option>
        <option value="8" selected>每人 8 堵墙</option>
        <option value="12">每人 12 堵墙</option>
        <option value="16">每人 16 堵墙</option>
        <option value="20">每人 20 堵墙</option>
      </select>
      <div style="height:8px"></div>
      <select id="itemSel">
        <option value="0" selected>道具：关闭</option>
        <option value="3">道具：每 3 秒刷新</option>
        <option value="5">道具：每 5 秒刷新</option>
        <option value="7">道具：每 7 秒刷新</option>
        <option value="10">道具：每 10 秒刷新</option>
      </select>
      <div style="height:8px"></div>
      <select id="disasterSel">
        <option value="3" selected>天灾：每 3 回合降临</option>
        <option value="10">天灾：每 10 回合降临</option>
        <option value="20">天灾：每 20 回合降临</option>
        <option value="0">天灾：关闭</option>
      </select>
      <div style="height:8px"></div>
      <select id="skillSel">
        <option value="1" selected>技能：开局 3 选 1</option>
        <option value="0">技能：关闭</option>
      </select>
      <div style="height:10px"></div>
      <div class="btnrow">
        <button class="primary" id="btnNew">开新一局</button>
        <button id="btnRules">规则</button>
      </div>
      <div style="height:8px"></div>
      <div class="btnrow">
        <button id="btnMute">🔊 音效</button>
        <button id="btnSpeed" title="AI 行棋速度">⚡ 正常</button>
      </div>
    </div>
    <div class="card" id="hint">
      <b>每回合二选一</b><br>
      ① 点击相邻格子 = 走一步（可跳过贴脸的棋子）<br>
      ② 点击格线缝隙 = 放一堵墙（占2格，永久，自己颜色）<br>
      <b>获胜</b>：第一个踏上中央 👑 王座。<br>
      墙不能穿过、不能重叠，也不许把任何人<b>彻底堵死</b>。
    </div>
  </div>
</div>

<div id="overlay"><div class="panel" id="ovPanel"></div></div>
<div id="draft"><div class="panel" id="dPanel"></div></div>

<script>
"use strict";
/* ================= 常量 ================= */
let N = 11;
const THRONE = {x:5, y:5};
const COLORS = {
  blue:  {main:'#0f9ceb', name:'蓝方', rgb:[15,156,235]},
  green: {main:'#17d76c', name:'绿方', rgb:[23,215,108]},
  red:   {main:'#e02955', name:'红方', rgb:[224,41,85]},
  orange:{main:'#f5a307', name:'橙方', rgb:[245,163,7]},
};
const SPAWN = {blue:{x:5,y:0}, green:{x:0,y:5}, red:{x:10,y:5}, orange:{x:5,y:10}};
function setBoardSize(n){          // 四家出生点到王座始终等距
  N = n; const c = (N-1)/2;
  THRONE.x = THRONE.y = c;
  SPAWN.blue = {x:c,y:0}; SPAWN.green = {x:0,y:c}; SPAWN.red = {x:N-1,y:c}; SPAWN.orange = {x:c,y:N-1};
}
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
/* ---- 技能池（开局每人随机抽 3 选 1，整局限用 1 次） ---- */
const SKILLS = [
  {id:'breakwall', icon:'💥', name:'墙面爆破', target:'wall', desc:'击碎棋盘上任意一堵墙'},
  {id:'phase',     icon:'👻', name:'穿墙',     target:'wall', desc:'穿过身边一堵墙，落到墙另一侧的空格'},
  {id:'steal',     icon:'🪓', name:'盗取道具', target:'pawn', desc:'夺取一名对手道具箱里的 1 个道具'},
  {id:'swap',      icon:'🔄', name:'换位',     target:'pawn', desc:'与指定角色互换位置'},
  {id:'swapcolor', icon:'🎨', name:'换色',     target:'pawn', desc:'与指定角色互换颜色（棋子与墙）'},
  {id:'freeze',    icon:'❄️', name:'定身术',   target:'pawn', desc:'指定角色 1 回合不可操作（同步模式冻结 3 秒）'},
  {id:'jump',      icon:'🎲', name:'随机跳跃', target:null,   desc:'随机传送到任意空格（不会落到王座附近）'},
  {id:'thronemove',icon:'👑', name:'王座随机换位', target:null, desc:'王座随机迁移到棋盘上另一处'},
  {id:'shuffle',   icon:'🌀', name:'指定角色随机换位', target:'pawn', desc:'把指定角色随机传送到任意空格'},
  {id:'sprint',    icon:'🏃', name:'疾跑',     target:null,   desc:'本回合可行动 2 次（同步模式 +2 操作点）'},
];
const INV_CAP = 2;   // 道具箱容量
/* ---- 道具表（宝箱随机开出；stun 开箱即触发不进箱） ---- */
const ITEMS = {
  wall:     {icon:'🧱', name:'城墙',       desc:'点击立即 +1 堵墙'},
  hammer:   {icon:'🔨', name:'碎墙锤',     desc:'点击后选一堵墙击碎'},
  restore:  {icon:'🔋', name:'技能恢复卡', desc:'点击恢复技能使用次数 1 次'},
  trap:     {icon:'🪤', name:'陷阱卡',     desc:'点击空格埋入陷阱（仅自己可见），踩中者掉回出生点'},
  confusion:{icon:'🌀', name:'混乱卡',     desc:'点击一名对手：其下一步方向上下左右颠倒'},
  stun:     {icon:'💫', name:'眩晕',       desc:'开箱即触发：拾取者暂停 1 回合'},
  shield:   {icon:'🛡️', name:'保护卡',     desc:'点击激活：免疫 1 次敌方指向性技能或陷阱（护盾状态仅自己可见）'},
};

/* ================= 状态 ================= */
let wallsH = new Set();   // "x,y"：横墙，挡住 (x,y-1)/(x,y) 与 (x+1,y-1)/(x+1,y) 的竖向通行
let wallsV = new Set();   // "x,y"：竖墙，挡住 (x-1,y)/(x,y) 与 (x-1,y+1)/(x,y+1) 的横向通行
let wallOwner = {};       // "h x,y" / "v x,y" -> color
let players = [];
let turnIdx = 0, winner = null, busy = false, turnCount = 0, passStreak = 0;
let mode = 'pve', wallStock = 8, muted = false, fastAI = false;
let itemsOn = false, itemInterval = 5, itemClock = 0;   // 道具系统：定时发到玩家道具箱
let disastersOn = true, disasterInterval = 3;     // 天灾系统：每 N 回合降下随机场地天灾
let collapsed = [], fireWalls = [];             // 地陷：塌陷格 {x,y,end} / 烈阳：火墙 {kind,x,y,end}（end=到期回合数）
let skillsOn = true;                            // 技能系统开关
let pendingSkill = null, pendingItem = null;    // 目标选择中：待确认的技能/道具
let skArming = null;                            // 左栏技能卡二次确认中：确认发起者的颜色
let draftTimer = 0, netSkillPicked = false;     // 联机选技：30s 代选定时器 / 本端已提交标记
let draft = null;                               // 开局选技 {offers:{color:[3个id]}, picked:{color:id}}
let confetti = [], fx = [], toastMsg = null;
let logLines = [];                                 // 操作日志：{t:回合数, text, color}
let boxes = [];                                    // 棋盘宝箱：{x, y, i:道具kind}
let traps = [];                                    // 棋盘陷阱：{x, y, o:埋设者color}（仅埋设方可见）
let aiTimer = null;
const SYNC_CD = 500;      // 同步模式：动作间隔（毫秒）
const SYNC_APMAX = 3;     // 同步模式：操作点上限
function isSyncMode(){ return mode==='sync' || mode==='syncspec' || mode==='onsync'; }
function isOnline(){ return mode==='online' || mode==='onsync'; }
function hostSim(){       // 在线模式下只有房主跑游戏逻辑（AI、道具、规则判定）
  return !isOnline() || (net.isHost && net.phase==='playing');
}

/* ---- 在线对战全局 ---- */
let myColor = null;                       // 我坐的颜色（blue/green/red/orange）
let netWatch = false;                     // 观战局：4 个座位全由 AI 打，全员围观
let netPending = [], netFlushQueued = false;
const net = { ws:null, phase:'idle', code:null, seat:null, isHost:false, roster:[], leaving:false, lastErr:null };

/* ================= 种子随机（可复现） ================= */
let RNGSEED = 1;
function srand(s){ RNGSEED = (s>>>0)||1; }
function rnd(){ RNGSEED = (RNGSEED*1103515245 + 12345) & 0x7fffffff; return RNGSEED/0x7fffffff; }
const Q = new URLSearchParams(location.search);
if (Q.get('mode')) mode = Q.get('mode');
const qw = +Q.get('walls');
if (Q.get('walls') && qw>=1) wallStock = Math.min(20, qw);
if (Q.get('size')){ const n=+Q.get('size'); if([9,11,13,15].includes(n)) setBoardSize(n); }
if (Q.get('item')){ const v=+Q.get('item'); if([3,5,7,10].includes(v)){ itemsOn=true; itemInterval=v; } }
if (Q.get('skill')==='0') skillsOn = false;
if (Q.get('disaster')==='0'){ disastersOn = false; } else if (Q.get('disaster')){ const di=+Q.get('disaster'); if([3,10,20].includes(di)){ disasterInterval=di; } }
if (Q.get('fast') === '1') fastAI = true;
srand(Q.get('seed') ? +Q.get('seed') : ((Date.now()*2654435761)>>>0));

/* ================= 音效（WebAudio 合成） ================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, gain, slide){
  if (muted) return; const c = ac(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), c.currentTime+dur);
    g.gain.setValueAtTime(gain||.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+.03);
  }catch(e){}
}

/* ================= 规则核心 ================= */
const K=(x,y)=>x+','+y;
const inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;

function blocked(x1,y1,x2,y2){
  if (x2===x1+1) return wallsV.has(K(x2,y1)) || wallsV.has(K(x2,y1-1));
  if (x2===x1-1) return wallsV.has(K(x1,y1)) || wallsV.has(K(x1,y1-1));
  if (y2===y1+1) return wallsH.has(K(x1,y2)) || wallsH.has(K(x1-1,y2));
  if (y2===y1-1) return wallsH.has(K(x1,y1)) || wallsH.has(K(x1-1,y1));
  return true;
}
function pawnAt(x,y){ return players.find(p=>!p.left && p.cell.x===x && p.cell.y===y); }
function cur(){ return players[turnIdx]; }

function bfsFromThrone(wH, wV){
  const reach = new Uint8Array(N*N), dist = new Int16Array(N*N).fill(-1);
  const q=[[THRONE.x,THRONE.y]]; const si=THRONE.y*N+THRONE.x;
  reach[si]=1; dist[si]=0;
  for(let h=0;h<q.length;h++){
    const [x,y]=q[h], d=dist[y*N+x];
    for(const[dx,dy]of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inB(nx,ny) || isCollapsed(nx,ny)) continue;   // 🕳️ 塌陷格视为不可通行（连通性/合法墙位一并感知）
      if (dx===1)  { if (wV.has(K(nx,y))||wV.has(K(nx,y-1))) continue; }
      else if(dx===-1){ if (wV.has(K(x,y))||wV.has(K(x,y-1))) continue; }
      else if(dy===1) { if (wH.has(K(x,ny))||wH.has(K(x-1,ny))) continue; }
      else            { if (wH.has(K(x,y))||wH.has(K(x-1,y))) continue; }
      const i=ny*N+nx;
      if(!reach[i]){ reach[i]=1; dist[i]=d+1; q.push([nx,ny]); }
    }
  }
  return {reach, dist};
}
function everyoneHasPath(wH, wV){
  const {reach} = bfsFromThrone(wH, wV);
  return players.every(p=>p.left || reach[p.cell.y*N+p.cell.x]);
}
function allDists(wH, wV){
  const {dist} = bfsFromThrone(wH||wallsH, wV||wallsV);
  const m={}; for(const p of players) if(!p.left) m[p.color]=dist[p.cell.y*N+p.cell.x];
  return m;
}

function legalMoves(p){
  const res=[]; const {x,y}=p.cell;
  for(const[dx,dy]of DIRS){
    const nx=x+dx, ny=y+dy;
    if(!inB(nx,ny)||blocked(x,y,nx,ny)||isCollapsed(nx,ny)) continue;
    const occ = pawnAt(nx,ny);
    if(!occ) res.push({x:nx,y:ny});
    else{
      const jx=nx+dx, jy=ny+dy;   // 直线跳过贴脸棋子
      if(inB(jx,jy)&&!blocked(nx,ny,jx,jy)&&!pawnAt(jx,jy)&&!isCollapsed(jx,jy)) res.push({x:jx,y:jy});
    }
  }
  return res;
}

function wallBoundsOK(kind,x,y){
  return kind==='h' ? (x>=0&&x<=N-2&&y>=1&&y<=N-1)
                    : (x>=1&&x<=N-1&&y>=0&&y<=N-2);
}
function wallClash(kind,x,y){
  if(kind==='h'){
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y&&Math.abs(a-x)<2) return true; }
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x+1&&b===y-1) return true; }
  }else{
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x&&Math.abs(b-y)<2) return true; }
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y+1&&a===x-1) return true; }
  }
  return false;
}
function wallOK(kind,x,y){
  if(!wallBoundsOK(kind,x,y)) return false;
  if(wallClash(kind,x,y)) return false;
  const sH = kind==='h' ? new Set(wallsH) : wallsH;
  const sV = kind==='v' ? new Set(wallsV) : wallsV;
  if(kind==='h') sH.add(K(x,y)); else sV.add(K(x,y));
  return everyoneHasPath(sH, sV);
}
function allWallSpots(){
  const out=[];
  for(let y=1;y<N;y++) for(let x=0;x<N-1;x++) if(wallOK('h',x,y)) out.push(['h',x,y]);
  for(let y=0;y<N-1;y++) for(let x=1;x<N;x++) if(wallOK('v',x,y)) out.push(['v',x,y]);
  return out;
}
function hasAnyAction(p){
  if (legalMoves(p).length) return true;
  return p.walls>0 && allWallSpots().length>0;
}

/* ---- 开局选技（每人从 10 个技能随机抽 3 选 1；AI 自动；全选完才开局） ---- */
function startDraft(){
  draft = {offers:{}, picked:{}, queue:[]};
  for(const p of players){
    const pool=[...SKILLS];
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    p.skill=null; p.skillUsed=false;
    p.skillOffer = pool.slice(0,3).map(s=>s.id);
    draft.offers[p.color]=[...p.skillOffer];
    if (p.ai) pickSkill(p, aiPickSkill(p.skillOffer), true);   // AI 按强度选
  }
  draft.queue = players.filter(p=>!p.ai).map(p=>p.color);
  if (!draft.queue.length){ draftDone(); return; }
  showDraft();
}
function pickSkill(p, id, silent){
  if (!p || p.skill || !p.skillOffer.includes(id)) return;
  p.skill=id; p.skillOffer=[];
  if (draft) draft.picked[p.color]=id;
  const s0=SKILLS.find(x=>x.id===id);
  if (s0) logPush('选定技能 '+s0.icon+' '+s0.name, p.color);
  renderPanel();
  if (!silent) sPick();
}
function showDraft(color){
  const c = color || draft.queue[0];             // 本地热座按队列；联机直接指定颜色
  const p = players.find(q=>q.color===c); if (!p){ draftDone(); return; }
  const d=document.getElementById('dPanel');
  d.innerHTML = `<h2><span style="color:${COLORS[p.color].main}">●</span> ${COLORS[p.color].name}：选择本局技能</h2>
    <div class="sub">免费即时 · 整局限用 1 次 · 全员选完自动开局</div>
    <div class="skrow">`+
    draft.offers[p.color].map(id=>{
      const s=SKILLS.find(x=>x.id===id);
      return `<div class="skcard" data-id="${id}"><div class="ico">${s.icon}</div><div class="nm">${s.name}</div><div class="ds">${s.desc}</div></div>`;
    }).join('')+`</div>`;
  document.getElementById('draft').classList.add('show');
  for(const el of d.querySelectorAll('.skcard'))
    el.onclick=()=>onDraftPick(c, el.dataset.id);
}
function draftNext(){
  draft.queue = draft.queue.filter(c=>!draft.picked[c]);
  if (draft.queue.length){ showDraft(); return; }
  document.getElementById('draft').classList.remove('show');
  draftDone();
}
function draftDone(){
  draft = null;
  if (!isSyncMode()){ autoPassIfNeeded(); scheduleAI(); }
}
/* ---- 联机选技：房主权威，各端并行选，30 秒未选按 AI 强度代选 ---- */
function startDraftOnline(){
  clearTimeout(draftTimer);
  draft = {offers:{}, picked:{}, queue:[]};
  for(const p of players){
    const pool=[...SKILLS];
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    p.skill=null; p.skillUsed=false;
    p.skillOffer = pool.slice(0,3).map(s=>s.id);
    draft.offers[p.color]=[...p.skillOffer];
    if (p.ai) pickSkill(p, aiPickSkill(p.skillOffer), true);
  }
  netSkillPicked=false;
  const me = players.find(p=>p.color===myColor && !p.ai && !p.left);
  if (me && !draft.picked[me.color]) showDraft(me.color);   // 房主真人：弹自己的 3 选 1
  else checkNetDraftDone();
  draftTimer = setTimeout(draftTimeout, 30000);
}
function onDraftPick(color, id){
  const p = players.find(q=>q.color===color); if (!p || !draft) return;
  if (!isOnline()){ pickSkill(p, id); draftNext(); return; }   // 本地热座：按队列逐个选
  document.getElementById('draft').classList.remove('show');
  if (net.isHost){ pickSkill(p, id); netEv({type:'skill'}); netFlush(); checkNetDraftDone(); }
  else { netSend({t:'act', a:{type:'skillpick', id}}); netSkillPicked=true; }   // 远端：提交房主，等快照
}
function checkNetDraftDone(){
  if (!draft) return;
  if (players.some(p=>!p.ai && !p.left && !draft.picked[p.color])) return;
  clearTimeout(draftTimer);
  document.getElementById('draft').classList.remove('show');
  draftDone();
  netFlush();                                    // 广播 draft:null，全员开局
}
function draftTimeout(){
  if (!draft) return;
  for(const p of players){
    if (!p.ai && !p.left && !draft.picked[p.color])
      pickSkill(p, aiPickSkill(draft.offers[p.color]||[]), true);
  }
  netEv({type:'skill'}); netFlush();
  checkNetDraftDone();
}
function refreshNetDraft(){                      // 远端收到快照：同步选技遮罩
  const ov=document.getElementById('draft'); if (!ov) return;
  if (!isOnline() || net.isHost || netWatch || !myColor) return;   // 本地/房主：遮罩自己管
  const me = players.find(p=>p.color===myColor && !p.ai && !p.left);
  if (draft && me && !draft.picked[myColor] && !netSkillPicked && draft.offers[myColor])
    showDraft(myColor);
  else
    ov.classList.remove('show');
}

/* ================= 行动执行 ================= */
function spendAP(p){ p.ap = Math.max(0, p.ap-1); p.lastAct = performance.now(); }
function doMove(p, cell){
  if (p.confused){                        // 🌀 混乱：目标格以棋子为中心镜像（上下左右颠倒）
    p.confused = false;
    const mx = 2*p.cell.x - cell.x, my = 2*p.cell.y - cell.y;
    if (legalMoves(p).some(c=>c.x===mx&&c.y===my)){
      cell = {x:mx, y:my};
      logPush('🌀 混乱生效：方向被颠倒！', p.color);
    }                                     // 镜像格不可走：仍按原方向走（混乱落空），避免卡死
  }
  const jump = Math.abs(p.cell.x-cell.x)+Math.abs(p.cell.y-cell.y) > 1;
  p.tween = {fx:p.cell.x, fy:p.cell.y, t0:performance.now()};
  p.cell = {x:cell.x, y:cell.y};
  passStreak = 0; turnCount++;
  netEv({type:'move', color:p.color, jump});
  logPush(jump?'跳过一个棋子 →('+cell.x+','+cell.y+')':'走一步 →('+cell.x+','+cell.y+')', p.color);
  jump ? sJump() : sMove();
  if (cell.x===THRONE.x && cell.y===THRONE.y){ endGame(p); return; }
  afterStep(p, cell);                    // 落格结算：陷阱 → 宝箱（传送类技能不经过这里，天然不触发）
  if (isSyncMode()){
    if (p.rainBoost){ p.rainBoost=false; toast('🌧️ 暴雨冲刺：本次行动不耗操作点'); }
    else spendAP(p);
    expireDisasters(); maybeDisaster();
    renderPanel();
    return;
  }
  if (p.extraActs>0){ p.extraActs--; toast('💨 疾跑：可再行动一次'); renderPanel(); scheduleAI(); return; }
  nextTurn();
}
function execSmashWall(p, kind, x, y){   // 免费即时：击碎一堵墙（🔨 道具与 💥 墙面爆破共用）
  (kind==='h'?wallsH:wallsV).delete(K(x,y));
  delete wallOwner[kind+' '+K(x,y)];
  sSmash();
  netEv({type:'smash', color:p.color, kind, x, y});
  fx.push({type:'smash', kind, x, y, t0:performance.now()});
  renderPanel();
}
function useHammer(p, kind, x, y){       // 消耗道具箱里的 🔨 并击碎一堵墙
  const i = p.inv.indexOf('hammer');
  if (i<0) return false;
  p.inv.splice(i,1);
  logPush('用 🔨 砸碎一堵墙', p.color);
  execSmashWall(p, kind, x, y);
  return true;
}

/* ---- 技能执行（免费即时：不耗回合/操作点、不结束回合；整局每人限 1 次） ---- */
const paintOf = c => { const q=players.find(x=>x.color===c); return (q && q.paint) || c; };
const cheb = (x,y,c) => Math.max(Math.abs(x-c.x), Math.abs(y-c.y));

function randCell(filter){                     // 随机空格（不在王座上，可附加过滤条件）
  const cands=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if (!pawnAt(x,y) && !isCollapsed(x,y) && !(x===THRONE.x&&y===THRONE.y) && (!filter||filter(x,y))) cands.push({x,y});
  return cands.length? cands[Math.floor(rnd()*cands.length)] : null;
}
function throneMovable(x,y){                   // 王座迁到 (x,y) 是否人人仍有路（临时换座验证）
  const ox=THRONE.x, oy=THRONE.y;
  THRONE.x=x; THRONE.y=y;
  const ok = everyoneHasPath(wallsH, wallsV);
  THRONE.x=ox; THRONE.y=oy;
  return ok;
}
function teleport(pawn, cell){                 // 传送并带动 90ms 滑动动画
  pawn.tween = {fx:pawn.cell.x, fy:pawn.cell.y, t0:performance.now()};
  pawn.cell = {x:cell.x, y:cell.y};
}
function shieldBlockSkill(p, v, sk){       // 🛡️ 护盾挡下指向性技能：技能照常消耗、效果免疫（特效全员可见）
  v.shield = false;
  p.skillUsed = true;
  fx.push({type:'shieldpop', x:v.cell.x, y:v.cell.y, t0:performance.now()});
  netEv({type:'shieldfx', color:v.color});
  netEv({type:'skill', fx:'pick'});
  sPick();
  toast('🛡️ '+COLORS[v.color].name+' 的护盾挡下了 '+sk.icon+' '+sk.name+'！');
  logPush('释放 '+sk.icon+' '+sk.name+'，被 🛡️ 护盾挡下', p.color);
  renderPanel();
  return true;
}

function execSkill(p, id, t){                  // t：{kind,x,y}=墙 / {dx,dy}=穿墙方向 / {color}=角色 / null
  const sk = SKILLS.find(s=>s.id===id);
  if (!sk || p.skill!==id || p.skillUsed) return false;
  let done = false;
  switch(id){
    case 'breakwall': {                        // 💥 击碎任意一堵墙（复用锤子逻辑）
      const set = t.kind==='h'?wallsH:wallsV;
      if (!set.has(K(t.x,t.y))) return false;
      execSmashWall(p, t.kind, t.x, t.y);
      done = true; break; }
    case 'phase': {                            // 👻 穿过身边一堵墙，落到另一侧空格
      const nx=p.cell.x+t.dx, ny=p.cell.y+t.dy;
      if (!inB(nx,ny) || isCollapsed(nx,ny) || pawnAt(nx,ny) || !blocked(p.cell.x,p.cell.y,nx,ny)) return false;
      teleport(p, {x:nx,y:ny}); sJump();
      netEv({type:'skill', fx:'jump'}); done = true;
      if (p.cell.x===THRONE.x && p.cell.y===THRONE.y){   // 穿墙直达王座：直接获胜
        p.skillUsed = true; renderPanel(); endGame(p); return true;
      }
      break; }
    case 'steal': {                            // 🪓 夺取目标道具箱里 1 个道具
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p || !v.inv.length) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      p.inv.push(v.inv.pop());
      sPick(); netEv({type:'skill', fx:'pick'});
      toast(COLORS[p.color].name+' 🪓 夺走了 '+COLORS[v.color].name+' 的道具');
      done = true; break; }
    case 'swap': {                             // 🔄 与目标互换位置
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      const a={...p.cell}, b={...v.cell};
      teleport(p, b); teleport(v, a);
      sJump(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'swapcolor': {                        // 🎨 与目标互换显示色（棋子与墙）
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      const da=p.paint||p.color, db=v.paint||v.color;
      p.paint=db; v.paint=da;
      sPick(); netEv({type:'skill', fx:'pick'}); done = true; break; }
    case 'freeze': {                           // ❄️ 定身：经典=下回合跳过 / 同步=3 秒不能动
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      if (isSyncMode()) v.frozenUntil = performance.now()+3000;
      else v.frozenTurns = 1;
      fx.push({type:'freeze', x:v.cell.x, y:v.cell.y, t0:performance.now()});
      sPick(); netEv({type:'skill', fx:'pick'}); done = true; break; }
    case 'jump': {                             // 🎲 随机跳跃（落点距王座 ≥4 格）
      const c = randCell((x,y)=>cheb(x,y,THRONE)>=4);
      if (!c) return false;
      teleport(p, c); sJump(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'thronemove': {                       // 👑 王座随机迁移（离所有棋子 ≥2 格且人人可达）
      const c = randCell((x,y)=>players.every(q=>q.left||cheb(x,y,q.cell)>=2) && throneMovable(x,y));
      if (!c) return false;
      THRONE.x=c.x; THRONE.y=c.y;
      fx.push({type:'throne', x:c.x, y:c.y, t0:performance.now()});
      sWall(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'shuffle': {                          // 🌀 把目标随机传送到任意空格
      const v=players.find(q=>q.color===t.color);
      if (!v || v===p) return false;
      if (v.shield) return shieldBlockSkill(p, v, sk);
      const c = randCell();
      if (!c) return false;
      teleport(v, c); sJump(); netEv({type:'skill', fx:'jump'}); done = true; break; }
    case 'sprint': {                           // 🏃 疾跑：经典=本回合多 1 次行动 / 同步=+2 操作点
      if (isSyncMode()) p.ap = Math.min(SYNC_APMAX, p.ap+2);
      else p.extraActs += 1;
      sPick(); netEv({type:'skill', fx:'pick'}); done = true; break; }
  }
  if (!done) return false;
  p.skillUsed = true;
  logPush('释放技能 '+sk.icon+' '+sk.name, p.color);
  renderPanel();
  return true;
}
function doWall(p, kind, x, y){
  (kind==='h'?wallsH:wallsV).add(K(x,y));
  wallOwner[kind+' '+K(x,y)] = p.color;
  p.walls--;
  passStreak = 0; turnCount++;
  sWall();
  netEv({type:'wall', color:p.color, kind, x, y});
  logPush('放了一堵墙', p.color);
  fx.push({type:'wallpop', kind, x, y, t0:performance.now()});
  if (isSyncMode()){
    if (p.rainBoost){ p.rainBoost=false; toast('🌧️ 暴雨冲刺：本次行动不耗操作点'); }
    else spendAP(p);
    expireDisasters(); maybeDisaster();
    renderPanel();
    return;
  }
  if (p.extraActs>0){ p.extraActs--; toast('💨 疾跑：可再行动一次'); renderPanel(); scheduleAI(); return; }
  nextTurn();
}

/* ================= 天灾系统 ================= */
const DISASTERS = {
  acid:   {icon:'☔', name:'酸雨'},
  thunder:{icon:'⚡', name:'暴雷'},
  sink:   {icon:'🕳️', name:'地陷'},
  rain:   {icon:'🌧️', name:'暴雨'},
  sun:    {icon:'☀️', name:'烈阳'},
  bang:   {icon:'💥', name:'大爆炸'},
};
function isCollapsed(x,y){ return collapsed.some(c=>c.x===x&&c.y===y); }
function shuffleArr(a){                     // 天灾专用洗牌（走 rnd() 种子随机）
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function removeWall(kind,x,y){              // 天灾拆墙：清墙身 + 归属 + 火墙档案（防陈旧档案日后误删同坐标新墙）
  (kind==='h'?wallsH:wallsV).delete(K(x,y));
  delete wallOwner[kind+' '+K(x,y)];
  const fi = fireWalls.findIndex(f=>f.kind===kind&&f.x===x&&f.y===y);
  if (fi>=0) fireWalls.splice(fi,1);
}
function expireDisasters(){                 // 天灾到期结算（仅主机/单机）：火墙烧尽 / 塌陷格恢复
  if (!hostSim() || winner) return;
  const fOut = fireWalls.filter(f=>f.end<=turnCount);
  if (fOut.length){
    for (const f of fOut) removeWall(f.kind, f.x, f.y);
    logPush('☀️ '+fOut.length+' 面火墙烧尽熄灭', null);
  }
  const cOut = collapsed.filter(c=>c.end<=turnCount);
  if (cOut.length){
    collapsed = collapsed.filter(c=>c.end>turnCount);
    for (const c of cOut) fx.push({type:'sinkhole', x:c.x, y:c.y, up:true, t0:performance.now()});
    logPush('🕳️ '+cOut.length+' 个塌陷格恢复如初', null);
  }
}
function maybeDisaster(){                    // 天灾调度：经典每 N 手 / 同步每 N*4 次行动
  if (!disastersOn || winner || !hostSim()) return;
  const every = isSyncMode() ? disasterInterval*4 : disasterInterval;
  if (turnCount % every !== 0) return;
  const kind = Object.keys(DISASTERS)[Math.floor(rnd()*6)];
  const D = DISASTERS[kind];
  logPush(D.icon+' 天灾降临：'+D.name, null);
  const extra = ({acid:disasterAcid, thunder:disasterThunder, sink:disasterSink,
                  rain:disasterRain, sun:disasterSun, bang:disasterBang})[kind]() || {};
  netEv({type:'disaster', kind, ...extra});
  disasterFx(kind, extra);
  toast(D.icon+' 天灾降临：'+D.name+'！');
  renderPanel();
}
function disasterAcid(){                     // ☔ 酸雨：随机腐蚀约 1/3 的既有墙面
  const list=[];
  for (const key of wallsH) list.push(['h', ...key.split(',').map(Number)]);
  for (const key of wallsV) list.push(['v', ...key.split(',').map(Number)]);
  if (!list.length){ logPush('☔ 酸雨落下，但场上没有墙可腐蚀', null); return {}; }
  const n = Math.max(1, Math.floor(list.length/3));
  for (const w of shuffleArr(list).slice(0,n)){
    fx.push({type:'smash', kind:w[0], x:w[1], y:w[2], t0:performance.now()});
    removeWall(w[0], w[1], w[2]);
  }
  sSmash();
  logPush('☔ 酸雨腐蚀了 '+n+' 堵墙', null);
  return {count:n};
}
function disasterThunder(){                  // ⚡ 暴雷：劈中约 1/4 棋盘区域，区内棋子眩晕 1 回合
  const half = Math.ceil(N/2);
  const qx = rnd()<0.5? 0 : N-half, qy = rnd()<0.5? 0 : N-half;
  const hits = players.filter(p=>!p.left && p.cell.x>=qx && p.cell.x<qx+half && p.cell.y>=qy && p.cell.y<qy+half);
  for (const p of hits) applyStun(p);
  logPush(hits.length
    ? '⚡ 暴雷劈中 '+hits.map(p=>COLORS[p.color].name).join('、')+'，眩晕 1 回合'
    : '⚡ 暴雷劈下，无人被击中', null);
  return {x:qx, y:qy, w:half};
}
function spawnDrop(p){                       // 掉回出生点（出生点被占则滑落到最近空格）
  const s = SPAWN[p.color];
  if (!pawnAt(s.x,s.y) && !isCollapsed(s.x,s.y)){ teleport(p, s); return; }
  let best=null, bd=1e9;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if (pawnAt(x,y) || isCollapsed(x,y) || (x===THRONE.x&&y===THRONE.y)) continue;
    const d = Math.abs(x-s.x)+Math.abs(y-s.y);
    if (d<bd){ bd=d; best={x,y}; }
  }
  if (best) teleport(p, best);
}
function disasterSink(){                     // 🕳️ 地陷：约 1/5 格子塌陷 2 回合；塌陷格不可移入，塌上者掉回出生点
  const cands=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if (x===THRONE.x&&y===THRONE.y) continue;                                  // 王座不塌
    if (isCollapsed(x,y) || boxes.some(b=>b.x===x&&b.y===y) || traps.some(t=>t.x===x&&t.y===y)) continue;
    if (Object.values(SPAWN).some(s=>s.x===x&&s.y===y)) continue;              // 出生点不塌：保证掉落落点安全
    cands.push({x,y});
  }
  if (!cands.length) return {};
  const picked = shuffleArr(cands).slice(0, Math.min(cands.length, Math.floor(N*N/5)));
  for (const c of picked){
    collapsed.push({x:c.x, y:c.y, end:turnCount+2});
    fx.push({type:'sinkhole', x:c.x, y:c.y, t0:performance.now()});
  }
  sSmash();
  logPush('🕳️ '+picked.length+' 个格子塌陷（2 回合后恢复）', null);
  for (const p of players){
    if (p.left || !picked.some(c=>c.x===p.cell.x&&c.y===p.cell.y)) continue;
    spawnDrop(p);
    logPush('🕳️ '+COLORS[p.color].name+' 随地面塌陷掉回出生点', p.color);
  }
  return {cells: picked.map(c=>[c.x,c.y])};
}
function disasterRain(){                     // 🌧️ 暴雨：冲走所有玩家道具，每人下回合可多行动一次
  for (const p of players){
    if (p.left) continue;
    if (p.inv.length) logPush('🌧️ 冲走了 '+COLORS[p.color].name+' 身上的 '+p.inv.map(i=>ITEMS[i].icon).join(''), p.color);
    p.inv = [];
    p.rainBoost = true;
  }
  return {};
}
function disasterSun(){                      // ☀️ 烈阳：随机点燃 10 面火墙（无主），2 回合后烧尽
  let placed=0;
  for (const s of shuffleArr(allWallSpots().slice())){
    if (placed>=10) break;
    const [kind,x,y]=s;
    if (!wallOK(kind,x,y)) continue;         // 候选基于落墙前快照，逐面复验避免互相冲突/断路
    (kind==='h'?wallsH:wallsV).add(K(x,y));
    wallOwner[kind+' '+K(x,y)] = null;       // 无主之火：不计入任何玩家的墙数
    fireWalls.push({kind, x, y, end:turnCount+2});
    fx.push({type:'sunfx', kind, x, y, t0:performance.now()});
    placed++;
  }
  if (placed){ sWall(); logPush('☀️ 烈阳点燃了 '+placed+' 面火墙（2 回合后烧尽）', null); }
  else logPush('☀️ 烈阳当空，但无处可以起火', null);
  return {count:placed};
}
function disasterBang(){                     // 💥 大爆炸：王座/玩家/墙面全部随机换位，逐堵复验保证人人可达（不可完全闭合）
  const owners=[];                           // 先收割真实墙归属（火墙无主，直接炸灭不重放）
  for (const k in wallOwner){
    if (!wallOwner[k]) continue;
    const [x,y]=k.slice(2).split(',').map(Number);
    owners.push([k[0], x, y, wallOwner[k]]);
  }
  wallsH.clear(); wallsV.clear(); wallOwner={}; fireWalls=[]; collapsed=[];
  const pool=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if (!Object.values(SPAWN).some(s=>s.x===x&&s.y===y)) pool.push({x,y});
  shuffleArr(pool);
  const t = pool.pop();                      // 新王座：任意非出生点格
  THRONE.x=t.x; THRONE.y=t.y;
  fx.push({type:'throne', x:t.x, y:t.y, t0:performance.now()});
  const taken = new Set([t.y*N+t.x]);
  for (const p of players){                  // 玩家随机落位：互不重叠、不占王座
    if (p.left) continue;
    const c = pool.find(c=>!taken.has(c.y*N+c.x));
    if (!c) break;
    taken.add(c.y*N+c.x);
    teleport(p, c);
  }
  let walls=0;
  for (const s of shuffleArr(allWallSpots().slice())){   // 幸存墙换到全新随机位置（owner 保留）
    if (walls>=owners.length) break;
    const [kind,x,y]=s;
    if (!wallOK(kind,x,y)) continue;
    (kind==='h'?wallsH:wallsV).add(K(x,y));
    wallOwner[kind+' '+K(x,y)] = owners[walls][3];
    walls++;
  }
  sSmash(); sWall();
  logPush('💥 大爆炸！棋盘格局重组（'+walls+'/'+owners.length+' 堵墙幸存）', null);
  return {tx:THRONE.x, ty:THRONE.y};
}
function disasterFx(kind, extra){            // 天灾屏幕级特效（本地触发与远端 applyEvent 共用）
  fx.push({type:'dfx', kind, t0:performance.now(), ...extra});
}
function nextTurn(){
  if (winner) return;
  expireDisasters();                       // 天灾到期结算：地陷恢复 / 火墙熄灭
  maybeDisaster();                         // 天灾：每 3 回合降下一次
  cur().extraActs=0;                       // 疾跑加行动只在当回合有效（防 pass 残留）
  turnIdx = (turnIdx+1)%players.length;
  let guard = players.length*2;            // 防多人同时被定身导致死循环
  while (guard-- > 0 && !winner){
    const f = cur();
    if (f.frozenTurns>0 && !f.left){       // ❄️ 定身 / 💫 眩晕：跳过该回合
      f.frozenTurns--;
      const st = f.stunTag;
      if (f.frozenTurns<=0) f.stunTag = false;
      toast((st?'💫 ':'❄️ ')+COLORS[f.color].name+(st?' 眩晕中，跳过回合':' 被定身，跳过回合'));
      logPush(st?'💫 眩晕中，跳过回合':'❄️ 被定身，跳过回合', f.color);
      netEv({type:'pass', color:f.color});
      passStreak++;
      turnIdx = (turnIdx+1)%players.length;
      continue;
    }
    if (f.rainBoost){                      // 🌧️ 暴雨加成：轮到该玩家时兑现 +1 次行动
      f.rainBoost = false; f.extraActs++;
      toast('🌧️ 暴雨加成：'+COLORS[f.color].name+' 本回合可多行动一次');
    }
    break;
  }
  renderPanel();
  autoPassIfNeeded();
  scheduleAI();
}
function autoPassIfNeeded(){

    passStreak++;
    if (passStreak >= players.length*2){ endDraw(); return; }
    turnIdx = (turnIdx+1)%players.length;
    renderPanel();
    autoPassIfNeeded();

}
